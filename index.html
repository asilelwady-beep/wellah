<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ولّعها</title><meta name="theme-color" content="#093d3a"><link id="manifest" rel="manifest" href="/manifest/customer.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:system-ui,Tahoma,sans-serif;color:#193034;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}header{background:#093d3a;color:#fff;padding:20px max(4vw,18px);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:30px}header small{color:#b9e4d4}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;background:#09745e;color:white;font:inherit;cursor:pointer}button:hover{filter:brightness(.92)}button:disabled{opacity:.5;cursor:default}nav button{background:#17675d}nav .on{background:#f6c765;color:#143833}main{max-width:1100px;margin:24px auto;padding:0 18px}.notice{background:#fff4d2;border:1px solid #e7ce75;padding:13px;border-radius:12px;margin-bottom:20px}h2{margin:24px 0 14px}h3{margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:white;border:1px solid #e2e9e6;border-radius:16px;padding:18px;box-shadow:0 4px 18px #13392b0a;margin:0 0 14px}.muted{color:#61736e;font-size:14px}.price{font-size:20px;font-weight:800;color:#076f58}label{display:block;margin:12px 0 5px;font-weight:650}input,select,textarea{width:100%;padding:12px;border:1px solid #bed2c9;border-radius:10px;background:#fff;font:inherit;color:#173833}textarea{min-height:76px}input[type=file]{padding:8px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.stack button{margin:5px 0 0 6px}.tag{display:inline-block;background:#e2f4e9;color:#126744;border-radius:99px;padding:4px 9px;font-size:12px;margin:4px 0}.pill{background:#f6f9f8;border-radius:9px;padding:9px;margin-top:8px}.bad{color:#a13b22}.ok{color:#087b5b}.service{display:none}.service.active{display:block}.empty{padding:22px;background:#fff;border-radius:12px}.wide{grid-column:1/-1}.summary{position:sticky;bottom:8px;background:#def2e8;border:1px solid #a5d9bd;padding:12px;border-radius:12px;margin:16px 0}.small{font-size:13px}.section{border-top:1px solid #e2e9e6;margin-top:15px;padding-top:13px}
.map{height:320px;border-radius:14px;border:1px solid #bed2c9;margin:12px 0;z-index:0}.map-legend{color:#61736e;font-size:13px}.catalog-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:10px 0 18px}.catalog-tools label{min-width:190px;flex:1;margin:0}.admin-menu{position:sticky;top:0;z-index:3;display:flex;gap:8px;overflow-x:auto;background:#f3f7f5;padding:10px 0;margin-bottom:14px}.admin-menu button{white-space:nowrap;background:#e2f4e9;color:#075743}.admin-menu button:hover{background:#c4e9d4}[id^="admin-"]{scroll-margin-top:82px}</style></head><body><header><div><h1>ولّعها 🔥</h1><small>البدرشين وقراها · خدمات التوصيل والمشاوير</small></div><nav><button id="install" onclick="installApp()" style="display:none">تثبيت الواجهة</button><button id="reload" onclick="refresh()" style="display:none">تحديث الطلبات</button><button id="logout" onclick="logout()" style="display:none">تسجيل الخروج</button></nav></header><main><div class="notice">الأسعار ورسوم التوصيل المعروضة تجريبية حتى يراجعها المسؤول. لا تحول أي مبالغ قبل التأكد من بيانات الطلب معه.</div><div id="app"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/maps.js"></script><script>
let state,offline=false,tab='customer',kind='products',serviceKey='',categoryFilter='الكل',productSearch='',orderFilter='الجارية',cart={},submitting=false,installPrompt=null,lastSeenRole='',lastSeenOrderId=null,requestId=sessionStorage.getItem('wallaha_request_id')||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),token=localStorage.getItem('wallaha_token')||'';sessionStorage.setItem('wallaha_request_id',requestId);const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>Number(x||0).toLocaleString('ar-EG')+' ج';
const status={medicine_review:'بانتظار مراجعة طلب الأدوية',quote_pending:'بانتظار موافقة العميل على السعر',awaiting_quote:'بانتظار التسعير',payment_review:'بانتظار إثبات/مراجعة التحويل',new:'جديد',awaiting_driver:'بانتظار مندوب',assigned:'مسند لمندوب',ready:'جاهز للاستلام',picked_up:'استلمه المندوب',on_way:'في الطريق',delivered:'تم التسليم',cancelled:'ملغي'};
async function api(path,data){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error||'حدث خطأ');await refresh();return v}
async function refresh(){if(!token){state=null;offline=false;render();return}try{let r=await fetch('/api/state',{headers:{Authorization:'Bearer '+token}});if(!r.ok){token='';localStorage.removeItem('wallaha_token');state=null;render();return}state=await r.json();offline=false;tab=state.user.role;let latest=Math.max(0,...state.orders.map(o=>o.id));if(lastSeenRole===tab&&lastSeenOrderId!==null&&latest>lastSeenOrderId&&['admin','driver'].includes(tab))notifyNewOrder(latest,tab);lastSeenRole=tab;lastSeenOrderId=latest;render()}catch(e){offline=true;render()}}
function notifyNewOrder(id,role){if(!('Notification' in window)||Notification.permission!=='granted')return;let message={body:role==='admin'?'وصل طلب جديد إلى لوحة التحكم':'أُسند إليك طلب جديد',tag:'wallaha-order-'+id};if('serviceWorker' in navigator)navigator.serviceWorker.ready.then(reg=>reg.showNotification('ولّعها: طلب جديد',message)).catch(()=>{});else try{new Notification('ولّعها: طلب جديد',message)}catch(e){}}
async function enableNotifications(){if(!('Notification' in window)){alert('المتصفح لا يدعم التنبيهات');return}let result=await Notification.requestPermission();alert(result==='granted'?'تم تفعيل تنبيهات الطلبات أثناء فتح الواجهة':'لم تُفعّل التنبيهات. يمكنك متابعة الطلبات من زر التحديث')}
async function installApp(){if(!installPrompt)return;let p=installPrompt;installPrompt=null;$('install').style.display='none';await p.prompt()}
function options(list,selected){return list.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function vehicleOptions(){return state.services.filter(x=>x.active&&x.key.startsWith('ride_')).map(x=>`<option>${x.key==='ride_car'?'سيارة':x.key==='ride_motorbike'?'موتوسيكل':'توك توك'}</option>`).join('')}
function areas(){return `<label>المنطقة</label><select id="area" onchange="updateFeePreview()">${options(state.areas)}</select>`}
function updateFeePreview(){let fee=state.area_fees[$('area').value]||0;if($('fee-amount'))$('fee-amount').textContent=money(fee);if($('fee-total'))$('fee-total').textContent=money(Object.entries(cart).reduce((sum,[id,q])=>sum+(state.products.find(p=>p.id==id)?.price||0)*q,fee))}
function fields(){return `<div class="grid"><div><label>اسم العميل</label><input id="customer" value="${esc(state.user.name)}" readonly></div><div><label>رقم الهاتف</label><input id="phone" value="${esc(state.user.phone)}" readonly></div></div>${areas()}<label>عنوان العميل بالتفصيل</label><input id="address" required placeholder="الشارع وعلامة مميزة"><label>مكان العنوان على الخريطة</label><p class="map-legend">المس الخريطة لتثبيت المكان بدقة، أو استخدم موقعك الحالي. اكتب وصف العنوان أيضًا لتسهيل الوصول.</p><button type="button" onclick="pickCurrentLocation()">استخدم موقعي الحالي</button><div id="customer-map" class="map"></div><div id="selected-point" class="map-legend">${chosenPoint?'تم تحديد الموقع':'حدد نقطة العنوان قبل تأكيد الطلب'}</div>`}
function renderCatalog(){let box=$('catalog-products');if(!box)return;let items=state.products.filter(p=>p.active&&p.stock>0&&state.categories.some(c=>c.name===p.category&&c.active)&&(categoryFilter==='الكل'||p.category===categoryFilter)&&p.name.includes(productSearch));box.innerHTML=items.map(p=>`<div class="card">${p.image?`<img src="${p.image}" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:9px">`:''}<span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><div class="muted">متاح ${p.stock}${p.requires_prescription?' · يحتاج صورة وصفة':''}</div><p class="price">${money(p.price)}</p><button onclick="cart[${p.id}]=(cart[${p.id}]||0)+1;render()">أضف للسلة</button></div>`).join('')||'<div class="empty">لا توجد منتجات مطابقة</div>'}
function cartHasMedicine(){return Object.entries(cart).some(([id,q])=>q>0&&state.products.find(p=>p.id==id)?.category==='أدوية')}
function cartNeedsPrescription(){return Object.entries(cart).some(([id,q])=>q>0&&state.products.find(p=>p.id==id)?.requires_prescription)}
function pay(){return `<label>طريقة الدفع</label><select id="payment" onchange="document.querySelector('#proof-fields').style.display=this.value==='wallet'&&kind==='products'&&!cartHasMedicine()?'block':'none'"><option value="cash">نقدًا عند الاستلام</option><option value="wallet">تحويل محفظة</option></select><div id="proof-fields" style="display:none"><div class="pill">حوّل إلى ${esc(state.settings.wallet)} ثم ارفع صورة الإيصال. يراجع المسؤول وصول المبلغ قبل التوصيل.</div><label>صورة إثبات التحويل</label><input id="proof" type="file" accept="image/*"><label>رقم العملية (إن وجد)</label><input id="reference"></div>`}
function renderCustomer(){let products=state.products.filter(p=>p.active&&p.stock>0&&state.categories.some(c=>c.name===p.category&&c.active)&& (categoryFilter==='الكل'||p.category===categoryFilter)&&p.name.includes(productSearch));return `<h2>اطلب من ولّعها</h2><div class="row stack">${state.services.some(x=>x.key==='products'&&x.active)?`<button onclick="kind='products';render()">شراء منتجات</button>`:''}${state.services.some(x=>x.key==='delivery'&&x.active)?`<button onclick="kind='delivery';render()">توصيل أوردر</button>`:''}${state.services.some(x=>x.key.startsWith('ride_')&&x.active)?`<button onclick="kind='ride';render()">طلب مشوار</button>`:''}${state.services.filter(x=>x.key.startsWith('custom_')&&x.active).map(x=>`<button onclick="kind='custom';serviceKey='${x.key}';render()">${esc(x.name)}</button>`).join('')}</div><div class="service ${kind==='products'?'active':''}"><h2>المنتجات</h2><div class="catalog-tools"><label>ابحث عن منتج<input id="product-search" placeholder="اسم المنتج" value="${esc(productSearch)}" oninput="productSearch=this.value;renderCatalog()"></label><label>القسم<select id="category-filter" onchange="categoryFilter=this.value;renderCatalog()"><option>الكل</option>${state.categories.map(c=>`<option ${categoryFilter===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div><div id="catalog-products" class="grid">${products.map(p=>`<div class="card">${p.image?`<img src="${p.image}" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:9px">`:""}<span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><div class="muted">متاح ${p.stock}${p.requires_prescription?" · يحتاج صورة وصفة":""}</div><p class="price">${money(p.price)}</p><button onclick="cart[${p.id}]=(cart[${p.id}]||0)+1;render()">أضف للسلة</button></div>`).join('')||'<div class="empty">لم تُضف منتجات متاحة بعد</div>'}</div><div class="summary">السلة: ${Object.entries(cart).filter(([id,q])=>q>0).map(([id,q])=>{let p=state.products.find(v=>v.id==id);return `${esc(p?.name||'منتج')} × ${q} <button onclick="cart[${id}]--;render()">−</button>`}).join(' · ')||'فارغة'}<br>الإجمالي: <span id="fee-total">${money(Object.entries(cart).reduce((sum,[id,q])=>sum+(state.products.find(p=>p.id==id)?.price||0)*q,Number(state.area_fees[state.areas[0]]||0)))}</span> شامل توصيل <span id="fee-amount">${money(state.area_fees[state.areas[0]])}</span></div></div><div class="service ${kind==='custom'?'active':''}"><h2>${esc(state.services.find(s=>s.key===serviceKey)?.name||'خدمة إضافية')}</h2><p class="muted">اكتب التفاصيل، ويحدد المسؤول السعر قبل التنفيذ.</p></div><div class="service ${kind==='delivery'?'active':''}"><h2>توصيل أوردر</h2><p class="muted">اكتب مكان استلام الأوردر ووجهته؛ المسؤول يحدد السعر قبل إتمام الطلب.</p></div><div class="service ${kind==='ride'?'active':''}"><h2>طلب مشوار</h2><p class="muted">حدد نوع المركبة والمسار؛ المسؤول يحدد السعر قبل إتمام الطلب.</p></div><div class="card"><h3>بيانات الطلب</h3>${fields()}<div id="route" style="display:${kind==='products'?'none':'block'}"><label>مكان الاستلام</label><input id="pickup" placeholder="نقطة الانطلاق"><label>الوجهة</label><input id="destination" placeholder="نقطة الوصول">${kind==='ride'?'<label>المركبة</label><select id="vehicle">'+vehicleOptions()+'</select>':''}</div><label>تفاصيل إضافية</label><textarea id="details" placeholder="تعليمات للطلب أو المشوار"></textarea>${kind==='products'&&cartNeedsPrescription()?'<label>صورة الوصفة الطبية للمنتجات المحددة</label><input id="prescription" type="file" accept="image/png,image/jpeg,image/webp">':''}${pay()}<p class="muted">${kind==='products'?cartHasMedicine()?'طلب الأدوية ينتظر مراجعة المسؤول قبل التحويل أو الإسناد.':'المنتجات تخصم من الكمية المتاحة عند تسجيل الطلب.':'يظهر سعر الخدمة بعد مراجعة المسؤول. عند اختيار المحفظة ترفع إثبات التحويل بعد تحديد السعر.'}</p><button onclick="placeOrder()">تأكيد الطلب</button></div><h2>طلباتي</h2>${state.orders.map(o=>`<div class="card"><button onclick="selectTracking(${o.id})">طلب #${o.id} · ${status[o.status]}</button></div>`).join('')}<div class="card"><label>رقم الطلب</label><input id="track" inputmode="numeric" placeholder="مثال: 1"><button onclick="showTrack()">عرض الحالة</button><div id="track-result"></div>${trackingOrderId?trackingPanel():''}</div>`}
async function fileData(id){let f=$(id)?.files?.[0];if(!f)return '';return await new Promise((ok,fail)=>{let rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=fail;rd.readAsDataURL(f)})}
async function placeOrder(){if(submitting)return;submitting=true;try{let v={client_request_id:requestId,kind,service_key:serviceKey,customer:$('customer').value.trim(),phone:$('phone').value.trim(),area:$('area').value,address:$('address').value.trim(),details:$('details').value,payment:$('payment').value,pickup:$('pickup')?.value||'',destination:$('destination')?.value||'',vehicle:$('vehicle')?.value||'',items:Object.entries(cart).filter(([,q])=>q>0).map(([id,quantity])=>({product_id:Number(id),quantity})),proof:await fileData('proof'),prescription:await fileData('prescription'),reference:$('reference')?.value||'',latitude:chosenPoint?.latitude,longitude:chosenPoint?.longitude};let out=await api('order',v);cart={};chosenPoint=null;requestId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();sessionStorage.setItem('wallaha_request_id',requestId);alert('تم تسجيل الطلب رقم '+out.id+'. احتفظ بالرقم للمتابعة.')}catch(e){alert(e.message)}finally{submitting=false}}
function canCancel(o){return ['awaiting_quote','quote_pending','medicine_review','payment_review','new','awaiting_driver','assigned'].includes(o.status)&&!(o.payment==='wallet'&&(o.payment_status==='confirmed'||o.has_proof))}
function selectTracking(id){trackingOrderId=id;render()}
function showTrack(){const id=Number($('track').value);if(!state.orders.some(o=>o.id===id))return alert('الطلب غير موجود');selectTracking(id)}
function trackingPanel(){let o=state.orders.find(x=>x.id===trackingOrderId);if(!o)return '';return `<h3>متابعة طلب #${o.id}</h3><div class="pill">${status[o.status]} · ${money(o.total)}${o.driver_name?` · المندوب: ${esc(o.driver_name)}`:''}</div><div id="tracking-map" class="map"></div><p class="map-legend">البرتقالي عنوان الطلب، والأخضر آخر موقع أرسله المندوب${o.driver_location_at?' في '+esc(o.driver_location_at):''}. يتحدث الموقع حين يفتح المندوب واجهته ويفعّل المشاركة.</p>${canCancel(o)?`<button onclick="cancelMyOrder(${o.id})">إلغاء الطلب</button>`:''}${o.status==='quote_pending'?`<div class="pill">السعر المقترح ${money(o.total)}. <button onclick="act(${o.id},'accept_quote')">أوافق على السعر</button> <button onclick="act(${o.id},'decline_quote')">رفض</button></div>`:''}${o.payment==='wallet'&&o.status==='payment_review'&&!o.has_proof?`<div class="pill">حوّل ${money(o.total)} إلى ${esc(state.settings.wallet)} ثم ارفع الإثبات.<input id="track-proof" type="file" accept="image/*"><input id="track-ref" placeholder="رقم العملية"><button onclick="sendProof(${o.id})">إرسال الإثبات</button></div>`:''}<p class="small">${o.events.map(e=>esc(e.action)).join(' ← ')}</p>`}

async function cancelMyOrder(id){if(!confirm('هل تريد إلغاء الطلب قبل تنفيذه؟'))return;try{await api('order/action',{id,action:'customer_cancel'});alert('تم إلغاء الطلب وإعادة الكمية المتاحة')}catch(e){alert(e.message)}}
async function sendProof(id){try{await api('order/action',{id,action:'submit_proof',proof:await fileData('track-proof'),reference:$('track-ref').value});alert('وصل الإثبات للمراجعة')}catch(e){alert(e.message)}}
function orderCard(o,role){return `<div class="card"><span class="tag">#${o.id} · ${status[o.status]}</span><h3>${esc({products:'منتجات',delivery:'توصيل أوردر',ride:'مشوار',custom:state.services.find(s=>s.key===o.service_key)?.name||'خدمة إضافية'}[o.kind])} · ${esc(o.area)}</h3><p>${esc(o.customer)} · ${esc(o.phone)} · ${esc(o.address)}</p>${o.items.length?`<p>${o.items.map(i=>`${esc(i.name)} × ${i.quantity}`).join('، ')}</p>`:''}${o.pickup?`<p>من: ${esc(o.pickup)} ← إلى: ${esc(o.destination)} ${esc(o.vehicle)}</p>`:''}<p class="muted">${esc(o.details)} · ${o.payment==='cash'?'كاش':'محفظة'} · ${o.payment_status==='pending'?'الدفع قيد المراجعة':'الدفع مؤكد/كاش'} · ${money(o.total)}</p><p class="muted">المندوب: ${esc(o.driver_name||'لم يُحدد')}</p>${role==='admin'?adminActions(o):driverActions(o)}</div>`}
function adminActions(o){return `<div class="stack">${o.prescription?`<a href="${o.prescription}" target="_blank" download="prescription-${o.id}.png">عرض الوصفة</a>`:''}${o.status==='medicine_review'?`<button onclick="act(${o.id},'approve_medicine')">تمت مراجعة طلب الأدوية</button><button onclick="act(${o.id},'reject_medicine')">رفض الطلب</button>`:''}${o.payment==='cash'&&o.status==='delivered'&&o.cash_collected&&!o.cash_settled?`<button onclick="act(${o.id},'settle_cash')">استلمت الكاش من المندوب</button>`:''}${o.proof&&o.payment_status==='pending'?`<a href="${o.proof}" download="proof-${o.id}.png" target="_blank">فتح إثبات التحويل</a> <button onclick="act(${o.id},'confirm_payment')">تأكيد وصول المبلغ</button>`:''}${['awaiting_quote','quote_pending'].includes(o.status)?`<input id="quote-${o.id}" type="number" min="0" placeholder="السعر بالجنيه"><button onclick="act(${o.id},'price',Number($('quote-${o.id}').value))">تحديد السعر</button>`:''}${o.status==='new'?`<button onclick="act(${o.id},'approve_order')">مراجعة وموافقة على توزيع الطلب</button>`:''}${o.kind==='products'&&o.status==='assigned'?`<button onclick="act(${o.id},'ready')">جاهز لاستلام المندوب</button>`:''}${['assigned','awaiting_driver','ready'].includes(o.status)?`<label>تعيين مندوب من المنطقة</label><select id="assign-${o.id}">${state.drivers.filter(d=>d.area===o.area&&d.available).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><button onclick="reassign(${o.id})">إسناد يدوي</button>`:''}${!['delivered','cancelled'].includes(o.status)?`<button onclick="act(${o.id},'cancel')">إلغاء الطلب</button>`:''}</div>`}
function driverActions(o){return `<div class="stack">${o.status==='ready'||o.kind!=='products'&&o.status==='assigned'?`<button onclick="act(${o.id},'picked_up')">استلمت الطلب / بدأت المشوار</button>`:''}${o.status==='picked_up'?`<button onclick="act(${o.id},'on_way')">في الطريق</button>`:''}${o.status==='on_way'?`<button onclick="act(${o.id},'delivered')">تم التسليم</button>`:''}</div>`}
async function act(id,action,amount){try{let cash_collected=false;if(action==='delivered'&&state.orders.find(o=>o.id===id)?.payment==='cash'){if(!confirm('هل حصّلت المبلغ النقدي كاملًا من العميل؟'))return;cash_collected=true}await api('order/action',{id,action,amount,cash_collected})}catch(e){alert(e.message)}}
function jumpAdmin(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderAdmin(){return `<h2>لوحة التحكم</h2><div class="admin-menu"><button onclick="jumpAdmin('admin-map-section')">الخريطة</button><button onclick="jumpAdmin('admin-orders')">الطلبات</button><button onclick="jumpAdmin('admin-products')">المنتجات</button><button onclick="jumpAdmin('admin-categories')">الأقسام</button><button onclick="jumpAdmin('admin-drivers')">الطيارون</button><button onclick="jumpAdmin('admin-services')">الخدمات</button><button onclick="jumpAdmin('admin-cash')">تحصيل الكاش</button><button onclick="jumpAdmin('admin-settings')">الإعدادات</button></div><button onclick="enableNotifications()">تفعيل تنبيهات الطلبات</button><div class="card" id="admin-map-section"><h3>خريطة الطلبات والمندوبين</h3><p class="map-legend">البرتقالي عنوان طلب جارٍ، والأخضر آخر موقع شاركه المندوب. اضغط على العلامة للتفاصيل.</p><div id="admin-map" class="map"></div></div><div class="grid"><div class="card" id="admin-products"><h3>أضف منتجًا</h3><label>الاسم</label><input id="p-name"><label>القسم</label><select id="p-category">${options(state.categories.filter(c=>c.active).map(c=>c.name))}</select><label>السعر</label><input id="p-price" type="number" min="0"><label>الكمية</label><input id="p-stock" type="number" min="0"><label>صورة المنتج</label><input id="p-image" type="file" accept="image/png,image/jpeg,image/webp"><label><input id="p-rx" type="checkbox" style="width:auto"> يحتاج وصفة (للأدوية)</label><button onclick="addProduct()">حفظ المنتج</button></div><div class="card" id="admin-drivers"><h3>أضف طيارًا</h3><label>الاسم</label><input id="d-name"><label>الهاتف</label><input id="d-phone"><label>اسم مستخدم المندوب (حروف إنجليزية)</label><input id="d-username" autocomplete="off"><label>كلمة مرور المندوب (10 أحرف على الأقل)</label><input id="d-password" type="password"><label>المنطقة</label><select id="d-area">${options(state.areas)}</select><button onclick="addDriver()">حفظ المندوب</button></div></div><div class="card" id="admin-categories"><h3>أقسام المنتجات</h3><p class="muted">أضف قسمًا أو أخفه بعد إخفاء منتجاته المعروضة.</p><div class="row"><input id="category-name" placeholder="اسم قسم جديد"><button onclick="createCategory()">إضافة قسم</button></div>${state.categories.map(c=>`<div class="row"><span>${esc(c.name)}</span><button onclick="toggleCategory(decodeURIComponent('${encodeURIComponent(c.name)}'),${c.active?'false':'true'})">${c.active?'إخفاء':'إظهار'}</button></div>`).join('')}</div><div class="card" id="admin-settings"><h3>إعدادات الدفع والتوصيل</h3><label>رقم المحفظة</label><input id="s-wallet" value="${esc(state.settings.wallet)}"><label>رقم واتساب</label><input id="s-whatsapp" value="${esc(state.settings.whatsapp)}"><button onclick="saveSettings()">حفظ الأرقام</button></div><div class="card"><h3>رسوم توصيل المنتجات لكل منطقة</h3>${state.areas.map((area,i)=>`<div class="row"><span>${esc(area)}</span><input id="area-fee-${i}" type="number" min="0" value="${state.area_fees[area]}"><button onclick="saveAreaFee(${i})">حفظ</button></div>`).join('')}</div><div class="grid"><div class="card"><h3>ملخص الطلبات</h3><p>إجمالي الطلبات: ${state.orders.length}</p><p>طلبات جارية: ${state.orders.filter(o=>!['delivered','cancelled'].includes(o.status)).length}</p><p>طلبات مسلمة: ${state.orders.filter(o=>o.status==='delivered').length}</p><p>تحتاج مراجعة: ${state.orders.filter(o=>['new','medicine_review','payment_review','awaiting_quote'].includes(o.status)).length}</p><p>منتجات قاربت على النفاد (5 أو أقل): ${state.products.filter(p=>p.active&&p.stock<=5).length}</p><p>قيمة الطلبات المسلمة: ${money(state.orders.filter(o=>o.status==='delivered').reduce((v,o)=>v+o.total,0))}</p></div><div class="card" id="admin-cash"><h3>تحصيل الكاش</h3><p>في عهدة المندوبين: ${money(state.orders.filter(o=>o.payment==='cash'&&o.cash_collected&&!o.cash_settled).reduce((v,o)=>v+o.total,0))}</p><p>تمت تسويته: ${money(state.orders.filter(o=>o.payment==='cash'&&o.cash_settled).reduce((v,o)=>v+o.total,0))}</p></div></div><div class="card" id="admin-services"><h3>الخدمات</h3><label>خدمة جديدة بتسعير يدوي</label><input id="service-name" placeholder="مثال: توصيل مستندات"><button onclick="createService()">إضافة خدمة</button>${state.services.map(s=>`<div class="row"><span>${esc(s.name)}</span><button onclick="toggleService('${s.key}',${s.active?'false':'true'})">${s.active?'إيقاف مؤقت':'تشغيل'}</button></div>`).join('')}</div><h2 id="admin-orders">الطلبات (${state.orders.length})</h2><div class="catalog-tools"><label>عرض الطلبات<select id="order-filter" onchange="orderFilter=this.value;render()">${options(['الجارية','تحتاج مراجعة','المنتهية','الكل'],orderFilter)}</select></label></div>${state.orders.filter(o=>orderFilter==='الكل'||(orderFilter==='المنتهية'?['delivered','cancelled'].includes(o.status):orderFilter==='تحتاج مراجعة'?['new','medicine_review','payment_review','awaiting_quote'].includes(o.status):!['delivered','cancelled'].includes(o.status))).map(o=>orderCard(o,'admin')).join('')||'<div class="empty">لا توجد طلبات في هذا العرض</div>'}<h2>المنتجات والمندوبون</h2><div class="grid"><div class="card">${state.products.map(p=>`<div class="pill">${esc(p.name)} · <input id="price-${p.id}" type="number" min="0" value="${p.price}" style="width:90px"> ج · متاح <input id="stock-${p.id}" type="number" min="0" value="${p.stock}" style="width:75px"> <label><input id="active-${p.id}" type="checkbox" ${p.active?"checked":""} style="width:auto"> ظاهر</label><label><input id="rx-${p.id}" type="checkbox" ${p.requires_prescription?"checked":""} style="width:auto"> وصفة</label><button onclick="updateProduct(${p.id})">حفظ</button><button onclick="removeProduct(${p.id})">إخفاء المنتج</button></div>`).join('')}</div><div class="card">${state.drivers.map(d=>`<div class="pill">${esc(d.name)} · ${esc(d.area)} · ${esc(d.phone)} · المستخدم: ${esc(d.username||'رقم الهاتف')} · ${d.available?"متاح":"غير متاح"} <button onclick="driverAvailable(${d.id},${d.available?"false":"true"})">تغيير التوافر</button> ${d.location_at?`· <a href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}#map=16/${d.lat}/${d.lon}" target="_blank" rel="noopener">آخر موقع (${esc(d.location_at)})</a>`:"· الموقع لم يُشارك"}</div>`).join('')||'لم تضف مندوبًا'}</div></div>`}
async function addProduct(){try{await api('product',{name:$('p-name').value,category:$('p-category').value,price:$('p-price').value,stock:$('p-stock').value,image:await fileData('p-image'),requires_prescription:$('p-rx').checked})}catch(e){alert(e.message)}}
async function saveSettings(){try{await api('settings',{wallet:$('s-wallet').value,whatsapp:$('s-whatsapp').value,delivery_fee:state.settings.delivery_fee})}catch(e){alert(e.message)}}
async function saveAreaFee(i){try{await api('area-fee',{area:state.areas[i],fee:$('area-fee-'+i).value})}catch(e){alert(e.message)}}
async function reassign(id){try{await api('order/reassign',{id,driver_id:Number($('assign-'+id).value)})}catch(e){alert(e.message)}}
async function driverAvailable(id,available){try{await api('driver/availability',{id,available})}catch(e){alert(e.message)}}
async function removeProduct(id){if(!confirm('إخفاء المنتج من قائمة العملاء؟ الطلبات السابقة ستبقى محفوظة.'))return;try{await api('product/delete',{id})}catch(e){alert(e.message)}}
async function createCategory(){try{await api('category/create',{name:$('category-name').value})}catch(e){alert(e.message)}}
async function toggleCategory(name,active){try{await api('category/update',{name,active})}catch(e){alert(e.message)}}
async function createService(){try{await api('service/create',{name:$('service-name').value})}catch(e){alert(e.message)}}
async function toggleService(key,active){try{await api('service',{key,active})}catch(e){alert(e.message)}}
async function updateProduct(id){try{await api('product/update',{id,price:$('price-'+id).value,stock:$('stock-'+id).value,active:$('active-'+id).checked,requires_prescription:$('rx-'+id).checked})}catch(e){alert(e.message)}}
let locationWatch=null,lastLocation=0;
function stopLocation(){if(locationWatch!==null)navigator.geolocation.clearWatch(locationWatch);locationWatch=null}
function startLocation(){if(!navigator.geolocation){alert('الموقع غير متاح');return}if(locationWatch!==null)return;locationWatch=navigator.geolocation.watchPosition(async pos=>{if(Date.now()-lastLocation<15000)return;lastLocation=Date.now();try{await api('location',{lat:pos.coords.latitude,lon:pos.coords.longitude})}catch(e){stopLocation();alert(e.message)}},e=>alert('تعذر تحديد الموقع: '+e.message),{enableHighAccuracy:true,maximumAge:10000})}
async function addDriver(){try{await api('driver',{name:$('d-name').value,phone:$('d-phone').value,password:$('d-password').value,username:$('d-username').value,area:$('d-area').value})}catch(e){alert(e.message)}}
function renderDriver(){return `<h2>طلبات المندوب ${esc(state.user.name)}</h2><button onclick="enableNotifications()">تفعيل تنبيهات الإسناد</button><button onclick="startLocation()">مشاركة موقعي أثناء الطلب</button><p class="muted">تتوقف المشاركة عند إغلاق الصفحة أو الضغط على إيقاف المشاركة. يرسل الموقع فقط عند وجود طلب جارٍ.</p><button onclick="stopLocation()">إيقاف المشاركة</button><div id="driver-map" class="map"></div><p class="map-legend">البرتقالي مواقع عناوين الطلبات المسندة إليك.</p>${state.orders.filter(o=>!['cancelled','delivered'].includes(o.status)).map(o=>orderCard(o,'driver')).join('')||'<div class="empty">لا توجد طلبات مسندة إليك الآن</div>'}`}
function loginView(){return `<div class="grid"><div class="card"><h2>دخول ولّعها</h2><label>اسم المستخدم أو رقم الهاتف</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password"><button onclick="login()">دخول</button><p class="muted">للمسؤول والمندوب والعميل</p></div><div class="card"><h2>حساب عميل جديد</h2><label>الاسم</label><input id="reg-name"><label>رقم الهاتف</label><input id="reg-phone" inputmode="tel"><label>كلمة مرور (10 أحرف على الأقل)</label><input id="reg-pass" type="password"><button onclick="register()">إنشاء حساب</button></div></div>`}
async function login(){try{let v=await api('login',{phone:$('login-phone').value,password:$('login-pass').value});token=v.token;localStorage.setItem('wallaha_token',token);await refresh()}catch(e){alert(e.message)}}
async function register(){try{await api('register',{name:$('reg-name').value,phone:$('reg-phone').value,password:$('reg-pass').value});alert('تم إنشاء الحساب. سجل الدخول الآن.')}catch(e){alert(e.message)}}
async function logout(){try{await api('logout',{})}catch(e){}token='';localStorage.removeItem('wallaha_token');state=null;chosenPoint=null;trackingOrderId=null;render()}
async function changePassword(){let old=$('current-pass').value, next=$('new-pass').value;if(!old||next.length<10){alert('اكتب كلمة المرور الحالية وجديدة من 10 أحرف على الأقل');return}try{await api('change-password',{current_password:old,new_password:next});alert('تم تغيير كلمة المرور وإغلاق الجلسات الأخرى')}catch(e){alert(e.message)}}
function accountPanel(){return `<details class="card"><summary>إعدادات حسابي</summary><label>كلمة المرور الحالية</label><input id="current-pass" type="password" autocomplete="current-password"><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="new-pass" type="password" autocomplete="new-password"><button onclick="changePassword()">تغيير كلمة المرور</button></details>`}
function render(){clearMaps();$('logout').style.display=state?'block':'none';$('reload').style.display=state?'block':'none';$('app').innerHTML=(offline?'<div class="notice">الاتصال غير متاح الآن. الطلبات تحتاج اتصالًا بالإنترنت. اضغط تحديث الطلبات عند عودته.</div>':'')+(!state?loginView():(tab==='customer'?renderCustomer():tab==='admin'?renderAdmin():renderDriver())+accountPanel());initMaps()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').style.display='block'});document.getElementById("manifest").href="/manifest/"+(["driver","admin"].includes(location.pathname.slice(1))?location.pathname.slice(1):"customer")+".json";if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});refresh();setInterval(()=>{if(state&&(['admin','driver'].includes(tab)||(tab==='customer'&&trackingOrderId))&&document.visibilityState==='visible'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))refresh()},15000);</script></body></html>
