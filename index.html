let state,previewMode=false,offline=false,tab='customer',kind='products',serviceKey='',merchantId=0,categoryFilter='الكل',productSearch='',orderFilter='الجارية',cart={},submitting=false,installPrompt=null,lastSeenRole='',lastSeenOrderId=null,requestId=sessionStorage.getItem('wallaha_request_id')||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),token=localStorage.getItem('wallaha_token')||'';sessionStorage.setItem('wallaha_request_id',requestId);const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>Number(x||0).toLocaleString('ar-EG')+' ج';
const status={medicine_review:'بانتظار مراجعة طلب الأدوية',quote_pending:'بانتظار موافقة العميل على السعر',awaiting_quote:'بانتظار التسعير',payment_review:'بانتظار إثبات/مراجعة التحويل',new:'جديد',awaiting_driver:'بانتظار مندوب قريب',offered:'معروض على المندوب الأقرب',assigned:'قبله المندوب',ready:'جاهز للاستلام',picked_up:'استلمه المندوب',on_way:'في الطريق',delivered:'تم التسليم',cancelled:'ملغي'};
async function api(path,data){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error||'حدث خطأ');if(!['login','register','logout'].includes(path))await refresh();return v}
async function refresh(){if(previewMode)return browsePreview();if(!token){state=null;offline=false;if(['/', '/customer'].includes(location.pathname))await browsePreview(true);else render();return}try{let r=await fetch('/api/state',{headers:{Authorization:'Bearer '+token}});if(!r.ok){token='';localStorage.removeItem('wallaha_token');state=null;render();return}state=await r.json();offline=false;tab=state.user.role;let latest=Math.max(0,...state.orders.map(o=>o.id));if(lastSeenRole===tab&&lastSeenOrderId!==null&&latest>lastSeenOrderId&&['admin','driver'].includes(tab))notifyNewOrder(latest,tab);lastSeenRole=tab;lastSeenOrderId=latest;render()}catch(e){offline=true;render()}}
function notifyNewOrder(id,role){if(!('Notification' in window)||Notification.permission!=='granted')return;let message={body:role==='admin'?'وصل طلب جديد إلى لوحة التحكم':'أُسند إليك طلب جديد',tag:'wallaha-order-'+id};if('serviceWorker' in navigator)navigator.serviceWorker.ready.then(reg=>reg.showNotification('ولعه: طلب جديد',message)).catch(()=>{});else try{new Notification('ولعه: طلب جديد',message)}catch(e){}}
async function enableNotifications(){if(!('Notification' in window)){alert('المتصفح لا يدعم التنبيهات');return}let result=await Notification.requestPermission();alert(result==='granted'?'تم تفعيل تنبيهات الطلبات أثناء فتح الواجهة':'لم تُفعّل التنبيهات. يمكنك متابعة الطلبات من زر التحديث')}
async function installApp(){if(!installPrompt)return;let p=installPrompt;installPrompt=null;$('install').style.display='none';await p.prompt()}
function options(list,selected){return list.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
const shipmentTypes=['ملابس','كوزماتيكس','بيرفيوم','مواد غذائية وأطعمة','أخرى'];
let shipmentType='';
function chooseShipment(value){shipmentType=value;goCustomer('checkout')}
function shipmentPicker(){return `<button class="customer-back" onclick="goCustomer('home')">→ الرئيسية</button><h2>الشحنة عبارة عن إيه؟</h2><p class="muted">اختار نوع الشحنة الأول، وبعدها بيانات المرسل والمستلم.</p><div class="quick-services">${shipmentTypes.map((name,i)=>`<button onclick="chooseShipment(shipmentTypes[${i}])"><strong>${['👕','💄','🧴','🥡','📦'][i]} ${esc(name)}</strong></button>`).join('')}</div>`}
const rideVehicles=[{key:'ride_motorbike',value:'موتوسيكل',label:'موتوسيكل',icon:'🏍️',color:'#fff0d9'},{key:'ride_tuktuk',value:'توك توك',label:'توك توك',icon:'🛺',color:'#fff2cc'},{key:'ride_car',value:'سيارة',label:'عربية ملاكي',icon:'🚗',color:'#e9efff'},{key:'ride_microbus',value:'ميكروباص',label:'ميكروباص',icon:'🚐',color:'#f3e9ff'}];
function vehicleOptions(){return rideVehicles.filter(v=>state.services.some(s=>s.key===v.key&&s.active)).map(v=>`<option value="${v.value}">${v.label}</option>`).join('')}
function chooseRide(key){let v=rideVehicles.find(v=>v.key===key);if(!v)return;startService('ride',key);if(kind==='ride'&&serviceKey===key){checkoutDraft.vehicle=v.value;if($('vehicle'))$('vehicle').value=v.value}}
function rideTiles(){let available=rideVehicles.filter(v=>state.services.some(s=>s.key===v.key&&s.active));return available.length?`<section class="ride-section"><div class="section-heading"><div><h2>اختار مركبة لمشوارك</h2><p>حدد مكان الاستلام والوجهة، والسعر يظهر لك للموافقة قبل التنفيذ</p></div></div><div class="ride-grid">${available.map(v=>`<button class="ride-tile" onclick="chooseRide('${v.key}')"><span style="background:${v.color}" aria-hidden="true">${v.icon}</span><strong>${v.label}</strong><small>اطلب مشوار ←</small></button>`).join('')}</div></section>`:''}

function areas(){return `<label>المنطقة</label><select id="area" onchange="updateFeePreview()">${options(state.areas)}</select>`}
function updateFeePreview(){let fee=state.area_fees[$('area').value]||0;if($('fee-amount'))$('fee-amount').textContent=money(fee);if($('fee-total'))$('fee-total').textContent=money(Object.entries(cart).reduce((sum,[id,q])=>sum+(state.products.find(p=>p.id==id)?.price||0)*q,fee))}
function fields(){return `<div class="grid"><div><label>اسم صاحب الحساب</label><input id="customer" value="${esc(state.user.name)}" readonly></div><div><label>رقم الهاتف</label><input id="phone" value="${esc(state.user.phone)}" readonly></div></div>${areas()}<label>طريقة تحديد العنوان</label><div class="row"><button type="button" aria-pressed="${addressMode==='manual'}" onclick="setAddressMode('manual')">✍️ كتابة العنوان يدويًا</button><button type="button" aria-pressed="${addressMode==='gps'}" onclick="setAddressMode('gps')">📍 موقعي الحالي GPS</button></div><label>${kind==='delivery'?'عنوان المستلم بالتفصيل':'عنوان العميل بالتفصيل'}</label><input id="address" required placeholder="الشارع، رقم البيت وعلامة مميزة"><p class="map-legend">${addressMode==='manual'?'اكتب العنوان كاملًا. يمكنك إضافة نقطة على الخريطة لتسهيل الوصول؛ العنوان المكتوب وحده لا يضمن إحداثيات دقيقة.':'اضغط تحديد موقعي واسمح بإذن الموقع. تُحفظ نقطة التوصيل الحالية مع الطلب، ويمكن تعديلها على الخريطة.'}</p>${addressMode==='gps'?'<button type="button" onclick="mapPinMode=\'destination\';pickCurrentLocation()">تحديد موقعي الآن</button>':''}<div id="customer-map" class="map"></div><div id="selected-point" class="map-legend">${chosenPoint?'تم تحديد الموقع':addressMode==='manual'?'نقطة الخريطة اختيارية للعنوان اليدوي':'حدد موقعك قبل تأكيد الطلب'}</div>`}
function catalogItems(){return state.products.filter(p=>p.active&&p.stock>0&&p.merchant_id===merchantId&&state.merchants.some(m=>m.id===merchantId&&m.active)&&state.categories.some(c=>c.name===p.category&&c.active)&&p.name.toLocaleLowerCase('ar').includes(productSearch.toLocaleLowerCase('ar')))}
function renderCatalog(){let box=$('catalog-products');if(!box)return;let items=catalogItems();box.innerHTML=items.map(p=>`<div class="card">${p.image?`<img src="${p.image}" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:9px">`:''}<span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><div class="muted">متاح ${p.stock}${p.requires_prescription?' · يحتاج صورة وصفة':''}</div><p class="price">${money(p.price)}</p><button onclick="cart[${p.id}]=(cart[${p.id}]||0)+1;render()">أضف للسلة</button></div>`).join('')||'<div class="empty">لا توجد منتجات مطابقة</div>'}
function cartHasMedicine(){return Object.entries(cart).some(([id,q])=>q>0&&state.products.find(p=>p.id==id)?.category==='أدوية')}
function cartNeedsPrescription(){return Object.entries(cart).some(([id,q])=>q>0&&state.products.find(p=>p.id==id)?.requires_prescription)}
function pay(){return `<label>طريقة الدفع</label><select id="payment" onchange="document.querySelector('#proof-fields').style.display=this.value==='wallet'&&kind==='products'&&!cartHasMedicine()?'block':'none'"><option value="cash">نقدًا عند الاستلام</option>${state.settings.wallet?'<option value="wallet">تحويل محفظة</option>':''}</select><div id="proof-fields" style="display:none"><div class="pill">حوّل إلى ${esc(state.settings.wallet)} ثم ارفع صورة الإيصال. يراجع المسؤول وصول المبلغ قبل التوصيل.</div><label>صورة إثبات التحويل</label><input id="proof" type="file" accept="image/*"><label>رقم العملية (إن وجد)</label><input id="reference"></div>`}
const categoryLooks={'سوبر ماركت':['🛒','#e4f4dd','مشتريات البيت'],'أدوية':['✚','#e6efff','الصيدلية'],'مخبوزات وعيش':['🥖','#fff0d9','عيش ومخبوزات'],'خضار':['🥬','#e2f5e6','خضار وفاكهة'],'مطاعم':['🍽️','#ffe9df','أكل ووجبات'],'أخرى':['📦','#f2eafa','أي غرض تاني']};
function categoryTiles(){return state.categories.filter(c=>c.active).map(c=>{let look=categoryLooks[c.name]||['🛍️','#e9f2f2','اطلب الآن'],count=state.merchants.filter(m=>m.active&&m.category===c.name).length+(c.name==='مطاعم'?listedRestaurants.filter(name=>!state.merchants.some(m=>m.name===name)).length:0);return `<button type="button" class="category-tile ${kind==='products'&&categoryFilter===c.name?'selected':''}" style="--tile-bg:${look[1]}" onclick="chooseCategory(decodeURIComponent('${encodeURIComponent(c.name)}'))" aria-label="${esc(c.name)}"><span class="category-art" aria-hidden="true">${look[0]}</span><strong>${esc(c.name)}</strong><small>${count?`${count} ${c.name==='مطاعم'?'مطعم':'محل'}`:look[2]}</small></button>`}).join('')}
const listedRestaurants=['مطعم الخطيب','مطعم عجايب','مطعم سبايسي','مطعم هوت مكس','مطعم عجيبة','مطعم زيكو','مطعم تيمو'];
let restaurantName='';
function openListedRestaurant(index){restaurantName=listedRestaurants[index];goCustomer('restaurant')}
function listedRestaurantCards(){if(!['الكل','مطاعم'].includes(categoryFilter))return '';let q=homeQuery.trim().toLocaleLowerCase('ar');return listedRestaurants.map((name,index)=>({name,index})).filter(x=>!state.merchants.some(m=>m.name===x.name)&&(!q||x.name.toLocaleLowerCase('ar').includes(q))).map(x=>`<button class="merchant-card" onclick="openListedRestaurant(${x.index})"><span class="merchant-art" style="--tile-bg:#ffe9df">🍽️</span><span><strong>${esc(x.name)}</strong><small>مطاعم</small><span class="muted">المنيو لم يُضف بعد</span></span></button>`).join('')}
let customerView='home',homeQuery='',checkoutDraft={},checkoutFiles={},addressMode='gps';
function setAddressMode(mode){saveCheckoutDraft();addressMode=mode;chosenPoint=null;render()}
function saveCheckoutDraft(){if(!document.querySelector('#customer-map'))return;for(let id of ['area','address','pickup','destination','vehicle','details','payment','reference','sender-name','sender-phone','recipient-name','recipient-phone','shipment-other']){let el=$(id);if(el)checkoutDraft[id]=el.value}for(let id of ['proof','prescription']){let file=$(id)?.files?.[0];if(file)checkoutFiles[id]=file}}
function restoreCheckoutDraft(){if(!document.querySelector('#customer-map'))return;for(let [id,value] of Object.entries(checkoutDraft)){let el=$(id);if(el&&(!(el instanceof HTMLSelectElement)||[...el.options].some(o=>o.value===value)))el.value=value}if($('proof-fields'))$('proof-fields').style.display=$('payment').value==='wallet'&&kind==='products'&&!cartHasMedicine()?'block':'none';updateFeePreview()}

function cartCount(){return Object.values(cart).reduce((n,q)=>n+Math.max(0,Number(q)||0),0)}
function cartSubtotal(){return Object.entries(cart).reduce((sum,[id,q])=>sum+(state.products.find(p=>p.id==id)?.price||0)*Math.max(0,q),0)}
function goCustomer(view){customerView=view;render();window.scrollTo({top:0,behavior:'smooth'})}
function chooseCategory(name){kind='products';categoryFilter=name;customerView='home';render();document.getElementById('merchant-section')?.scrollIntoView({behavior:'smooth',block:'start'})}
function selectMerchant(value){let next=Number(value);if(merchantId!==next&&cartCount()&&!confirm('تغيير المحل هيفرّغ السلة الحالية. تكمل؟'))return;if(merchantId!==next)cart={};merchantId=next;kind='products';categoryFilter=state.merchants.find(m=>m.id===next)?.category||'الكل';productSearch='';goCustomer('store')}
function changeCart(id,delta){let product=state.products.find(p=>p.id===id);if(!product)return;cart[id]=Math.max(0,Math.min(product.stock,(cart[id]||0)+delta));if(!cart[id])delete cart[id];let y=window.scrollY;render();window.scrollTo(0,y)}
function startService(type,key=''){if(cartCount()&&!confirm('بدء خدمة جديدة هيفرّغ السلة الحالية. تكمل؟'))return;if(type==='delivery')shipmentType='';kind=type;serviceKey=key;merchantId=0;cart={};goCustomer('checkout')}
function openCustomerAccount(){if(previewMode)leavePreview();else document.querySelector('details.card')?.scrollIntoView({behavior:'smooth'})}
function customerNav(){return `<nav class="customer-bottom" aria-label="التنقل في تطبيق العميل"><button class="${customerView==='home'||customerView==='store'?'active':''}" onclick="goCustomer('home')"><b>⌂</b>الرئيسية</button><button class="${customerView==='checkout'?'active':''}" onclick="goCustomer('checkout')"><b>🛒</b>السلة ${cartCount()?`(${cartCount()})`:''}</button><button class="${customerView==='orders'?'active':''}" onclick="goCustomer('orders')"><b>▤</b>طلباتي</button><button onclick="openCustomerAccount()"><b>◉</b>حسابي</button></nav>`}
function customerTop(){return `<details class="customer-menu"><summary aria-label="فتح القائمة">☰</summary><div><button onclick="goCustomer('home')">الرئيسية</button><button onclick="goCustomer('orders')">طلباتي</button><button onclick="openCustomerAccount()">${previewMode?'تسجيل الدخول / إنشاء حساب':'حسابي'}</button></div></details><div class="customer-topline"><div class="customer-place">بنوصّل لحد بابك<strong>📍 البدرشين وقراها</strong></div><div class="customer-avatar" aria-hidden="true">🛵</div></div>`}
function merchantCards(){let q=homeQuery.trim().toLocaleLowerCase('ar');return (state.merchants.filter(m=>m.active&&(categoryFilter==='الكل'||m.category===categoryFilter)).filter(m=>!q||[m.name,m.category,m.area,m.address,...state.products.filter(p=>p.merchant_id===m.id&&p.active&&p.stock>0).map(p=>p.name)].join(' ').toLocaleLowerCase('ar').includes(q)).map(m=>{let look=categoryLooks[m.category]||['🛍️','#e9f2f2'];let count=state.products.filter(p=>p.merchant_id===m.id&&p.active&&p.stock>0).length;return `<button class="merchant-card" onclick="selectMerchant(${m.id})"><span class="merchant-art" style="--tile-bg:${look[1]}">${look[0]}</span><span><strong>${esc(m.name)}</strong><small>${esc(m.category)} · ${esc(m.area)}</small><span class="merchant-open">${count?`${count} منتج متاح`:'تصفح المحل'}</span></span></button>`}).join('')+listedRestaurantCards())||'<div class="customer-empty">لا توجد محلات مطابقة حاليًا. اختر قسمًا آخر أو اطلب توصيل أي غرض.</div>'}
function renderHomeMerchantList(){let box=$('merchant-cards');if(box)box.innerHTML=merchantCards()}
function customerHome(){return `${customerTop()}<div class="customer-search"><span>⌕</span><input aria-label="ابحث عن محل أو منتج" placeholder="بتدور على محل أو منتج؟" value="${esc(homeQuery)}" oninput="homeQuery=this.value;renderHomeMerchantList()"></div><section class="customer-hero"><div><span class="eyebrow">ولعه · طلبات البدرشين</span><h2>كل اللي محتاجه، على باب بيتك</h2><p>اختار محل قريب، ضيف المنتجات، وحدد مكانك على الخريطة.</p></div><span class="hero-emoji" aria-hidden="true">🛵</span></section><div class="section-heading"><div><h2>اطلب منين النهارده؟</h2><p>سوبر ماركت، خضار، مخبوزات، صيدلية وأكتر</p></div></div><div class="category-grid">${categoryTiles()}</div><section id="merchant-section"><div class="section-heading"><div><h2>المحلات المتاحة</h2><p>اختار محلًا علشان تشوف منتجاته</p></div></div><div class="category-chips"><button class="${categoryFilter==='الكل'?'active':''}" onclick="chooseCategory('الكل')">الكل</button>${state.categories.filter(c=>c.active).map(c=>`<button class="${categoryFilter===c.name?'active':''}" onclick="chooseCategory(decodeURIComponent('${encodeURIComponent(c.name)}'))">${esc(c.name)}</button>`).join('')}</div><div class="merchant-grid" id="merchant-cards">${merchantCards()}</div></section>${rideTiles()}<div class="section-heading"><h2>خدمات سريعة</h2></div><div class="quick-services">${state.services.some(x=>x.key==='delivery'&&x.active)?'<button onclick="startService(\'delivery\')">🛵<br><strong>توصيل أي غرض</strong><br><small>من مكان لمكان</small></button>':''}${state.services.some(x=>x.key.startsWith('ride_')&&x.active)?'<button onclick="startService(\'ride\')">🚕<br><strong>اطلب مشوار</strong><br><small>توك توك أو موتوسيكل أو سيارة</small></button>':''}${state.services.filter(x=>x.key.startsWith('custom_')&&x.active).map(x=>`<button onclick="startService('custom','${x.key}')">✨<br><strong>${esc(x.name)}</strong></button>`).join('')}</div>`}
function productCards(){return catalogItems().map(p=>`<article class="product-card"><div class="product-picture">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:categoryLooks[p.category]?.[0]||'📦'}</div><small class="muted">${esc(p.category)} · متاح ${p.stock}${p.requires_prescription?' · يحتاج وصفة':''}</small><h3>${esc(p.name)}</h3><p class="price">${money(p.price)}</p><div class="quantity">${cart[p.id]?`<button aria-label="قلل ${esc(p.name)}" onclick="changeCart(${p.id},-1)">−</button><strong>${cart[p.id]}</strong><button aria-label="زود ${esc(p.name)}" onclick="changeCart(${p.id},1)">+</button>`:`<button class="add" onclick="changeCart(${p.id},1)">+ أضف للسلة</button>`}</div></article>`).join('')||'<div class="customer-empty">مافيش منتجات معروضة في المحل دلوقتي. جرّب محل تاني أو خدمة توصيل أي غرض.</div>'}
function renderStoreProducts(){let box=$('store-products');if(box)box.innerHTML=productCards()}
function cartDock(){return cartCount()?`<div class="cart-dock"><span><strong>${cartCount()} منتج</strong><br>${money(cartSubtotal())} قبل التوصيل</span><button onclick="goCustomer('checkout')">عرض السلة ←</button></div>`:''}
function customerStore(){let m=state.merchants.find(x=>x.id===merchantId&&x.active);if(!m)return customerHome();let look=categoryLooks[m.category]||['🛍️','#e9f2f2'];return `<button class="customer-back" onclick="goCustomer('home')">→ رجوع للمحلات</button><div class="store-heading"><span class="merchant-art" style="--tile-bg:${look[1]}">${look[0]}</span><div><h2>${esc(m.name)}</h2><p>${esc(m.category)} · ${esc(m.area)} · ${esc(m.address)}</p></div></div><div class="customer-search"><span>⌕</span><input aria-label="ابحث في منتجات المحل" placeholder="دور على منتج في المحل" value="${esc(productSearch)}" oninput="productSearch=this.value;renderStoreProducts()"></div><div class="section-heading"><h2>منتجات المحل</h2></div><div class="product-grid" id="store-products">${productCards()}</div>${cartDock()}`}
function customerCheckout(){if(kind==='delivery'&&!shipmentType)return shipmentPicker();if(kind==='products'&&!cartCount())return `<button class="customer-back" onclick="goCustomer('home')">→ رجوع للمحلات</button><div class="customer-empty">السلة فاضية. اختار محل ومنتجات الأول.</div>`;let merchant=state.merchants.find(m=>m.id===merchantId);let fee=Number(state.area_fees?.[state.areas[0]]||0);return `<button class="customer-back" onclick="goCustomer(kind==='products'?'store':'home')">→ رجوع</button><h2>${kind==='products'?'السلة وتأكيد الطلب':kind==='ride'?'تفاصيل المشوار':kind==='delivery'?'توصيل أي غرض':esc(state.services.find(s=>s.key===serviceKey)?.name||'خدمة جديدة')}</h2><div class="checkout-steps"><span>١. الاختيار</span><span class="active">٢. العنوان والدفع</span><span>٣. المتابعة</span></div>${kind==='products'?`<div class="card"><h3>من ${esc(merchant?.name||'المحل')}</h3>${Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>{let p=state.products.find(x=>x.id==id);return `<div class="pill">${esc(p?.name||'منتج')} × ${q} <strong>${money((p?.price||0)*q)}</strong></div>`}).join('')}<div class="checkout-total"><span>المنتجات</span><span>${money(cartSubtotal())}</span></div><div class="checkout-total"><span>رسوم التوصيل <small class="muted">تختلف حسب المنطقة</small></span><span id="fee-amount">${money(fee)}</span></div><div class="checkout-total"><span>الإجمالي</span><span id="fee-total">${money(cartSubtotal()+fee)}</span></div></div>`:`<div class="card"><p class="muted">تحدد الإدارة سعر الخدمة بعد مراجعة تفاصيلها، وتوافق عليه قبل التنفيذ.</p></div>`}<div class="card">${kind==='delivery'?`<div class="pill">نوع الشحنة: <strong>${esc(shipmentType)}</strong> <button onclick="saveCheckoutDraft();shipmentType='';render()">تغيير</button></div>${shipmentType==='أخرى'?'<label>وصف نوع الشحنة</label><input id="shipment-other" placeholder="ما الذي تريد توصيله؟">':''}<h3>إلى — المستلم</h3><label>اسم المستلم</label><input id="recipient-name" autocomplete="off"><label>رقم تليفون المستلم</label><input id="recipient-phone" type="tel" inputmode="tel">`:'<h3>عنوان التوصيل</h3>'}${fields()}${kind!=='products'?`<div>${kind==='delivery'?'<h3>من — المرسل</h3><label>اسم المرسل</label><input id="sender-name" autocomplete="off"><label>رقم تليفون المرسل</label><input id="sender-phone" type="tel" inputmode="tel">':''}<label>${kind==='delivery'?'عنوان المرسل / مكان استلام الشحنة':'مكان الاستلام'}</label><input id="pickup" placeholder="اسم المحل أو نقطة الانطلاق"><div class="row"><button type="button" onclick="selectMapPinMode('pickup')">حدد الاستلام على الخريطة</button><button type="button" onclick="selectMapPinMode('destination')">حدد الوجهة</button></div><p id="selected-pickup" class="map-legend">حدد نقطة الاستلام باللون الأزرق على الخريطة</p>${kind!=='delivery'?'<label>الوجهة</label><input id="destination" placeholder="نقطة الوصول">':''}${kind==='ride'?'<label>المركبة</label><select id="vehicle">'+vehicleOptions()+'</select>':''}</div>`:''}<label>تعليمات إضافية</label><textarea id="details" placeholder="أي تفاصيل تساعد الطيار يوصل لك"></textarea>${kind==='products'&&cartNeedsPrescription()?'<label>صورة الوصفة الطبية</label><input id="prescription" type="file" accept="image/png,image/jpeg,image/webp">':''}${pay()}<p class="muted">${kind==='products'&&cartHasMedicine()?'طلب الأدوية ينتظر مراجعة الإدارة قبل الإسناد.':'تابع حالة طلبك من شاشة طلباتي.'}</p>${previewMode?'<button class="checkout-submit" onclick="leavePreview()">سجل الدخول لإرسال الطلب</button>':'<button class="checkout-submit" onclick="placeOrder()">تأكيد وإرسال الطلب</button>'}</div>`}
function customerOrders(){return `<h2>طلباتي</h2>${previewMode?'<div class="customer-empty">سجل الدخول علشان تشوف طلباتك.</div>':state.orders.length?`<div class="order-list">${state.orders.map(o=>`<div class="card"><span class="tag">طلب #${o.id}</span><h3>${esc(status[o.status]||o.status)}</h3><p class="muted">${esc(o.merchant_name||o.pickup||o.kind)} · ${money(o.total)}</p><button onclick="selectTracking(${o.id})">تفاصيل وتتبع الطلب</button></div>`).join('')}</div>`:'<div class="customer-empty">لسه ما عندكش طلبات. أول طلب يبدأ من الرئيسية.</div>'}${trackingOrderId?`<div class="card">${trackingPanel()}</div>`:''}`}
function renderCustomer(){return `<div class="customer-app">${previewMode?'<div class="notice">تقدر تتصفح الأقسام والمحلات بدون حساب، وتسجيل الدخول مطلوب لإرسال الطلب.</div>':''}${customerView==='home'?customerHome():customerView==='store'?customerStore():customerView==='checkout'?customerCheckout():customerView==='restaurant'?`<button class="customer-back" onclick="chooseCategory('مطاعم')">→ رجوع للمطاعم</button><div class="store-heading"><span class="merchant-art">🍽️</span><h2>${esc(restaurantName)}</h2></div><div class="customer-empty">المنيو والأسعار لم تُضف لهذا المطعم بعد.</div>`:customerOrders()}${customerNav()}</div>`}
async function fileData(id){let f=$(id)?.files?.[0]||checkoutFiles[id];if(!f)return '';return await new Promise((ok,fail)=>{let rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=fail;rd.readAsDataURL(f)})}
async function placeOrder(){if(previewMode)return leavePreview();if(submitting)return;submitting=true;try{let v={client_request_id:requestId,kind,service_key:serviceKey,customer:$('customer').value.trim(),phone:$('phone').value.trim(),area:$('area').value,address:$('address').value.trim(),details:$('details').value,payment:$('payment').value,pickup:$('pickup')?.value||'',destination:kind==='delivery'?$('address').value.trim():$('destination')?.value||'',vehicle:$('vehicle')?.value||'',items:Object.entries(cart).filter(([,q])=>q>0).map(([id,quantity])=>({product_id:Number(id),quantity})),proof:await fileData('proof'),prescription:await fileData('prescription'),reference:$('reference')?.value||'',merchant_id:merchantId,shipment_type:shipmentType,shipment_other:$('shipment-other')?.value||'',sender_name:$('sender-name')?.value||'',sender_phone:$('sender-phone')?.value||'',recipient_name:$('recipient-name')?.value||'',recipient_phone:$('recipient-phone')?.value||'',address_mode:addressMode,latitude:chosenPoint?.latitude,longitude:chosenPoint?.longitude,pickup_lat:chosenPickup?.lat,pickup_lon:chosenPickup?.lon};let out=await api('order',v);cart={};checkoutDraft={};checkoutFiles={};chosenPoint=null;chosenPickup=null;customerView='orders';trackingOrderId=out.id;requestId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();sessionStorage.setItem('wallaha_request_id',requestId);render();checkoutDraft={};checkoutFiles={};alert('تم تسجيل الطلب رقم '+out.id+'. تقدر تتابعه من طلباتي.')}catch(e){alert(e.message)}finally{submitting=false}}
function canCancel(o){return ['awaiting_quote','quote_pending','medicine_review','payment_review','new','awaiting_driver','offered','assigned'].includes(o.status)&&!(o.payment==='wallet'&&(o.payment_status==='confirmed'||o.has_proof))}
function selectTracking(id){trackingOrderId=id;customerView='orders';render();document.getElementById('tracking-map')?.scrollIntoView({behavior:'smooth',block:'center'})}
function showTrack(){const id=Number($('track').value);if(!state.orders.some(o=>o.id===id))return alert('الطلب غير موجود');selectTracking(id)}
function trackingPanel(){let o=state.orders.find(x=>x.id===trackingOrderId);if(!o)return '';return `<h3>متابعة طلب #${o.id}</h3><div class="pill">${status[o.status]} · ${money(o.total)}${o.driver_name?` · المندوب: ${esc(o.driver_name)}`:''}${o.merchant_name?` · الاستلام من: ${esc(o.merchant_name)} (${esc(o.merchant_address)})`:''}</div><div id="tracking-map" class="map"></div><p class="map-legend">الأزرق المحل، البرتقالي عنوانك، والأخضر آخر موقع أرسله المندوب${o.driver_location_at?' في '+esc(o.driver_location_at):''}. يتحدث الموقع حين يفتح المندوب واجهته ويفعّل المشاركة.</p>${canCancel(o)?`<button onclick="cancelMyOrder(${o.id})">إلغاء الطلب</button>`:''}${o.status==='quote_pending'?`<div class="pill">السعر المقترح ${money(o.total)}. <button onclick="act(${o.id},'accept_quote')">أوافق على السعر</button> <button onclick="act(${o.id},'decline_quote')">رفض</button></div>`:''}${o.payment==='wallet'&&o.status==='payment_review'&&!o.has_proof?`<div class="pill">حوّل ${money(o.total)} إلى ${esc(state.settings.wallet)} ثم ارفع الإثبات.<input id="track-proof" type="file" accept="image/*"><input id="track-ref" placeholder="رقم العملية"><button onclick="sendProof(${o.id})">إرسال الإثبات</button></div>`:''}<p class="small">${o.events.map(e=>esc(e.action)).join(' ← ')}</p>`}

async function cancelMyOrder(id){if(!confirm('هل تريد إلغاء الطلب قبل تنفيذه؟'))return;try{await api('order/action',{id,action:'customer_cancel'});alert('تم إلغاء الطلب وإعادة الكمية المتاحة')}catch(e){alert(e.message)}}
async function sendProof(id){try{await api('order/action',{id,action:'submit_proof',proof:await fileData('track-proof'),reference:$('track-ref').value});alert('وصل الإثبات للمراجعة')}catch(e){alert(e.message)}}
function orderCard(o,role){return `<div class="card"><span class="tag">#${o.id} · ${status[o.status]}</span><h3>${esc({products:'منتجات',delivery:'توصيل أوردر',ride:'مشوار',custom:state.services.find(s=>s.key===o.service_key)?.name||'خدمة إضافية'}[o.kind])} · ${esc(o.area)}</h3>${o.kind==='delivery'&&o.shipment_type?`<div class="pill"><strong>الشحنة: ${esc(o.shipment_type)}</strong> ${esc(o.shipment_other)}<p>المرسل: ${esc(o.sender_name)} · ${esc(o.sender_phone)} · ${esc(o.pickup)}</p><p>المستلم: ${esc(o.recipient_name)} · ${esc(o.recipient_phone)} · ${esc(o.address)}</p></div>`:''}<p>${esc(o.customer)} · ${esc(o.phone)} · ${esc(o.address)}</p>${o.merchant_name?`<p>الاستلام من: ${esc(o.merchant_name)} · ${esc(o.merchant_address)}</p>`:''}${o.items.length?`<p>${o.items.map(i=>`${esc(i.name)} × ${i.quantity}`).join('، ')}</p>`:''}${o.pickup?`<p>من: ${esc(o.pickup)} ← إلى: ${esc(o.destination)} ${esc(o.vehicle)}</p>`:''}<p class="muted">${esc(o.details)} · ${o.payment==='cash'?'كاش':'محفظة'} · ${o.payment_status==='pending'?'الدفع قيد المراجعة':'الدفع مؤكد/كاش'} · ${money(o.total)}</p><p class="muted">المندوب: ${esc(o.driver_name||'لم يُحدد')}</p>${role==='driver'?`<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.latitude!=null?o.latitude+','+o.longitude:o.address+' '+o.area)}">📍 الاتجاهات إلى العميل</a></p>`:''}${role==='admin'?adminActions(o):driverActions(o)}</div>`}
function adminActions(o){return `<div class="stack">${o.prescription?`<a href="${o.prescription}" target="_blank" download="prescription-${o.id}.png">عرض الوصفة</a>`:''}${o.status==='medicine_review'?`<button onclick="act(${o.id},'approve_medicine')">تمت مراجعة طلب الأدوية</button><button onclick="act(${o.id},'reject_medicine')">رفض الطلب</button>`:''}${o.payment==='cash'&&o.status==='delivered'&&o.cash_collected&&!o.cash_settled?`<button onclick="act(${o.id},'settle_cash')">استلمت الكاش من المندوب</button>`:''}${o.proof&&o.payment_status==='pending'?`<a href="${o.proof}" download="proof-${o.id}.png" target="_blank">فتح إثبات التحويل</a> <button onclick="act(${o.id},'confirm_payment')">تأكيد وصول المبلغ</button>`:''}${['awaiting_quote','quote_pending'].includes(o.status)?`<input id="quote-${o.id}" type="number" min="0" placeholder="السعر بالجنيه"><button onclick="act(${o.id},'price',Number($('quote-${o.id}').value))">تحديد السعر</button>`:''}${o.status==='new'?`<button onclick="act(${o.id},'approve_order')">مراجعة وتوزيع الطلب القديم</button>`:''}${['assigned','awaiting_driver','ready'].includes(o.status)?`<label>تعيين مندوب من المنطقة</label><select id="assign-${o.id}">${state.drivers.filter(d=>d.area===o.area&&d.available).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><button onclick="reassign(${o.id})">إسناد يدوي</button>`:''}${!['delivered','cancelled'].includes(o.status)?`<button onclick="act(${o.id},'cancel')">إلغاء الطلب</button>`:''}</div>`}
function driverActions(o){return `<div class="stack">${o.status==='offered'?`<button onclick="act(${o.id},'accept_offer')">أقبل المهمة وأتجه للمحل</button><button onclick="act(${o.id},'decline_offer')">اعتذار؛ اعرضها على التالي</button>`:''}${['ready','assigned'].includes(o.status)?`<button onclick="act(${o.id},'picked_up')">استلمت من المحل / بدأت المشوار</button>`:''}${o.status==='picked_up'?`<button onclick="act(${o.id},'on_way')">في الطريق</button>`:''}${o.status==='on_way'?`<button onclick="act(${o.id},'delivered')">تم التسليم</button>`:''}</div>`}
async function act(id,action,amount){try{let cash_collected=false;if(action==='delivered'&&state.orders.find(o=>o.id===id)?.payment==='cash'){if(!confirm('هل حصّلت المبلغ النقدي كاملًا من العميل؟'))return;cash_collected=true}await api('order/action',{id,action,amount,cash_collected})}catch(e){alert(e.message)}}
function jumpAdmin(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderAdminStats(){const stats=state.daily_stats||{day:'',customers:[],drivers:[]};return `<div class="card" id="admin-daily"><h3>حركة اليوم · ${esc(stats.day)}</h3><p class="muted">عدد الطلبات وقيمتها للعميل، والتسليمات للمندوب في يوم القاهرة. المسافة تقديرية من نقاط GPS أثناء مشاركة الموقع والعمل على طلب؛ لا تُحسب عند إغلاق التطبيق أو توقف المشاركة.</p><h4>العملاء</h4>${stats.customers.map(c=>`<div class="pill"><strong>${esc(c.name)}</strong> · ${esc(c.phone)} · ${c.orders_today} طلب اليوم · ${money(c.amount_today)}${state.orders.filter(o=>o.user_id===c.id).slice(0,5).map(o=>`<div class="muted">#${o.id} · ${esc(status[o.status]||o.status)} · ${money(o.total)} · ${esc(o.created_at)}</div>`).join('')}</div>`).join('')||'<div class="empty">لا توجد حسابات عملاء</div>'}<h4>الطيارون</h4>${stats.drivers.map(d=>`<div class="pill"><strong>${esc(d.name)}</strong> · ${esc(d.vehicle_type)} · ${d.delivered_today} طلب تم تسليمه اليوم · ${money(d.amount_today)} · ${(Number(d.meters_today||0)/1000).toFixed(2)} كم GPS${state.orders.filter(o=>o.driver_id===d.id).slice(0,5).map(o=>`<div class="muted">#${o.id} · ${esc(status[o.status]||o.status)} · ${money(o.total)} · ${esc(o.created_at)}</div>`).join('')}</div>`).join('')||'<div class="empty">لم تُضف طيارين بعد</div>'}</div>`}
function renderAdmin(){return `<h2>لوحة التحكم</h2><div class="admin-menu"><button onclick="jumpAdmin('admin-map-section')">الخريطة</button><button onclick="jumpAdmin('admin-daily')">إحصاءات اليوم</button><button onclick="jumpAdmin('admin-orders')">الطلبات</button><button onclick="jumpAdmin('admin-products')">المنتجات</button><button onclick="jumpAdmin('admin-categories')">الأقسام</button><button onclick="jumpAdmin('admin-merchants')">المحلات</button><button onclick="jumpAdmin('admin-drivers')">الطيارون</button><button onclick="jumpAdmin('admin-services')">الخدمات</button><button onclick="jumpAdmin('admin-cash')">تحصيل الكاش</button><button onclick="jumpAdmin('admin-settings')">الإعدادات</button></div><button onclick="enableNotifications()">تفعيل تنبيهات الطلبات</button><div class="card" id="admin-map-section"><h3>خريطة الطلبات والمندوبين</h3><p class="map-legend">الأزرق موقع المحل، البرتقالي عنوان العميل، والأخضر آخر موقع شاركه المندوب. اضغط على العلامة للتفاصيل.</p><div id="admin-map" class="map"></div></div>${renderAdminStats()}<div class="grid"><div class="card" id="admin-products"><h3>أضف منتجًا</h3><label>الاسم</label><input id="p-name"><label>القسم</label><select id="p-category" onchange="renderProductMerchantChoices()">${options(state.categories.filter(c=>c.active).map(c=>c.name))}</select><label>المحل</label><select id="p-merchant">${state.merchants.filter(m=>m.active).map(m=>`<option value="${m.id}" data-category="${esc(m.category)}">${esc(m.name)} · ${esc(m.area)}</option>`).join('')}</select><label>السعر</label><input id="p-price" type="number" min="0"><label>الكمية</label><input id="p-stock" type="number" min="0"><label>صورة المنتج</label><input id="p-image" type="file" accept="image/png,image/jpeg,image/webp"><label><input id="p-rx" type="checkbox" style="width:auto"> يحتاج وصفة (للأدوية)</label><button onclick="addProduct()">حفظ المنتج</button></div><div class="card" id="admin-drivers"><h3>أضف طيارًا</h3><label>الاسم</label><input id="d-name"><label>الهاتف</label><input id="d-phone"><label>اسم مستخدم المندوب (حروف إنجليزية)</label><input id="d-username" autocomplete="off"><label>كلمة مرور المندوب (10 أحرف على الأقل)</label><input id="d-password" type="password"><label>المركبة</label><select id="d-vehicle"><option>موتوسيكل</option><option>عجلة</option><option>توك توك</option><option>سيارة</option><option>ميكروباص</option></select><label>المنطقة</label><select id="d-area">${options(state.areas)}</select><button onclick="addDriver()">حفظ المندوب</button></div></div><div class="card" id="admin-merchants"><h3>أماكن المحلات والصيدليات</h3><p class="muted">ثبت موقع كل محل على الخريطة، ثم اربط منتجاته به. الأقرب يُحسب من موقع المحل.</p><input id="m-name" placeholder="اسم المحل"><select id="m-category">${options(state.categories.filter(c=>c.active).map(c=>c.name))}</select><select id="m-area">${options(state.areas)}</select><input id="m-address" placeholder="عنوان المحل بالتفصيل"><div id="merchant-map" class="map"></div><p id="merchant-point" class="map-legend">اضغط الخريطة لتحديد مكان المحل</p><button onclick="createMerchant()">حفظ المحل</button>${state.merchants.map(m=>`<div class="pill">${esc(m.name)} · ${esc(m.category)} · ${esc(m.area)} · ${esc(m.address)} <button onclick="toggleMerchant(${m.id},${m.active?'false':'true'})">${m.active?'إيقاف':'تشغيل'}</button></div>`).join('')}</div><div class="card" id="admin-categories"><h3>أقسام المنتجات</h3><p class="muted">أضف قسمًا أو أخفه بعد إخفاء منتجاته المعروضة.</p><div class="row"><input id="category-name" placeholder="اسم قسم جديد"><button onclick="createCategory()">إضافة قسم</button></div>${state.categories.map(c=>`<div class="row"><span>${esc(c.name)}</span><button onclick="toggleCategory(decodeURIComponent('${encodeURIComponent(c.name)}'),${c.active?'false':'true'})">${c.active?'إخفاء':'إظهار'}</button></div>`).join('')}</div><div class="card" id="admin-settings"><h3>إعدادات الدفع والتوصيل</h3><label>رقم المحفظة</label><input id="s-wallet" value="${esc(state.settings.wallet)}"><label>رقم واتساب</label><input id="s-whatsapp" value="${esc(state.settings.whatsapp)}"><button onclick="saveSettings()">حفظ الأرقام</button></div><div class="card"><h3>رسوم توصيل المنتجات لكل منطقة</h3>${state.areas.map((area,i)=>`<div class="row"><span>${esc(area)}</span><input id="area-fee-${i}" type="number" min="0" value="${state.area_fees[area]}"><button onclick="saveAreaFee(${i})">حفظ</button></div>`).join('')}</div><div class="grid"><div class="card"><h3>ملخص الطلبات</h3><p>إجمالي الطلبات: ${state.orders.length}</p><p>طلبات جارية: ${state.orders.filter(o=>!['delivered','cancelled'].includes(o.status)).length}</p><p>طلبات مسلمة: ${state.orders.filter(o=>o.status==='delivered').length}</p><p>تحتاج مراجعة: ${state.orders.filter(o=>['new','medicine_review','payment_review','awaiting_quote'].includes(o.status)).length}</p><p>منتجات قاربت على النفاد (5 أو أقل): ${state.products.filter(p=>p.active&&p.stock<=5).length}</p><p>قيمة الطلبات المسلمة: ${money(state.orders.filter(o=>o.status==='delivered').reduce((v,o)=>v+o.total,0))}</p></div><div class="card" id="admin-cash"><h3>تحصيل الكاش</h3><p>في عهدة المندوبين: ${money(state.orders.filter(o=>o.payment==='cash'&&o.cash_collected&&!o.cash_settled).reduce((v,o)=>v+o.total,0))}</p><p>تمت تسويته: ${money(state.orders.filter(o=>o.payment==='cash'&&o.cash_settled).reduce((v,o)=>v+o.total,0))}</p></div></div><div class="card" id="admin-services"><h3>الخدمات</h3><label>خدمة جديدة بتسعير يدوي</label><input id="service-name" placeholder="مثال: توصيل مستندات"><button onclick="createService()">إضافة خدمة</button>${state.services.map(s=>`<div class="row"><span>${esc(s.name)}</span><button onclick="toggleService('${s.key}',${s.active?'false':'true'})">${s.active?'إيقاف مؤقت':'تشغيل'}</button></div>`).join('')}</div><h2 id="admin-orders">الطلبات (${state.orders.length})</h2><div class="catalog-tools"><label>عرض الطلبات<select id="order-filter" onchange="orderFilter=this.value;render()">${options(['الجارية','تحتاج مراجعة','المنتهية','الكل'],orderFilter)}</select></label></div>${state.orders.filter(o=>orderFilter==='الكل'||(orderFilter==='المنتهية'?['delivered','cancelled'].includes(o.status):orderFilter==='تحتاج مراجعة'?['new','medicine_review','payment_review','awaiting_quote'].includes(o.status):!['delivered','cancelled'].includes(o.status))).map(o=>orderCard(o,'admin')).join('')||'<div class="empty">لا توجد طلبات في هذا العرض</div>'}<h2>المنتجات والمندوبون</h2><div class="grid"><div class="card">${state.products.map(p=>`<div class="pill">${esc(p.name)} · <select id="merchant-${p.id}">${state.merchants.filter(m=>m.category===p.category).map(m=>`<option value="${m.id}" ${p.merchant_id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input id="price-${p.id}" type="number" min="0" value="${p.price}" style="width:90px"> ج · متاح <input id="stock-${p.id}" type="number" min="0" value="${p.stock}" style="width:75px"> <label><input id="active-${p.id}" type="checkbox" ${p.active?"checked":""} style="width:auto"> ظاهر</label><label><input id="rx-${p.id}" type="checkbox" ${p.requires_prescription?"checked":""} style="width:auto"> وصفة</label><button onclick="updateProduct(${p.id})">حفظ</button><button onclick="removeProduct(${p.id})">إخفاء المنتج</button></div>`).join('')}</div><div class="card">${state.drivers.map(d=>`<div class="pill">${esc(d.name)} · ${esc(d.area)} · ${esc(d.phone)} · المستخدم: ${esc(d.username||'رقم الهاتف')} · ${d.available?"متاح":"غير متاح"} <button onclick="driverAvailable(${d.id},${d.available?"false":"true"})">تغيير التوافر</button> ${d.location_at?`· <a href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}#map=16/${d.lat}/${d.lon}" target="_blank" rel="noopener">آخر موقع (${esc(d.location_at)})</a>`:"· الموقع لم يُشارك"}</div>`).join('')||'لم تضف مندوبًا'}</div></div>`}
function renderProductMerchantChoices(){let category=$('p-category').value;for(let o of $('p-merchant').options)o.hidden=o.dataset.category!==category;let first=[...$('p-merchant').options].find(o=>!o.hidden);if(first)$('p-merchant').value=first.value}
async function createMerchant(){if(!merchantPoint)return alert('حدد موقع المحل على الخريطة');try{await api('merchant/create',{name:$('m-name').value,category:$('m-category').value,area:$('m-area').value,address:$('m-address').value,...merchantPoint});merchantPoint=null}catch(e){alert(e.message)}}
async function toggleMerchant(id,active){try{await api('merchant/update',{id,active})}catch(e){alert(e.message)}}
async function addProduct(){try{await api('product',{name:$('p-name').value,category:$('p-category').value,price:$('p-price').value,stock:$('p-stock').value,merchant_id:Number($('p-merchant').value),image:await fileData('p-image'),requires_prescription:$('p-rx').checked})}catch(e){alert(e.message)}}
async function saveSettings(){try{await api('settings',{wallet:$('s-wallet').value,whatsapp:$('s-whatsapp').value,delivery_fee:state.settings.delivery_fee})}catch(e){alert(e.message)}}
async function saveAreaFee(i){try{await api('area-fee',{area:state.areas[i],fee:$('area-fee-'+i).value})}catch(e){alert(e.message)}}
async function reassign(id){try{await api('order/reassign',{id,driver_id:Number($('assign-'+id).value)})}catch(e){alert(e.message)}}
async function driverAvailable(id,available){try{await api('driver/availability',{id,available})}catch(e){alert(e.message)}}
async function removeProduct(id){if(!confirm('إخفاء المنتج من قائمة العملاء؟ الطلبات السابقة ستبقى محفوظة.'))return;try{await api('product/delete',{id})}catch(e){alert(e.message)}}
async function createCategory(){try{await api('category/create',{name:$('category-name').value})}catch(e){alert(e.message)}}
async function toggleCategory(name,active){try{await api('category/update',{name,active})}catch(e){alert(e.message)}}
async function createService(){try{await api('service/create',{name:$('service-name').value})}catch(e){alert(e.message)}}
async function toggleService(key,active){try{await api('service',{key,active})}catch(e){alert(e.message)}}
async function updateProduct(id){try{await api('product/update',{id,price:$('price-'+id).value,stock:$('stock-'+id).value,merchant_id:Number($('merchant-'+id).value),active:$('active-'+id).checked,requires_prescription:$('rx-'+id).checked})}catch(e){alert(e.message)}}
let locationWatch=null,lastLocation=0;
function stopLocation(){if(locationWatch!==null)navigator.geolocation.clearWatch(locationWatch);locationWatch=null}
function startLocation(){if(!navigator.geolocation){alert('الموقع غير متاح');return}if(locationWatch!==null)return;locationWatch=navigator.geolocation.watchPosition(async pos=>{if(Date.now()-lastLocation<15000)return;lastLocation=Date.now();try{await api('location',{lat:pos.coords.latitude,lon:pos.coords.longitude})}catch(e){stopLocation();alert(e.message)}},e=>alert('تعذر تحديد الموقع: '+e.message),{enableHighAccuracy:true,maximumAge:10000})}
async function addDriver(){try{await api('driver',{name:$('d-name').value,phone:$('d-phone').value,password:$('d-password').value,username:$('d-username').value,area:$('d-area').value,vehicle_type:$('d-vehicle').value})}catch(e){alert(e.message)}}
function renderDriver(){return `<h2>طلبات المندوب ${esc(state.user.name)}</h2><button onclick="enableNotifications()">تفعيل تنبيهات الإسناد</button><button onclick="startLocation()">مشاركة موقعي ليصلني أقرب طلب</button><p class="muted">تتوقف المشاركة عند إغلاق الصفحة أو الضغط على إيقاف المشاركة. يرسل آخر موقع أثناء تفعيل المشاركة، حتى قبل وصول الطلب، لاختيار الأقرب. أغلقها عند انتهاء الوردية.</p><button onclick="stopLocation()">إيقاف المشاركة</button><div id="driver-map" class="map"></div><p class="map-legend">الأزرق مكان الاستلام، والبرتقالي عنوان العميل. اضغط العلامة لقراءة العنوان.</p>${state.orders.filter(o=>!['cancelled','delivered'].includes(o.status)).map(o=>orderCard(o,'driver')).join('')||'<div class="empty">لا توجد طلبات مسندة إليك الآن</div>'}`}
function loginView(){return `<div class="card" style="background:#ecf8ef;text-align:center"><h2>شوف تطبيق ولعه من جوه</h2><p class="muted">تصفح الأقسام والمحلات والمنتجات من غير حساب. تسجيل الدخول مطلوب وقت إرسال الطلب فقط.</p><button onclick="browsePreview()">تصفح التطبيق بدون تسجيل</button></div><div class="grid"><div class="card"><h2>دخول ولعه</h2><label>اسم المستخدم أو رقم الهاتف</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password"><button onclick="login()">دخول</button><p class="muted">للمسؤول والمندوب والعميل</p></div><div class="card"><h2>حساب عميل جديد</h2><label>الاسم</label><input id="reg-name"><label>رقم الهاتف</label><input id="reg-phone" inputmode="tel"><label>كلمة مرور (10 أحرف على الأقل)</label><input id="reg-pass" type="password"><button onclick="register()">إنشاء حساب</button></div></div>`}
async function browsePreview(silent=false){try{let r=await fetch('/api/catalog');if(!r.ok)throw Error('تعذر تحميل الأقسام');let catalog=await r.json();previewMode=true;state={...catalog,user:{name:'زائر',phone:''},orders:[],settings:{wallet:''}};tab='customer';render()}catch(e){previewMode=false;state=null;render();if(!silent)alert(e.message)}}
function leavePreview(){previewMode=false;state=null;render()}
async function login(){try{let v=await api('login',{phone:$('login-phone').value,password:$('login-pass').value});token=v.token;previewMode=false;localStorage.setItem('wallaha_token',token);await refresh()}catch(e){alert(e.message)}}
async function register(){try{await api('register',{name:$('reg-name').value,phone:$('reg-phone').value,password:$('reg-pass').value});alert('تم إنشاء الحساب. سجل الدخول الآن.')}catch(e){alert(e.message)}}
async function logout(){if(previewMode)return leavePreview();try{await api('logout',{})}catch(e){}token='';localStorage.removeItem('wallaha_token');state=null;chosenPoint=null;chosenPickup=null;merchantPoint=null;trackingOrderId=null;render()}
async function changePassword(){let old=$('current-pass').value, next=$('new-pass').value;if(!old||next.length<10){alert('اكتب كلمة المرور الحالية وجديدة من 10 أحرف على الأقل');return}try{await api('change-password',{current_password:old,new_password:next});alert('تم تغيير كلمة المرور وإغلاق الجلسات الأخرى')}catch(e){alert(e.message)}}
function accountPanel(){return `<details class="card"><summary>إعدادات حسابي</summary><label>كلمة المرور الحالية</label><input id="current-pass" type="password" autocomplete="current-password"><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="new-pass" type="password" autocomplete="new-password"><button onclick="changePassword()">تغيير كلمة المرور</button></details>`}
function render(){saveCheckoutDraft();clearMaps();$('logout').style.display=state?'block':'none';$('logout').textContent=previewMode?'دخول':'تسجيل الخروج';$('reload').style.display=state&&!previewMode?'block':'none';$('app').innerHTML=(offline?'<div class="notice">الاتصال غير متاح الآن. الطلبات تحتاج اتصالًا بالإنترنت. اضغط تحديث الطلبات عند عودته.</div>':'')+(!state?loginView():(tab==='customer'?renderCustomer():tab==='admin'?renderAdmin():renderDriver())+(previewMode?'':accountPanel()));restoreCheckoutDraft();initMaps();if(state&&tab==='admin')renderProductMerchantChoices()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').style.display='block'});document.getElementById("manifest").href="/manifest/"+(["driver","admin"].includes(location.pathname.slice(1))?location.pathname.slice(1):"customer")+".json";if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});refresh();setInterval(()=>{if(state&&(['admin','driver'].includes(tab)||(tab==='customer'&&trackingOrderId))&&document.visibilityState==='visible'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))refresh()},15000);</script></body></html>
