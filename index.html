async function enableDriverSound(){localStorage.removeItem('wallaha_sound_muted');try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('هذا المتصفح لا يدعم صوت التنبيه');if(!driverAudio||driverAudio.state==='closed')driverAudio=new Audio();await driverAudio.resume();if(driverAudio.state!=='running')throw Error('لم يُفعّل الصوت. اضغط الزر مرة أخرى وتأكد من مستوى صوت الوسائط');driverSoundEnabled=true;driverSoundError='';playDriverAlarm();updateSoundStatus();render()}catch(e){driverSoundEnabled=false;driverSoundError=e.message;updateSoundStatus();alert(e.message)}}
function muteDriverSound(){localStorage.setItem('wallaha_sound_muted','1');driverSoundEnabled=false;driverSoundError='';driverAudio?.suspend().catch(()=>{});render()}
function checkDriverOffers(){let account=state.user.id;if(driverOfferAccount!==account){driverOfferAccount=account;heardDriverOffers.clear();driverSoundError=''}let fresh=offeredNow().filter(o=>!heardDriverOffers.has(o.id+':'+o.offer_until));for(let o of fresh){heardDriverOffers.add(o.id+':'+o.offer_until);notifyNewOrder(o.id,'driver')}if(fresh.length)playDriverAlarm();while(heardDriverOffers.size>500)heardDriverOffers.delete(heardDriverOffers.values().next().value)}

function restoreCheckoutDraft(){if(!document.querySelector('#customer-map'))return;if(kind==='products'&&!previewMode&&checkoutDraft.address===undefined)checkoutDraft={...(savedCustomerAddress().area?{area:savedCustomerAddress().area}:{}),...checkoutDraft};if(!previewMode){if($('sender-name')&&!checkoutDraft['sender-name'])$('sender-name').value=state.user.name;if($('sender-phone')&&!checkoutDraft['sender-phone'])$('sender-phone').value=state.user.phone;}for(let [id,value] of Object.entries(checkoutDraft)){let el=$(id);if(el&&(!(el instanceof HTMLSelectElement)||[...el.options].some(o=>o.value===value)))el.value=value}if($('proof-fields'))$('proof-fields').style.display=$('payment').value==='wallet'&&kind==='products'&&!cartHasMedicine()?'block':'none';updateFeePreview()}

const weightChoices={};
function soldByWeight(p){return !!p&&!/علبة|عبوة|باكت|معلب|مجمد|مجمّد|Frozen|Pack|حزمة|ربطة|قطعة|قطعتين|حبة|سبريد|شرائح جاهزة/i.test(p.name)&&(/خضار|فاكهة|فواكه|لحوم|أسماك|دواجن/.test(p.category)||(p.category==='سوبر ماركت'&&(/^(?:لحم|لحمة|كبدة|دجاج طازج|فراخ طازجة|سمك|بلطي|بوري|جمبري|كابوريا|ثوم طازج|لانشون|لنشون|لَنشون|بسطرمة|سلامي|مرتديلا|ديك رومي|جبنة رومي|جبن رومي|جبنة شيدر|جبن شيدر)(?:\s|$)/.test(p.name)||(/لانشون|سلامي|سلامى|بسطرمة/.test(p.name)&&/بالوزن|بالكيلو/.test(p.name)))))}
function weightBasis(p){let m=p.name.match(/(\d+(?:[.]\d+)?)\s*(كجم|كيلو|kg|جرام|غرام|جم|g)(?=\s|$|[^\w\u0600-\u06ff])/i);return m?(Number(m[1])/(/^(جرام|غرام|جم|g)$/i.test(m[2])?1000:1)||1):1}
function productPrice(p){return (p?.price||0)/(soldByWeight(p)?weightBasis(p):1)}
function weightLabel(p,q){return soldByWeight(p)?(q===0.25?'ربع كيلو':q===0.5?'نص كيلو':q===1?'كيلو':q+' كجم'):q+' قطعة'}
function weightPicker(p){return soldByWeight(p)?`<label for="weight-${p.id}">الوزن</label><select id="weight-${p.id}" aria-label="وزن ${esc(p.name)}" onchange="weightChoices[${p.id}]=Number(this.value)"><option value="0.25" ${(weightChoices[p.id]||1)===0.25?'selected':''}>ربع كيلو (٢٥٠ جرام)</option><option value="0.5" ${(weightChoices[p.id]||1)===0.5?'selected':''}>نص كيلو (٥٠٠ جرام)</option><option value="1" ${(weightChoices[p.id]||1)===1?'selected':''}>كيلو (١٠٠٠ جرام)</option></select>`:''}
function weightHint(p){return soldByWeight(p)?'<span class="tag">الوزن: ربع أو نص أو كيلو</span>':''}
function cartCount(){return Object.values(cart).filter(q=>q>0).length}
function cartSubtotal(){return Object.entries(cart).reduce((sum,[id,q])=>sum+productPrice(state.products.find(p=>p.id==id))*Math.max(0,q),0)}
function goCustomer(view){if(view==='checkout'&&customerView!=='checkout'){autoCheckoutLocationAttempted=false;if(kind==='products'){mapPinMode='destination';addressMode='gps'}}customerView=view;render();window.scrollTo({top:0,behavior:'smooth'})}
function chooseCategory(name){draftLimit=48;draftExpanded=name!=='الكل';kind='products';categoryFilter=name;customerView='home';render();document.getElementById('draft-catalog')?.scrollIntoView({behavior:'smooth',block:'start'})}
function selectMerchant(value){let next=Number(value);if(merchantId!==next&&cartCount()&&!confirm('تغيير المحل هيفرّغ السلة الحالية. تكمل؟'))return;if(merchantId!==next){cart={};shopAnywhere=false}merchantId=next;kind='products';categoryFilter=state.merchants.find(m=>m.id===next)?.category||'الكل';productSearch='';goCustomer('store')}
function changeCart(id,delta){let product=state.products.find(p=>p.id===id);if(!product)return;let step=soldByWeight(product)?(weightChoices[id]||1):1,max=product.stock*(soldByWeight(product)?weightBasis(product):1);let next=(cart[id]||0)+delta*step;if(next>max){alert('الوزن أو الكمية المطلوبة غير متاحة');return}cart[id]=Math.max(0,next);if(!cart[id])delete cart[id];let y=window.scrollY;render();window.scrollTo(0,y)}
function startService(type,key=''){if(cartCount()&&!confirm('بدء خدمة جديدة هيفرّغ السلة الحالية. تكمل؟'))return;if(type==='delivery')shipmentType='';kind=type;serviceKey=key;merchantId=0;cart={};goCustomer('checkout')}
function openCustomerAccount(){if(previewMode)leavePreview();else goCustomer('account')}
function savedCustomerAddress(){try{return JSON.parse(localStorage.getItem('wallaha_address_'+state.user.id)||'{}')}catch(e){return {}}}
function saveAccountAddress(){let saved={area:$('account-area').value,address:$('account-address').value.trim()};localStorage.setItem('wallaha_address_'+state.user.id,JSON.stringify(saved));checkoutDraft={...checkoutDraft,...saved};alert('تم حفظ عنوانك على هذا الجهاز لاستخدامه في طلبات المشتريات')}
function customerAccount(){let saved=savedCustomerAddress(),count=state.orders.length;return `<section class="account-head"><button class="account-settings" onclick="document.getElementById('account-settings')?.scrollIntoView({behavior:'smooth'})" aria-label="إعدادات الحساب">⚙</button><div class="account-identity"><span class="account-avatar">${esc((state.user.name||'و').trim().charAt(0))}</span><div><h2>${esc(state.user.name)}</h2><p>${esc(state.user.phone)}</p></div></div></section><section class="account-feature"><span>🛵</span><div><strong>ولعه معاك في كل مشوار</strong><p>طلبات البيت والتوصيل والمشاوير من تطبيق واحد.</p></div></section><div class="account-list"><button onclick="goCustomer('orders')"><span class="account-icon">▤</span><strong>طلباتي السابقة</strong><small>${count} طلب</small><b>‹</b></button><button onclick="goCustomer('home')"><span class="account-icon">⌂</span><strong>اطلب خدمة جديدة</strong><b>‹</b></button><details id="account-settings"><summary><span class="account-icon">⚙</span><strong>إعدادات الحساب</strong><b>‹</b></summary>${accountPanel()}${emailRecoveryPanel()}</details><details><summary><span class="account-icon">?</span><strong>مساعدة</strong><b>‹</b></summary><p>اختار الخدمة والموقع ثم أكد الطلب. تقدر تكلم الطيار أو تراسله من تفاصيل الطلب بعد قبوله.</p></details><details><summary><span class="account-icon">ⓘ</span><strong>عن ولعه</strong><b>‹</b></summary><p>خدمات التوصيل والمشاوير في البدرشين وقراها.</p></details></div><details class="card account-address"><summary>📍 عنوان المشتريات المعتاد</summary><p class="muted">محفوظ على هذا الجهاز ويمكن تغييره وقت الطلب.</p><label for="account-area">المنطقة</label><select id="account-area">${options(state.areas,saved.area)}</select><label for="account-address">العنوان</label><input id="account-address" value="${esc(saved.address||'')}" placeholder="الشارع ورقم البيت وعلامة مميزة"><button onclick="saveAccountAddress()">حفظ عنواني</button></details><button class="account-logout" onclick="logout()">تسجيل الخروج</button>`}
async function usePickupGPS(){if(!navigator.geolocation)return alert('GPS غير متاح');try{let pos=await new Promise((ok,fail)=>navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:true,maximumAge:0,timeout:15000}));saveCheckoutDraft();chosenPickup={lat:pos.coords.latitude,lon:pos.coords.longitude};checkoutDraft.pickup='موقعي الحالي على الخريطة';mapPinMode='destination';render()}catch(e){alert('تعذر تحديد موقع الانطلاق. اسمح بإذن الموقع أو حدد الاستلام على الخريطة')}}
function customerNav(){return `<nav class="customer-bottom" aria-label="التنقل في تطبيق العميل"><button class="${customerView==='home'||customerView==='store'||customerView==='product'?'active':''}" onclick="goCustomer('home')"><b>⌂</b>الرئيسية</button><button class="${customerView==='orders'?'active':''}" onclick="goCustomer('orders')"><b>▤</b>طلباتك</button><button class="${customerView==='checkout'?'active':''}" onclick="goCustomer('checkout')"><b>🛒</b>السلة ${cartCount()?`(${cartCount()})`:''}</button><button class="${customerView==='account'?'active':''}" onclick="openCustomerAccount()"><b>♙</b>حسابك</button></nav>`}
function customerTop(){return `<div class="customer-topline"><div class="customer-place"><span>التوصيل إلى</span><strong>📍 البدرشين والقرى المحيطة <small>⌄</small></strong></div><button class="customer-avatar" onclick="openCustomerAccount()" aria-label="افتح حسابك">${previewMode?'👤':esc((state.user.name||'و').trim().charAt(0))}</button></div>`}
function merchantCards(){let q=homeQuery.trim().toLocaleLowerCase('ar');return (state.merchants.filter(m=>m.active&&(categoryFilter==='الكل'||m.category===categoryFilter)).filter(m=>!q||[m.name,m.category,m.area,m.address,...state.products.filter(p=>p.merchant_id===m.id&&p.active&&p.stock>0).map(p=>p.name)].join(' ').toLocaleLowerCase('ar').includes(q)).map(m=>{let look=categoryLooks[m.category]||['🛍️','#e9f2f2'];let count=state.products.filter(p=>p.merchant_id===m.id&&p.active&&p.stock>0).length;return `<button class="merchant-card" onclick="selectMerchant(${m.id})"><span class="merchant-art" style="--tile-bg:${look[1]}">${look[0]}</span><span><strong>${esc(m.name)}</strong><small>${esc(m.category)} · ${esc(m.area)}</small><span class="merchant-open">${count?`${count} منتج متاح`:'تصفح المحل'}</span></span></button>`}).join('')+listedRestaurantCards())||'<div class="customer-empty">لا توجد محلات مطابقة حاليًا. اختر قسمًا آخر أو اطلب توصيل أي غرض.</div>'}
function renderHomeMerchantList(){if($('draft-catalog-container'))$('draft-catalog-container').innerHTML=draftCatalogHTML();let box=$('merchant-cards');if(box)box.innerHTML=merchantCards()}
function normalizeSearch(value){return String(value||'').normalize('NFKC').toLowerCase().replace(/[\u064b-\u065f\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').split(/\s+/).map(w=>w.startsWith('ال')?w.slice(2):w).join(' ').trim()}
function matchesSearch(name,query){let text=normalizeSearch(name);return normalizeSearch(query).split(/\s+/).filter(Boolean).every(word=>text.includes(word))}
let selectedCatalogProductId=0;
function searchableProducts(){let available=(state.products||[]).filter(p=>p.active&&p.stock>0&&!p.price_pending&&state.merchants.some(m=>m.id===p.merchant_id&&m.active)&&state.categories.some(c=>c.name===p.category&&c.active));let ids=new Set(available.map(p=>p.id));return [...available,...(state.draft_catalog||[]).filter(p=>!ids.has(p.id))]}
function openCatalogProduct(id){selectedCatalogProductId=id;goCustomer('product')}
function openProductStore(id){let p=(state.products||[]).find(p=>p.id===id);if(!p)return;selectMerchant(p.merchant_id);if(customerView==='store'){productSearch=p.name;render()}}
function customerProduct(){let p=searchableProducts().find(p=>p.id===selectedCatalogProductId);if(!p)return '<button onclick="goCustomer(\'home\')">رجوع للبحث</button><p>هذا المنتج غير متاح حاليًا.</p>';let available=p.active&&p.stock>0&&!p.price_pending;return `<button class="customer-back" onclick="goCustomer('home')">→ رجوع لنتائج البحث</button><div class="card"><div class="product-picture" style="height:280px"><img src="${esc(p.image||'/product-illustration/'+p.id+'.svg')}" alt="${esc(p.name)}"></div><h2>${esc(p.name)}</h2><p>${esc(p.category)}</p>${available?`<p class="price">${money(productPrice(p))}${soldByWeight(p)?' / كيلو':''}</p>${weightPicker(p)}<p>المحل: ${esc(state.merchants.find(m=>m.id===p.merchant_id)?.name||'')}</p><button onclick="openProductStore(${p.id})">اختيار الكمية وإضافة للسلة</button>`:'<p class="muted">السعر والتوافر لم يُحددا بعد. المنتج غير متاح للطلب حاليًا.</p>'}</div>`}
let draftExpanded=false,draftLimit=48;
function draftCatalogHTML(){let q=homeQuery.trim(),items=(q?searchableProducts():(state.draft_catalog||[])).filter(p=>(q||categoryFilter==='الكل'||p.category===categoryFilter)&&matchesSearch(p.name,q));return `<section id="draft-catalog"><div class="section-heading"><div><h2>${q?'نتائج البحث':'كتالوج المنتجات'} · ${items.length} منتج</h2><p>${q?'اضغط على المنتج لعرض تفاصيله واختيار الكمية إذا كان متاحًا.':'المنتجات بدون أسعار للتصفح حتى تحديد السعر والتوافر.'}</p></div></div><div class="product-grid">${(draftExpanded||q?items.slice(0,draftLimit):items.slice(0,12)).map(p=>`<button class="product-card" style="color:inherit;text-align:right" onclick="openCatalogProduct(${p.id})" aria-label="عرض تفاصيل ${esc(p.name)}"><div class="product-picture"><img src="${esc(p.image||'/product-illustration/'+p.id+'.svg')}" alt="${esc(p.name)}" loading="lazy"></div><span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p class="muted">${p.active&&p.stock>0&&!p.price_pending?money(productPrice(p))+(soldByWeight(p)?' / كيلو':''):'السعر لم يُحدد'}</p>${weightHint(p)}<span class="tag">عرض التفاصيل</span></button>`).join('')||'<p class="muted">لا توجد منتجات مطابقة. جرّب اسمًا آخر.</p>'}</div>${(draftExpanded||q)&&items.length>draftLimit?'<button onclick="draftLimit+=48;renderHomeMerchantList()">عرض المزيد من المنتجات</button>':!draftExpanded&&!q&&items.length>12?'<button onclick="draftExpanded=true;render()">عرض كل منتجات الكتالوج</button>':''}</section>`}

function customerHome(){return `<div class="home-masthead">${customerTop()}<div class="customer-search"><span aria-hidden="true">⌕</span><input aria-label="ابحث عن محل أو منتج" placeholder="بتدور على إيه النهارده؟" value="${esc(homeQuery)}" oninput="homeQuery=this.value;renderHomeMerchantList()"></div></div><div class="section-heading home-section-title"><div><h2>اطلب منين النهارده؟</h2><p>اختار الخدمة اللي محتاجها</p></div></div><div class="category-grid">${categoryTiles()}</div><section class="customer-hero"><div><span class="eyebrow">ولعه في خدمتك</span><h2>كل طلباتك ومشاويرك في مكان واحد</h2><p>اختار احتياجك، وحدد موقعك، وتابع الطيار لحد الوصول.</p>${state.services.some(x=>x.key==='delivery'&&x.active)?'<button onclick="startService(\'delivery\')">اطلب توصيل الآن ←</button>':''}</div><span class="hero-emoji" aria-hidden="true">🛵</span></section><div class="section-heading"><h2>خدمات سريعة</h2></div><div class="quick-services">${state.services.some(x=>x.key==='delivery'&&x.active)?'<button onclick="startService(\'delivery\')">📦<br><strong>توصيل غرض</strong><br><small>من نقطة لنقطة</small></button>':''}${state.services.some(x=>x.key.startsWith('ride_')&&x.active)?'<button onclick="startService(\'ride\')">🚕<br><strong>اطلب مشوار</strong><br><small>اختار المركبة</small></button>':''}${state.services.filter(x=>x.key.startsWith('custom_')&&x.active).map(x=>`<button onclick="startService('custom','${x.key}')">✨<br><strong>${esc(x.name)}</strong></button>`).join('')}</div>${rideTiles()}<section id="merchant-section"><div class="section-heading"><div><h2>المحلات المتاحة</h2><p>اختار محلًا علشان تشوف منتجاته</p></div></div><div class="category-chips"><button class="${categoryFilter==='الكل'?'active':''}" onclick="chooseCategory('الكل')">الكل</button>${state.categories.filter(c=>c.active).map(c=>`<button class="${categoryFilter===c.name?'active':''}" onclick="chooseCategory(decodeURIComponent('${encodeURIComponent(c.name)}'))">${esc(c.name)}</button>`).join('')}</div><div class="merchant-grid" id="merchant-cards">${merchantCards()}</div></section><div id="draft-catalog-container">${draftCatalogHTML()}</div>`}
function productCards(){return catalogItems().map(p=>`<article class="product-card"><div class="product-picture">${p.image||p.catalog_preview?`<img src="${p.image||'/product-illustration/'+p.id+'.svg'}" alt="${esc(p.name)}">`:categoryLooks[p.category]?.[0]||'📦'}</div><small class="muted">${esc(p.category)} · متاح ${p.stock}${p.requires_prescription?' · يحتاج وصفة':''}</small><h3>${esc(p.name)}</h3><p class="price">${money(productPrice(p))}${soldByWeight(p)?' / كيلو':''}</p>${weightPicker(p)}<div class="quantity">${cart[p.id]?`<button aria-label="قلل ${esc(p.name)}" onclick="changeCart(${p.id},-1)">−</button><strong>${weightLabel(p,cart[p.id])}</strong><button aria-label="زود ${esc(p.name)}" onclick="changeCart(${p.id},1)">+</button>`:`<button class="add" onclick="changeCart(${p.id},1)">+ أضف للسلة</button>`}</div></article>`).join('')||'<div class="customer-empty">مافيش منتجات معروضة في المحل دلوقتي. جرّب محل تاني أو خدمة توصيل أي غرض.</div>'}
function renderStoreProducts(){let box=$('store-products');if(box)box.innerHTML=productCards()}
function cartDock(){return cartCount()?`<div class="cart-dock"><span><strong>${cartCount()} منتج</strong><br>${money(cartSubtotal())} قبل التوصيل</span><button onclick="goCustomer('checkout')">عرض السلة ←</button></div>`:''}

function showDeliveryQuote(q,total){
  return new Promise(resolve=>{
    const previous=document.activeElement;
    const backdrop=document.createElement('div');
    backdrop.className='quote-backdrop';
    backdrop.setAttribute('role','presentation');
    const sheet=document.createElement('section');
    sheet.className='quote-sheet';
    sheet.setAttribute('role','dialog');
    sheet.setAttribute('aria-modal','true');
    sheet.setAttribute('aria-labelledby','quote-title');
    const icon=document.createElement('div');icon.className='quote-icon';icon.textContent='🛵';
    const title=document.createElement('h2');title.id='quote-title';title.textContent='مراجعة سعر التوصيل';
    const hint=document.createElement('p');hint.className='quote-hint';hint.textContent='راجع المسافة والسعر قبل تأكيد الطلب.';
    const rows=document.createElement('div');rows.className='quote-rows';
    for(const [label,value,extra] of [['مسافة الطريق',Number(q.km).toFixed(2)+' كم',''],['رسوم التوصيل',money(q.fee),''],['الإجمالي',money(total),'quote-total']]){
      const row=document.createElement('div');row.className='quote-row '+extra;
      const name=document.createElement('span');name.textContent=label;
      const amount=document.createElement('strong');amount.textContent=value;
      row.append(name,amount);rows.append(row);
    }
    const actions=document.createElement('div');actions.className='quote-actions';
    const cancel=document.createElement('button');cancel.type='button';cancel.className='quote-cancel';cancel.textContent='رجوع';
    const accept=document.createElement('button');accept.type='button';accept.className='quote-accept';accept.textContent='تأكيد وإرسال الطلب';
    actions.append(cancel,accept);sheet.append(icon,title,hint,rows,actions);backdrop.append(sheet);
    const finish=answer=>{document.removeEventListener('keydown',onKey);backdrop.remove();previous?.focus?.();resolve(answer)};
    const onKey=e=>{if(e.key==='Escape'){e.preventDefault();finish(false)}else if(e.key==='Tab'){const target=e.shiftKey?cancel:accept;if(document.activeElement===target){e.preventDefault();(e.shiftKey?accept:cancel).focus()}}};
    cancel.addEventListener('click',()=>finish(false));accept.addEventListener('click',()=>finish(true));
    backdrop.addEventListener('click',e=>{if(e.target===backdrop)finish(false)});
    document.addEventListener('keydown',onKey);document.body.append(backdrop);cancel.focus();
  });
}

function navigationLink(lat,lon,address,label){let exact=lat!=null&&lon!=null&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lon));if(!exact&&!address)return '<span class="muted">الموقع غير مسجل</span>';let target=exact?lat+','+lon:address;return `<a class="route-link" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(target)}">📍 ${label}${exact?'':' — بحث بالعنوان'}</a>`}
function driverNavigationButton(o){if(!o||['offered','delivered','cancelled'].includes(o.status))return '';let toCustomer=['picked_up','on_way'].includes(o.status),pickup=o.merchant_address||o.pickup||'',address=o.address||o.destination||'',lat=toCustomer?o.latitude:o.pickup_lat,lon=toCustomer?o.longitude:o.pickup_lon,target=lat!=null&&lon!=null&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lon))?lat+','+lon:toCustomer?address+' '+(o.area||''):pickup+' '+(o.area||'');if(!toCustomer&&o.shop_anywhere)return '<a class="route-link driver-nav-main" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=%D8%B3%D9%88%D8%A8%D8%B1%20%D9%85%D8%A7%D8%B1%D9%83%D8%AA%20%D9%82%D8%B1%D9%8A%D8%A8">🧭 ابحث عن سوبر ماركت قريب في الخرائط</a>';if(!target.trim())return '<p class="muted">موقع الوصول غير مسجل؛ راجع بيانات الطلب.</p>';return `<a class="route-link driver-nav-main" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(target.trim())}&travelmode=driving">🧭 ${toCustomer?'افتح ملاحة التوصيل للعميل':'افتح ملاحة الاستلام'}${lat==null?' · بالعنوان':''}</a>`}
function contactLink(phone){let cleaned=String(phone||'').replace(/[^+0-9٠-٩]/g,'');return cleaned?`<a href="tel:${esc(cleaned)}">☎ ${esc(phone)}</a>`:'<span class="muted">رقم غير مسجل</span>'}
function tripDetails(o,role){if(!o)return '';let driver=state.drivers?.find(d=>d.id===o.driver_id),pickup=o.shop_anywhere?o.pickup:(o.merchant_address||o.pickup||''),destination=o.address||o.destination||'',recipient=o.recipient_name||o.customer,recipientPhone=o.recipient_phone||o.phone;return `<section class="card" id="trip-details"><div class="section-heading"><h2>تفاصيل ${o.kind==='ride'?'المشوار':'الطلب'} #${o.id}</h2><span class="tag">${esc(status[o.status]||o.status)}</span></div>${role==='driver'?driverNavigationButton(o):''}${role==='driver'&&['assigned','ready','picked_up','on_way'].includes(o.status)?`<div class="row"><a class="route-link" href="tel:${esc(recipientPhone||o.phone)}">☎ اتصل بالعميل</a><a class="route-link" href="#order-chat-${o.id}">💬 دردشة العميل</a></div>`:''}<div class="grid"><div class="trip-stop"><span class="tag">١ · الاستلام / الانطلاق</span><h3>${esc(o.shop_anywhere?'أي سوبر ماركت قريب':o.merchant_name||o.sender_name||o.customer)}</h3><p>${esc(pickup||'عنوان الاستلام غير مسجل')}</p>${o.shop_anywhere&&['offered','assigned','ready'].includes(o.status)?'<p>اختار سوبر ماركت قريب واشتري نفس الأصناف والكميات. <a class="route-link" href="https://www.google.com/maps/search/?api=1&query=%D8%B3%D9%88%D8%A8%D8%B1%20%D9%85%D8%A7%D8%B1%D9%83%D8%AA%20%D9%82%D8%B1%D9%8A%D8%A8" target="_blank" rel="noopener">ابحث عن سوبر ماركت قريب</a></p>':''}${contactLink(o.sender_phone||o.phone)}${role==='driver'||o.shop_anywhere?'':`<p>${navigationLink(o.pickup_lat,o.pickup_lon,pickup,'الاتجاهات إلى الاستلام')}</p>`}</div><div class="trip-stop"><span class="tag">٢ · التسليم / الوصول</span><h3>${esc(recipient)}</h3><p>${esc(destination)} · ${esc(o.area)}</p>${contactLink(recipientPhone)}${role==='driver'?(!['picked_up','on_way','delivered'].includes(o.status)?'<p class="muted">ملاحة العميل تظهر بعد تأكيد الاستلام.</p>':''):`<p>${navigationLink(o.latitude,o.longitude,destination+' '+o.area,'الاتجاهات إلى التسليم')}</p>`}${o.latitude==null?'<p class="muted">عنوان يدوي؛ لم تُحفظ نقطة GPS دقيقة لهذا الطلب.</p>':''}</div></div><div id="trip-route-info" class="pill" aria-live="polite"></div>${role==='driver'?'':`<button type="button" onclick="showMyLocationOnMap('trip-map')">📍 عرض موقعي على الخريطة</button><div id="trip-map" class="map"></div><p class="map-legend">الأزرق الاستلام، والبرتقالي التسليم، والأخضر آخر موقع شاركه الطيار. زر الاتجاهات يفتح الملاحة في الخرائط.</p>`}${o.shipment_type?`<p>الشحنة: ${esc(o.shipment_type)} · ${esc(o.shipment_other)}</p>`:''}${o.vehicle?`<p>المركبة المطلوبة: ${esc(o.vehicle)}</p>`:''}${o.items?.length?`${role==='driver'?driverProductChecklist(o):`<h3>محتويات الطلب</h3>${o.items.map(i=>`<div class="pill">${esc(i.name)} × ${i.quantity} ${esc(i.unit||'قطعة')} · ${money(i.unit_price*i.quantity)}</div>`).join('')}`}`:''}<p>تعليمات العميل: ${esc(o.details||'لا توجد تعليمات إضافية')}</p><div class="pill"><strong>إجمالي الطلب: ${money(o.total)}</strong><p>رسوم التوصيل: ${money(o.delivery_fee)}${o.route_km!=null?` · ${o.route_km} كم × ${money(o.km_rate)}/كم`:""} · الدفع: ${o.payment==='cash'?'نقدي':'محفظة'} · ${o.payment_status==='confirmed'?'مؤكد':'قيد المراجعة'}</p><p>الكاش: ${o.cash_settled?'تمت تسويته مع الإدارة':o.cash_collected?'حصّله الطيار':o.payment==='cash'?'لم يُسجل تحصيله بعد':'غير مطلوب'}</p></div>${role==='admin'?`<p>صاحب الحساب: ${esc(o.customer)} · ${contactLink(o.phone)}</p><p>الطيار: ${esc(o.driver_name||'لم يُسند بعد')} ${driver?contactLink(driver.phone):''}</p><p class="muted">آخر مشاركة موقع: ${esc(o.driver_location_at||'لا توجد')}</p>${adminActions(o)}`:driverActions(o)}${role==='driver'?orderChat(o):''}<h3>سجل حركة الطلب</h3><ol class="trip-timeline">${(o.events||[]).map(e=>`<li><strong>${esc(e.action)}</strong><small>${esc(new Date(e.at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'}))}</small></li>`).join('')||'<li>لا توجد أحداث مسجلة</li>'}</ol></section>`}
function orderCard(o,role){return `<div class="card"><button onclick="openTrip(${o.id})">تفاصيل الرحلة والمتابعة</button><span class="tag">#${o.id} · ${status[o.status]}</span><h3>${esc({products:'منتجات',delivery:'توصيل أوردر',ride:'مشوار',custom:state.services.find(s=>s.key===o.service_key)?.name||'خدمة إضافية'}[o.kind])} · ${esc(o.area)}</h3>${o.kind==='delivery'&&o.shipment_type?`<div class="pill"><strong>الشحنة: ${esc(o.shipment_type)}</strong> ${esc(o.shipment_other)}<p>المرسل: ${esc(o.sender_name)} · ${esc(o.sender_phone)} · ${esc(o.pickup)}</p><p>المستلم: ${esc(o.recipient_name)} · ${contactLink(o.recipient_phone)} · ${esc(o.address)}</p></div>`:''}<p>${esc(o.customer)} · ${esc(o.phone)} · ${esc(o.address)}</p>${o.shop_anywhere?'<p>الشراء من أي سوبر ماركت قريب؛ الطيار يختار المكان.</p>':o.merchant_name?`<p>الاستلام من: ${esc(o.merchant_name)} · ${esc(o.merchant_address)}</p>`:''}${o.items.length?`<p>${o.items.map(i=>`${esc(i.name)} × ${i.quantity} ${esc(i.unit||'قطعة')}`).join('، ')}</p>`:''}${o.pickup?`<p>من: ${esc(o.pickup)} ← إلى: ${esc(o.destination)} ${esc(o.vehicle)}</p>`:''}<p class="muted">${esc(o.details)} · ${o.payment==='cash'?'كاش':'محفظة'} · ${o.payment_status==='pending'?'الدفع قيد المراجعة':'الدفع مؤكد/كاش'} · ${money(o.total)}</p><p class="muted">المندوب: ${esc(o.driver_name||'لم يُحدد')}</p>${role==='driver'?`<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.latitude!=null?o.latitude+','+o.longitude:o.address+' '+o.area)}">📍 الاتجاهات إلى العميل</a></p>`:''}${role==='admin'?adminActions(o):role==='driver'?driverActions(o):''}${ratingPanel(o)}</div>`}
function adminActions(o){return `<div class="stack">${o.prescription?`<a href="${o.prescription}" target="_blank" download="prescription-${o.id}.png">عرض الوصفة</a>`:''}${o.status==='medicine_review'?`<button onclick="act(${o.id},'approve_medicine')">تمت مراجعة طلب الأدوية</button><button onclick="act(${o.id},'reject_medicine')">رفض الطلب</button>`:''}${o.payment==='cash'&&o.status==='delivered'&&o.cash_collected&&!o.cash_settled?`<button onclick="act(${o.id},'settle_cash')">استلمت الكاش من المندوب</button>`:''}${o.proof&&o.payment_status==='pending'?`<a href="${o.proof}" download="proof-${o.id}.png" target="_blank">فتح إثبات التحويل</a> <button onclick="act(${o.id},'confirm_payment')">تأكيد وصول المبلغ</button>`:''}${['awaiting_quote','quote_pending'].includes(o.status)?`<label>سعر المشوار أو التوصيل بالجنيه<input id="quote-${o.id}" type="number" min="0" max="100000" step="0.01" value="${o.total||''}" placeholder="السعر بالجنيه"></label><button onclick="submitQuote(${o.id})">تحديد السعر</button>`:''}${o.status==='new'?`<button onclick="act(${o.id},'approve_order')">مراجعة وتوزيع الطلب القديم</button>`:''}${['assigned','awaiting_driver','ready'].includes(o.status)?`<label>تعيين مندوب من المنطقة</label><select id="assign-${o.id}">${state.drivers.filter(d=>d.area===o.area&&d.available&&(o.kind!=='ride'||d.vehicle_type===o.vehicle)).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><button onclick="reassign(${o.id})">إسناد يدوي</button>`:''}${!['delivered','cancelled'].includes(o.status)?`<button onclick="act(${o.id},'cancel')">إلغاء الطلب</button>`:''}</div>`}
const driverCheckedItems=new Map(),driverShopDrafts=new Map();
function markDriverItem(orderId,productId,checked){let selected=driverCheckedItems.get(orderId)||new Set();if(checked)selected.add(productId);else selected.delete(productId);driverCheckedItems.set(orderId,selected)}
function driverProductChecklist(o){if(!o.items?.length)return '';let selected=driverCheckedItems.get(o.id)||new Set();return `<section class="driver-products"><h3>المنتجات المطلوبة · ${o.items.length}</h3>${o.items.map(it=>`<label class="driver-product-item"><img src="${esc(it.image||'/icon.svg')}" alt="${esc(it.name)}" loading="lazy"><span><strong>${esc(it.name)}</strong><br>${esc(it.quantity)} ${esc(it.unit||'قطعة')} · ${money(it.unit_price*it.quantity)}</span>${['assigned','ready'].includes(o.status)?`<input type="checkbox" aria-label="تم شراء ${esc(it.name)}" ${selected.has(it.product_id)?'checked':''} onchange="markDriverItem(${o.id},${it.product_id},this.checked)">`:''}</label>`).join('')}</section>`}
function driverActions(o){return `<div class="stack">${o.status==='offered'?`<button onclick="act(${o.id},'accept_offer')">${o.shop_anywhere?'أقبل المهمة وأختار سوبر ماركت قريب':'أقبل المهمة وأتجه للاستلام'}</button><button onclick="act(${o.id},'decline_offer')">اعتذار؛ اعرضها على التالي</button>`:''}${o.shop_anywhere&&['ready','assigned'].includes(o.status)?`<label>اسم أو عنوان السوبر ماركت اللي اشتريت منه<input id="purchase-shop" value="${esc(driverShopDrafts.get(o.id)||'')}" oninput="driverShopDrafts.set(${o.id},this.value)" placeholder="مثلاً سوبر ماركت النور، الشنباب"></label>`:''}${['ready','assigned'].includes(o.status)?`<button onclick="act(${o.id},'picked_up')">${o.shop_anywhere?'تم شراء كل المنتجات · افتح طريق العميل':'استلمت المنتجات · افتح طريق العميل'}</button>`:''}${o.status==='picked_up'?`<button onclick="act(${o.id},'on_way')">بدأت الطريق للعميل</button>`:''}${o.status==='on_way'?`<button onclick="act(${o.id},'delivered')">تم التسليم</button>`:''}</div>`}
async function submitQuote(id){let price=$('quote-'+id).value;if(price===''||!Number.isFinite(Number(price))||Number(price)<0){alert('اكتب سعرًا صحيحًا');return}try{await api('order/action',{id,action:'price',amount:price})}catch(e){alert(e.message)}}
async function act(id,action,amount){try{let purchase_shop='';const order=state.orders.find(o=>o.id===id);if(action==='picked_up'&&order?.items?.length){let selected=driverCheckedItems.get(id)||new Set();if(order.items.some(it=>!selected.has(it.product_id)))throw Error('علّم على كل منتج بعد ما تستلمه أو تشتريه');if(order.shop_anywhere){purchase_shop=$('purchase-shop')?.value.trim()||'';if(purchase_shop.length<3)throw Error('اكتب اسم أو عنوان السوبر ماركت اللي اشتريت منه')}}let cash_collected=false;if(action==='delivered'&&state.orders.find(o=>o.id===id)?.payment==='cash'){if(!confirm('هل حصّلت المبلغ النقدي كاملًا من العميل؟'))return;cash_collected=true}if(action==='accept_offer'){selectedTripId=id;driverView='trips'}await api('order/action',{id,action,amount,cash_collected,purchase_shop});if(action==='picked_up'){driverCheckedItems.delete(id);driverShopDrafts.delete(id)}}catch(e){alert(e.message)}}
function jumpAdmin(id){document.querySelectorAll('.admin-menu button').forEach(b=>{let active=b.dataset.section===id;b.classList.toggle('on',active);b.setAttribute('aria-pressed',String(active))});document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderAdminStats(){const stats=state.daily_stats||{day:'',customers:[],drivers:[]};return `<div class="card" id="admin-daily"><h3>حركة اليوم · ${esc(stats.day)}</h3><p class="muted">عدد الطلبات وقيمتها للعميل، والتسليمات للمندوب في يوم القاهرة. المسافة تقديرية من نقاط GPS أثناء مشاركة الموقع والعمل على طلب؛ لا تُحسب عند إغلاق التطبيق أو توقف المشاركة.</p><h4>العملاء</h4>${stats.customers.map(c=>`<div class="pill"><strong>${esc(c.name)}</strong> · ${esc(c.phone)} · ${c.orders_today} طلب اليوم · ${money(c.amount_today)}${state.orders.filter(o=>o.user_id===c.id).slice(0,5).map(o=>`<div class="muted">#${o.id} · ${esc(status[o.status]||o.status)} · ${money(o.total)} · ${esc(o.created_at)}</div>`).join('')}</div>`).join('')||'<div class="empty">لا توجد حسابات عملاء</div>'}<h4>الطيارون</h4>${stats.drivers.map(d=>`<div class="pill"><strong>${esc(d.name)}</strong> · ${esc(d.vehicle_type)} · ${d.delivered_today} طلب تم تسليمه اليوم · ${money(d.amount_today)} · ${(Number(d.meters_today||0)/1000).toFixed(2)} كم GPS${state.orders.filter(o=>o.driver_id===d.id).slice(0,5).map(o=>`<div class="muted">#${o.id} · ${esc(status[o.status]||o.status)} · ${money(o.total)} · ${esc(o.created_at)}</div>`).join('')}</div>`).join('')||'<div class="empty">لم تُضف طيارين بعد</div>'}</div>`}
function prepareRestaurant(index){$('m-name').value=listedRestaurants[index];$('m-category').value='مطاعم';jumpAdmin('admin-merchants');$('m-address').focus()}
function adminOverview(){let active=state.orders.filter(o=>!['delivered','cancelled'].includes(o.status)),waiting=active.filter(o=>o.status==='awaiting_driver'),review=active.filter(o=>['awaiting_quote','quote_pending','medicine_review','payment_review','new'].includes(o.status));return `<section class="admin-overview"><div class="section-heading"><div><h2>إدارة ولعه</h2><p>آخر تحديث: ${esc(new Date().toLocaleTimeString('ar-EG'))} · تحديث تلقائي أثناء فتح اللوحة</p></div><button onclick="refresh()">تحديث الآن</button></div><div class="grid"><div class="card"><strong class="price">${active.length}</strong><p>طلبات جارية</p></div><div class="card"><strong class="price">${waiting.length}</strong><p>بانتظار طيار متاح</p></div><div class="card"><strong class="price">${review.length}</strong><p>تحتاج مراجعة أو موافقة</p></div><div class="card"><strong class="price">${state.drivers.filter(d=>d.available&&d.location_at&&Date.now()-Date.parse(d.location_at)<300000).length}</strong><p>طيار متاح بموقع حديث</p></div></div><div class="card"><h3>استكمال تشغيل المحلات</h3><p class="muted">ثبت عنوان وموقع المطعم ثم أضف المنيو. طلبات المشاوير تُعرض على أقرب طيار بنفس المركبة المطلوبة.</p><div class="stack">${listedRestaurants.map((name,i)=>state.merchants.some(m=>m.name===name)?'':`<button onclick="prepareRestaurant(${i})">إعداد ${esc(name)}</button>`).join('')||'<span class="ok">المطاعم السبعة مضافة إلى الإدارة</span>'}</div></div></section>`}
let adminProductQuery='',adminProductLimit=40;
function adminProductItems(){return state.products.filter(p=>matchesSearch(p.name+' '+p.category,adminProductQuery))}
function refreshAdminProductList(){let box=$('admin-product-list');if(box)box.innerHTML=adminProductRows()}
function adminProductRows(){let items=adminProductItems();return `<p>${items.length} منتج مطابق · عرض ${Math.min(items.length,adminProductLimit)}</p>`+adminProductItems().slice(0,adminProductLimit).map(p=>`<div class="pill">${p.catalog_preview?`<img src="${esc(p.image||'/product-illustration/'+p.id+'.svg')}" alt="${esc(p.name)}" loading="lazy" style="width:70px;height:55px;object-fit:cover;border-radius:9px;vertical-align:middle">`:''}${esc(p.name)} ${p.price_pending?'<span class="tag">مسودة · بدون سعر</span>':''} · <select id="merchant-${p.id}">${state.merchants.filter(m=>m.category===p.category).map(m=>`<option value="${m.id}" ${p.merchant_id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input id="price-${p.id}" type="number" min="0" step="0.01" value="${p.price_pending?'':p.price}" placeholder="${p.category==='أدوية'?'سعر العبوة الرسمي':'بدون سعر'}" aria-label="سعر ${esc(p.name)}" style="width:100px"> ج ${p.category==='أدوية'?'<small class="muted">سعر العبوة كما هو؛ التوصيل منفصل</small>':`<button type="button" onclick="addToPrice(${p.id},2)">+٢ ج</button><button type="button" onclick="addToPrice(${p.id},5)">+٥ ج</button>`} · متاح <input id="stock-${p.id}" type="number" min="0" value="${p.stock}" style="width:75px"> <label><input id="active-${p.id}" type="checkbox" ${p.active||p.price_pending?"checked":""} style="width:auto"> إظهار للعميل بعد الحفظ</label><label><input id="rx-${p.id}" type="checkbox" ${p.requires_prescription?"checked":""} style="width:auto"> وصفة</label><button onclick="updateProduct(${p.id})">نشر للعميل</button><button onclick="removeProduct(${p.id})">إخفاء المنتج</button></div>`).join('')+(items.length>adminProductLimit?'<button onclick="adminProductLimit+=40;refreshAdminProductList()">عرض المزيد</button>':'')}
function addToPrice(id,amount){const input=$('price-'+id);if(!input||input.value.trim()===''||!Number.isFinite(Number(input.value)))return alert('اكتب السعر الأساسي الأول');input.value=(Math.round((Number(input.value)+amount)*100)/100).toFixed(2);input.focus()}
function downloadPriceSheet(){if(tab!=='admin'||!state?.products)return;const columns=['رقم المنتج','الاسم','القسم','السعر الحالي جنيه','الكمية','ظاهر','المحل','سعر مرجعي للمراجعة','مصدر المرجع','تاريخ مراجعة السعر'];const rows=state.products.map(p=>[p.id,p.name,p.category,p.price_pending?'':p.price,p.stock,p.active?'نعم':'لا',state.merchants.find(m=>m.id===p.merchant_id)?.name||'', '', '', '']);const csv=[columns,...rows].map(row=>row.map(value=>{let cell=String(value??'');if(/^[\s]*[=+\-@]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='اسعار-منتجات-ولعه.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function renderAdminLegacy(){return `${adminOverview()}${adminDriverWallets()}<div class="admin-menu"><button data-section="admin-map-section" onclick="jumpAdmin(\'admin-map-section\')">الخريطة</button><button data-section="admin-daily" onclick="jumpAdmin(\'admin-daily\')">إحصاءات اليوم</button><button data-section="admin-orders" onclick="jumpAdmin(\'admin-orders\')">الطلبات</button><button data-section="admin-products" onclick="jumpAdmin(\'admin-products\')">المنتجات</button><button data-section="admin-categories" onclick="jumpAdmin(\'admin-categories\')">الأقسام</button><button data-section="admin-merchants" onclick="jumpAdmin(\'admin-merchants\')">المحلات</button><button data-section="admin-drivers" onclick="jumpAdmin(\'admin-drivers\')">الطيارون</button><button data-section="admin-services" onclick="jumpAdmin(\'admin-services\')">الخدمات</button><button data-section="admin-cash" onclick="jumpAdmin(\'admin-cash\')">تحصيل الكاش</button><button data-section="admin-delivery-rate" onclick="jumpAdmin('admin-delivery-rate')">سعر الكيلومتر</button><button data-section="admin-commission" onclick="jumpAdmin('admin-commission')">نسب ولعه</button><button data-section="admin-settings" onclick="jumpAdmin(\'admin-settings\')">الإعدادات</button></div><button onclick="enableNotifications()">تفعيل تنبيهات الطلبات</button><div class="card" id="admin-map-section"><h3>خريطة الطلبات والمندوبين</h3><p class="map-legend">الأزرق موقع المحل، البرتقالي عنوان العميل، والأخضر آخر موقع شاركه المندوب. اضغط على العلامة للتفاصيل.</p><div id="admin-map" class="map"></div></div>${renderAdminStats()}<div class="grid"><div class="card" id="admin-products"><h3>أضف منتجًا</h3><p class="muted">الكتالوج المبدئي موجود في قائمة المنتجات أدناه. لكل منتج: اختر مكان الاستلام، أضف السعر والكمية، ثم فعّل «ظاهر». مستلزمات الصيدلية مبدئية؛ أسماء الأدوية التجارية تُضاف ببياناتها الفعلية.</p><details class="import-panel"><summary>📦 استيراد أسماء منتجات بدون أسعار</summary><p class="muted">كل منتج في سطر. تُحفظ كمسودات مخفية حتى تضيف السعر والكمية وتفعّلها.</p><label>السوبر ماركت</label><select id="import-merchant">${state.merchants.filter(m=>m.active&&m.category==='سوبر ماركت').map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><label>أسماء المنتجات</label><textarea id="import-names" placeholder="اسم المنتج — الحجم\nاسم المنتج التالي"></textarea><button onclick="importProductNames()">استيراد المسودات</button></details><label>الاسم</label><input id="p-name"><label>القسم</label><select id="p-category" onchange="renderProductMerchantChoices()">${options(state.categories.filter(c=>c.active).map(c=>c.name))}</select><label>المحل</label><select id="p-merchant">${state.merchants.filter(m=>m.active).map(m=>`<option value="${m.id}" data-category="${esc(m.category)}">${esc(m.name)} · ${esc(m.area)}</option>`).join('')}</select><label>السعر</label><input id="p-price" type="number" min="0"><label>الكمية</label><input id="p-stock" type="number" min="0"><label>صورة المنتج</label><input id="p-image" type="file" accept="image/png,image/jpeg,image/webp"><label><input id="p-rx" type="checkbox" style="width:auto"> يحتاج وصفة (للأدوية)</label><button onclick="addProduct()">حفظ المنتج</button></div><div class="card" id="admin-drivers"><h3>أضف طيارًا</h3><label>الاسم</label><input id="d-name"><label>الهاتف</label><input id="d-phone"><label>اسم المستخدم (حروف عربية أو إنجليزية)</label><input id="d-username" autocomplete="off"><label>كلمة مرور المندوب (10 أحرف على الأقل)</label><input id="d-password" type="password" autocomplete="new-password"><label>أعد كتابة كلمة المرور</label><input id="d-confirm" type="password" autocomplete="new-password"><label>المركبة</label><select id="d-vehicle"><option>موتوسيكل</option><option>سكوتر</option><option>عجلة</option><option>توك توك</option><option>سيارة</option><option>ميكروباص</option></select><label>المنطقة</label><select id="d-area">${options(state.areas)}</select><button onclick="addDriver()">حفظ المندوب</button></div></div><div class="card" id="admin-merchants"><h3>أماكن المحلات والصيدليات</h3><p class="muted">لو البضاعة كلها عندك، ثبت مكان استلامها مرة واحدة هنا. بعدها السعر والكمية وزر «نشر للعميل» يكفوا لكل منتج.</p><input id="m-name" placeholder="اسم المحل"><select id="m-category">${options(state.categories.filter(c=>c.active).map(c=>c.name))}</select><select id="m-area">${options(state.areas)}</select><input id="m-address" placeholder="عنوان المحل بالتفصيل"><div id="merchant-map" class="map"></div><p id="merchant-point" class="map-legend">اضغط الخريطة لتحديد مكان استلام المنتجات الحقيقي</p><button onclick="setupWarehouse()">تثبيت مخزن ولعه وربط المنتجات</button><p class="muted">${state.settings.warehouse_address?'مكان الاستلام: '+esc(state.settings.warehouse_address):'حدده مرة واحدة قبل نشر أول منتج'}</p><button onclick="createMerchant()">حفظ محل منفصل (اختياري)</button>${state.merchants.map(m=>`<div class="pill">${esc(m.name)} · ${esc(m.category)} · ${esc(m.area)} · ${esc(m.address)} <button onclick="toggleMerchant(${m.id},${m.active?'false':'true'})">${m.active?'إيقاف':'تشغيل'}</button></div>`).join('')}</div><div class="card" id="admin-categories"><h3>أقسام المنتجات</h3><p class="muted">أضف قسمًا أو أخفه بعد إخفاء منتجاته المعروضة.</p><div class="row"><input id="category-name" placeholder="اسم قسم جديد"><button onclick="createCategory()">إضافة قسم</button></div>${state.categories.map(c=>`<div class="row"><span>${esc(c.name)}</span><button onclick="toggleCategory(decodeURIComponent('${encodeURIComponent(c.name)}'),${c.active?'false':'true'})">${c.active?'إخفاء':'إظهار'}</button></div>`).join('')}</div><div class="card" id="admin-commission"><h3>نسب ولعه حسب الخدمة</h3><p class="muted">اكتب نسبة ولعه لكل نوع واضغط حفظ. تُطبّق على الأوردرات الجديدة، وتثبت النسبة عند تسعير الأوردر.</p>${[{key:'products',label:'توصيل المنتجات'},{key:'delivery',label:'توصيل أوردر'},{key:'custom',label:'خدمة أخرى'},...rideVehicles.map(v=>({key:v.key,label:v.label}))].map(v=>`<div class="ride-rate-row"><strong>${esc(v.label)}</strong><label>نسبة ولعه %<input id="commission-rate-${v.key}" type="number" min="0" max="100" step="0.01" value="${esc(state.settings['commission_'+v.key]||'0')}"></label><button onclick="saveCommissionRate('${v.key}')">حفظ النسبة</button></div>`).join('')}</div><div class="card" id="admin-settings"><h3>إعدادات الدفع والتوصيل</h3><label>رقم المحفظة</label><input id="s-wallet" value="${esc(state.settings.wallet)}"><label>رقم واتساب</label><input id="s-whatsapp" value="${esc(state.settings.whatsapp)}"><button onclick="saveSettings()">حفظ الأرقام</button></div><div class="card" id="admin-delivery-rate"><h3>سعر الكيلومتر للتوصيل</h3><label for="s-km-rate">جنيه لكل كيلومتر</label><input id="s-km-rate" type="number" min="0.01" max="10000" step="0.01" value="${esc(state.settings.per_km_rate||'')}" placeholder="حدد سعرك"><p class="muted">للمنتجات وتوصيل الشحنات: مسافة الطريق من الاستلام إلى التسليم × سعر الكيلومتر. السعر يثبت عند تأكيد الطلب. اتركه فارغًا للعودة للتسعير السابق؛ المشاوير والخدمات الأخرى تظل بتسعير الإدارة.</p><button onclick="saveKmRate()">حفظ سعر الكيلومتر</button><p>${state.settings.per_km_rate?'مفعّل: '+money(state.settings.per_km_rate)+' / كم':'غير مفعّل؛ حدد السعر لتشغيله'}</p></div><div class="card" id="admin-ride-rates"><h3>تسعيرة المشاوير حسب المركبة</h3><p class="muted">سعر أول ٣ كم، ثم زيادة لكل كيلومتر إضافي أو جزء منه. اترك السعرين فارغين لتعود المركبة لمراجعة المسؤول.</p>${rideVehicles.map(v=>`<div class="ride-rate-row"><strong>${v.icon} ${v.label}</strong><label>أول ٣ كم<input id="ride-base-${v.key}" type="number" min="0.01" max="10000" step="0.01" value="${esc(state.settings[v.key+'_base']||'')}" placeholder="جنيه"></label><label>كل كم إضافي<input id="ride-extra-${v.key}" type="number" min="0.01" max="10000" step="0.01" value="${esc(state.settings[v.key+'_extra']||'')}" placeholder="جنيه"></label><button onclick="saveRideRate('${v.key}')">حفظ</button></div>`).join('')}</div><div class="grid"><div class="card"><h3>ملخص الطلبات</h3><p>إجمالي الطلبات: ${state.orders.length}</p><p>طلبات جارية: ${state.orders.filter(o=>!['delivered','cancelled'].includes(o.status)).length}</p><p>طلبات مسلمة: ${state.orders.filter(o=>o.status==='delivered').length}</p><p>تحتاج مراجعة: ${state.orders.filter(o=>['new','medicine_review','payment_review','awaiting_quote'].includes(o.status)).length}</p><p>منتجات قاربت على النفاد (5 أو أقل): ${state.products.filter(p=>p.active&&p.stock<=5).length}</p><p>قيمة الطلبات المسلمة: ${money(state.orders.filter(o=>o.status==='delivered').reduce((v,o)=>v+o.total,0))}</p></div><div class="card" id="admin-cash"><h3>تحصيل الكاش</h3><p>في عهدة المندوبين: ${money(state.orders.filter(o=>o.payment==='cash'&&o.cash_collected&&!o.cash_settled).reduce((v,o)=>v+o.total,0))}</p><p>تمت تسويته: ${money(state.orders.filter(o=>o.payment==='cash'&&o.cash_settled).reduce((v,o)=>v+o.total,0))}</p></div></div><div class="card" id="admin-services"><h3>الخدمات</h3><label>خدمة جديدة بتسعير يدوي</label><input id="service-name" placeholder="مثال: توصيل مستندات"><button onclick="createService()">إضافة خدمة</button>${state.services.map(s=>`<div class="row"><span>${esc(s.name)}</span><button onclick="toggleService('${s.key}',${s.active?'false':'true'})">${s.active?'إيقاف مؤقت':'تشغيل'}</button></div>`).join('')}</div><h2 id="admin-orders">الطلبات (${state.orders.length})</h2><div class="catalog-tools"><label>عرض الطلبات<select id="order-filter" onchange="orderFilter=this.value;render()">${options(['الجارية','تحتاج مراجعة','المنتهية','الكل'],orderFilter)}</select></label></div>${state.orders.filter(o=>orderFilter==='الكل'||(orderFilter==='المنتهية'?['delivered','cancelled'].includes(o.status):orderFilter==='تحتاج مراجعة'?['new','medicine_review','payment_review','awaiting_quote'].includes(o.status):!['delivered','cancelled'].includes(o.status))).map(o=>orderCard(o,'admin')).join('')||'<div class="empty">لا توجد طلبات في هذا العرض</div>'}<h2>المنتجات والمندوبون</h2><div class="card"><button type="button" onclick="downloadPriceSheet()">تنزيل كشف أسعار كل المنتجات CSV</button><p class="muted">الكشف فيه السعر والمخزون وحالة النشر لكل منتج. خانات السعر المرجعي ومصدره وتاريخ مراجعته فاضية للتدقيق؛ لا تعتمد على سعر قديم أو منتج بحجم مختلف. <a href="https://www.agriprice.gov.eg/local-prices" target="_blank" rel="noopener">بوابة الأسعار المحلية</a> مرجع للسلع العامة، وسعر الدواء يُنقل من العبوة أو الصيدلية.</p></div>${!state.merchants.some(m=>m.active&&m.category!=='مطاعم')?'<div class="notice">المنتجات مش هتظهر للعميل حاليًا: مفيش محل منتجات نشط. أضف محلًا من قسم «المحلات» وحدد موقعه، ثم اربط المنتجات به واحفظ السعر والكمية وزر الإظهار.</div>':''}<label>ابحث في المنتجات<input aria-label="ابحث في منتجات الإدارة" value="${esc(adminProductQuery)}" oninput="adminProductQuery=this.value;adminProductLimit=40;refreshAdminProductList()" placeholder="اسم المنتج أو القسم"></label><div class="grid"><div class="card" id="admin-product-list">${adminProductRows()}</div><div class="card">${state.drivers.map(d=>`<div class="pill">${esc(d.name)} · ${esc(d.area)} · ${esc(d.phone)} · المستخدم: ${esc(d.username||'رقم الهاتف')} · ${d.available?"متاح":"غير متاح"} <button onclick="resetDriverPassword(${d.id})">إعادة تعيين كلمة المرور</button> <button onclick="driverAvailable(${d.id},${d.available?"false":"true"})">تغيير التوافر</button> ${d.location_at?`· <a href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}#map=16/${d.lat}/${d.lon}" target="_blank" rel="noopener">آخر موقع (${esc(d.location_at)})</a>`:"· الموقع لم يُشارك"}</div>`).join('')||'لم تضف مندوبًا'}</div></div>`}
function renderProductMerchantChoices(){let category=$('p-category').value;for(let o of $('p-merchant').options)o.hidden=o.dataset.category!==category;let first=[...$('p-merchant').options].find(o=>!o.hidden);if(first)$('p-merchant').value=first.value}
async function setupWarehouse(){if(!merchantPoint)return alert('حدد مكان استلام البضاعة الحقيقي على الخريطة');let address=$('m-address').value.trim();if(!address)return alert('اكتب عنوان الاستلام بالتفصيل');try{await api('warehouse/setup',{area:$('m-area').value,address,...merchantPoint});merchantPoint=null;alert('اتحفظ موقع الاستلام واتربطت به المنتجات. أي منتج له سعر وكمية محفوظين هيظهر للعميل؛ والباقي اضغط نشر للعميل بعد كتابة سعره وكميته.')}catch(e){alert(e.message)}}
async function createMerchant(){if(!merchantPoint)return alert('حدد موقع المحل على الخريطة');try{await api('merchant/create',{name:$('m-name').value,category:$('m-category').value,area:$('m-area').value,address:$('m-address').value,...merchantPoint});merchantPoint=null}catch(e){alert(e.message)}}
async function toggleMerchant(id,active){try{await api('merchant/update',{id,active})}catch(e){alert(e.message)}}
async function addProduct(){try{await api('product',{name:$('p-name').value,category:$('p-category').value,price:$('p-price').value,stock:$('p-stock').value,merchant_id:Number($('p-merchant').value),image:await fileData('p-image'),requires_prescription:$('p-rx').checked})}catch(e){alert(e.message)}}
async function saveRideRate(key){let v=rideVehicles.find(v=>v.key===key);if(!v)return;try{await api('ride-rates',{vehicle:v.value,base:$('ride-base-'+key).value,extra:$('ride-extra-'+key).value});alert('تم حفظ تسعيرة '+v.label)}catch(e){alert(e.message)}}
async function saveKmRate(){try{await api('delivery-rate',{per_km_rate:$('s-km-rate').value});alert('تم حفظ سعر الكيلومتر')}catch(e){alert(e.message)}}
async function importProductNames(){try{let r=await api('products/import-names',{merchant_id:$('import-merchant').value,names:$('import-names').value});alert('تم استيراد '+r.imported+' منتج كمسودات بدون أسعار. أضف السعر والمخزون ثم فعّل المنتج.')}catch(e){alert(e.message)}}
async function saveCommissionRate(key){try{await api('commission-rate',{key,percent:$('commission-rate-'+key).value})}catch(e){alert(e.message)}}
async function saveSettings(){try{await api('settings',{wallet:$('s-wallet').value,whatsapp:$('s-whatsapp').value,delivery_fee:state.settings.delivery_fee})}catch(e){alert(e.message)}}
async function saveAreaFee(i){try{await api('area-fee',{area:state.areas[i],fee:$('area-fee-'+i).value})}catch(e){alert(e.message)}}
async function reassign(id){try{await api('order/reassign',{id,driver_id:Number($('assign-'+id).value)})}catch(e){alert(e.message)}}
async function driverAvailable(id,available){try{await api('driver/availability',{id,available})}catch(e){alert(e.message)}}
async function removeProduct(id){if(!confirm('إخفاء المنتج من قائمة العملاء؟ الطلبات السابقة ستبقى محفوظة.'))return;try{await api('product/delete',{id})}catch(e){alert(e.message)}}
async function createCategory(){try{await api('category/create',{name:$('category-name').value})}catch(e){alert(e.message)}}
async function toggleCategory(name,active){try{await api('category/update',{name,active})}catch(e){alert(e.message)}}
async function createService(){try{await api('service/create',{name:$('service-name').value})}catch(e){alert(e.message)}}
async function toggleService(key,active){try{await api('service',{key,active})}catch(e){alert(e.message)}}
async function updateProduct(id){try{const price=$('price-'+id).value.trim(),stock=$('stock-'+id).value.trim(),active=$('active-'+id).checked,merchantId=Number($('merchant-'+id).value)||0;if(!price)throw Error('أضف سعر المنتج أولًا');if(!stock)throw Error('أضف الكمية المتاحة أولًا');if(active&&Number(stock)<=0)throw Error('اكتب كمية أكبر من صفر عشان المنتج يظهر للعميل');if(active&&!merchantId&&!state.settings.warehouse_address)throw Error('ثبت مكان استلام البضاعة مرة واحدة من قسم المحلات');await api('product/update',{id,price,stock,merchant_id:merchantId,active,requires_prescription:$('rx-'+id).checked});const saved=state.products.find(p=>p.id===id),merchant=state.merchants.find(m=>m.id===saved?.merchant_id),category=state.categories.find(c=>c.name===saved?.category);alert(saved?.active&&saved?.stock>0&&merchant?.active&&category?.active?'اتحفظ السعر والمنتج ظاهر للعميل دلوقتي.':'اتحفظ السعر، لكن المنتج مش ظاهر للعميل. راجع زر الإظهار والكمية والمحل والقسم.')}catch(e){alert(e.message)}}
let locationWatch=null,lastLocation=0,locationAccount=null,locationPaused=false,locationAttempted=false,locationStatus='جارٍ تحديد الموقع تلقائيًا…';
function updateLocationStatus(){const el=$('driver-location-status');if(el)el.textContent=locationStatus}
function stopLocation(manual=true){if(locationWatch!==null)navigator.geolocation?.clearWatch(locationWatch);locationWatch=null;if(manual){locationPaused=true;locationStatus='مشاركة الموقع متوقفة باختيارك';updateLocationStatus()}}
function startLocation(){if(!state||tab!=='driver')return;if(!navigator.geolocation){locationStatus='الموقع غير متاح على هذا الجهاز';updateLocationStatus();return}if(locationWatch!==null)return;locationPaused=false;locationAttempted=true;lastLocation=0;locationStatus='جارٍ تحديد الموقع…';updateLocationStatus();const account=state.user.id;locationWatch=navigator.geolocation.watchPosition(async pos=>{if(!state||tab!=='driver'||state.user.id!==account)return;if(Date.now()-lastLocation<15000)return;lastLocation=Date.now();try{await api('location',{lat:pos.coords.latitude,lon:pos.coords.longitude});locationStatus='موقعك يُحدّث تلقائيًا أثناء فتح التطبيق';updateLocationStatus()}catch(e){locationStatus='تعذر إرسال الموقع؛ سنحاول مع التحديث التالي';updateLocationStatus()}},e=>{locationStatus=e.code===1?'اسمح بالموقع من إعدادات الجهاز ثم اضغط إعادة المحاولة':'تعذر تحديد موقعك؛ تأكد من تشغيل GPS';if(e.code===1)stopLocation(false);updateLocationStatus()},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}
function syncDriverAutomation(){if(tab!=='driver'){stopLocation(false);locationAccount=null;locationAttempted=false;return}if(locationAccount!==state.user.id){stopLocation(false);locationAccount=state.user.id;locationPaused=false;locationAttempted=false}if(!locationPaused&&!locationAttempted)startLocation();autoStartOrderSound()}
async function autoStartOrderSound(){if(!state||!['driver','admin'].includes(tab))return;if(localStorage.getItem('wallaha_sound_muted')==='1')return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!driverAudio||driverAudio.state==='closed')driverAudio=new Audio();if(driverAudio.state!=='running')await driverAudio.resume();driverSoundEnabled=driverAudio.state==='running';updateSoundStatus()}catch(e){}}
let notificationAsked=false;
function activateOrderPermissions(){if(state&&['driver','admin'].includes(tab)){autoStartOrderSound();if(!notificationAsked&&'Notification' in window&&Notification.permission==='default'){notificationAsked=true;Notification.requestPermission().catch(()=>{})}}}
document.addEventListener('pointerdown',activateOrderPermissions,{passive:true});document.addEventListener('keydown',activateOrderPermissions);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state&&tab==='driver'){if(!locationPaused){locationAttempted=false;syncDriverAutomation()}refresh()}});
async function addDriver(){try{await api('driver',{name:$('d-name').value,phone:$('d-phone').value,password:$('d-password').value,confirm_password:$('d-confirm').value,username:$('d-username').value,area:$('d-area').value,vehicle_type:$('d-vehicle').value})}catch(e){alert(e.message)}}
let driverView='trips';
function driverAvatar(photo,name){return photo?`<img class="driver-avatar" src="${esc(photo)}" alt="صورة ${esc(name||'الطيار')}">`:`<span class="driver-avatar driver-avatar-fallback">${esc((name||'ط').trim().charAt(0))}</span>`}
async function compressDriverPhoto(file){if(!file.type.startsWith('image/'))throw Error('اختر صورة من المعرض');if(file.size>10_000_000)throw Error('الصورة الأصلية أكبر من 10 ميجابايت');let url=URL.createObjectURL(file);try{let img=new Image();img.src=url;await img.decode();let scale=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let photo=canvas.toDataURL('image/jpeg',0.82);if(photo.length>1_500_000)photo=canvas.toDataURL('image/jpeg',0.6);if(photo.length>1_500_000)throw Error('الصورة كبيرة بعد التصغير؛ اختر صورة أخرى');return photo}finally{URL.revokeObjectURL(url)}}
async function saveDriverPhoto(){let file=$('driver-photo')?.files?.[0];if(!file)return alert('اختر صورة أولًا');try{let photo=await compressDriverPhoto(file);await api('driver/photo',{photo});alert('تم حفظ الصورة')}catch(e){alert(e.message)}}
async function resetDriverPassword(id){if(!confirm('إعادة تعيين كلمة مرور الطيار ستنهي جلساته الحالية. أكمل فقط بعد التحقق من هويته.'))return;try{let r=await api('driver/reset-password',{driver_id:id});alert('كلمة المرور المؤقتة للطيار (تظهر مرة واحدة): '+r.temporary_password+'\nأرسلها له بنفسك ثم اطلب منه تغييرها من الإعدادات.')}catch(e){alert(e.message)}}
function driverWalletView(w){return `<div class="grid"><div class="card"><h3>رصيد مستحقاتي</h3><strong class="price">${money(w.balance)}</strong></div><div class="card"><h3>مستحقات تم صرفها</h3><strong class="price">${money(w.paid)}</strong></div><div class="card"><h3>حصة ولعه المسجلة</h3><strong class="price">${money(w.commission_due||0)}</strong><p class="muted">تحسب من أجرة التوصيل عند إكمال الطلب</p></div><div class="card"><h3>كاش مطلوب توريده للإدارة</h3><strong class="price">${money(w.cash_due)}</strong><p class="muted">تحصيلات العملاء في عهدتك</p></div></div><p class="muted">المحفظة سجل للمستحقات والتسويات. يحدد المسؤول أجر كل مشوار ويثبت صرفه؛ لا يتم تحويل أموال من التطبيق.</p>${w.entries.map(o=>`<div class="card"><strong>مشوار #${o.id}</strong> · ${esc(o.created_at)}<p>سعر المشوار: ${money(o.total)} · حق ولعه (${o.commission_percent}%): ${money(o.commission_cents/100)} · صافي مستحقاتي: ${money(o.driver_earning_cents/100)} · ${o.driver_earning_paid?'تم الصرف':o.driver_earning_cents?'بانتظار الصرف':'بانتظار تحديد الأجر'}</p>${o.payment==='cash'?`<p>تحصيل العميل: ${money(o.total)} · ${o.cash_settled?'تم التوريد':'في عهدتي'}</p>`:''}</div>`).join('')||'<div class="empty">تظهر الحركات بعد إنهاء أول مشوار</div>'}`}
function driverSettingsPage(p){return `<div class="driver-settings-page"><a class="route-link" href="/driver">→ رجوع للمشاوير</a><div class="card"><h2>⚙ إعدادات الطيار</h2><h3>ملفي الشخصي</h3><div class="driver-identity">${driverAvatar(p.photo,p.name)}<div><strong>${esc(p.name||state.user.name)}</strong><p>📞 ${esc(p.phone||state.user.phone)}</p><p>${esc(p.vehicle_type||'')} · ${esc(p.area||'')}</p></div></div><label>صورتي الشخصية (حتى 10 ميجابايت؛ يتم تصغيرها تلقائيًا)<input id="driver-photo" type="file" accept="image/png,image/jpeg,image/webp"></label><button onclick="saveDriverPhoto()">حفظ الصورة</button></div><div class="card"><h3>كلمة المرور</h3>${accountPanel()}${emailRecoveryPanel()}<button class="driver-settings-logout" onclick="logout()">تسجيل الخروج</button></div></div>`}
function renderDriver(){let p=state.driver_profile||{},w=state.driver_wallet||{balance:0,paid:0,cash_due:0,entries:[]};if(location.pathname==='/driver/settings')return driverSettingsPage(p);return `<div class="card driver-home-head"><h2>أهلًا ${esc(state.user.name)}</h2><p>حساب الطيار · ${esc(state.user.username||state.user.phone)}</p><p>${esc(p.vehicle_type||'')} · ${esc(p.area||'')} · ${p.available?'متاح للعمل':'غير متاح حاليًا'}</p></div>${driverBreakPanel(p)}${driverSoundPanel()}<nav class="driver-nav"><button class="${driverView==='trips'?'on':''}" aria-pressed="${driverView==='trips'}" onclick="driverView='trips';render()">المشاوير الحالية</button><button class="${driverView==='wallet'?'on':''}" aria-pressed="${driverView==='wallet'}" onclick="driverView='wallet';render()">محفظتي · ${money(w.balance)}</button><button class="${driverView==='history'?'on':''}" aria-pressed="${driverView==='history'}" onclick="driverView='history';render()">سجل المشاوير</button></nav>${driverView==='wallet'?driverWalletView(w):driverView==='history'?state.orders.filter(o=>['delivered','cancelled'].includes(o.status)).map(o=>orderCard(o,'driver')).join('')||'<div class="empty">لم تنتهِ مشاوير بعد</div>':renderDriverOld()}`}
function adminDriverWallets(){return `<section class="card"><h3>محافظ الطيارين</h3>${state.drivers.map(d=>{let w=state.driver_wallets?.[d.id]||{balance:0,paid:0,cash_due:0,entries:[]};return `<details class="card"><summary>${esc(d.name)} · مستحق ${money(w.balance)} · تم صرف ${money(w.paid)} · مديونية ولعه ${money(w.commission_due||0)} · عهدة الكاش ${money(w.cash_due)}</summary>${w.entries.map(o=>`<div class="pill">طلب #${o.id} · حق ولعه ${money(o.commission_cents/100)} (${o.commission_percent}%) · ${o.driver_earning_paid?'تم صرف '+money(o.driver_earning_cents/100):`<label>أجر الطيار بالجنيه</label><input type="number" min="0" max="100000" step="0.01" id="earning-${o.id}" value="${o.driver_earning_cents/100}"><button onclick="setDriverEarning(${o.id},false)">حفظ الأجر</button>${o.driver_earning_cents?`<button onclick="setDriverEarning(${o.id},true)">تسجيل صرف المستحق</button>`:''}`}</div>`).join('')||'<p>لا توجد مشاوير منتهية</p>'}</details>`}).join('')||'<p>أضف حساب الطيار أولًا</p>'}</section>`}
async function setDriverEarning(id,paid){if(paid&&!confirm('هل صرفت هذا المستحق للطيار بالفعل؟ هذا الزر يسجل الصرف فقط.'))return;try{await api('driver/earning',paid?{id,paid:true}:{id,amount:$('earning-'+id).value})}catch(e){alert(e.message)}}
function renderDriverOld(){let active=state.orders.filter(o=>!['cancelled','delivered'].includes(o.status));let chosen=state.orders.find(o=>o.id===selectedTripId)||active.find(o=>['assigned','ready','picked_up','on_way'].includes(o.status));return `<h2>طلبات المندوب ${esc(state.user.name)}</h2>${tripDetails(chosen,'driver')}<details class="card"><summary>الموقع والتنبيهات التلقائية</summary><p id="driver-location-status" aria-live="polite">${esc(locationStatus)}</p><button onclick="enableNotifications()">تفعيل تنبيهات الإسناد</button><button onclick="startLocation()">إعادة محاولة تحديد الموقع</button><button onclick="stopLocation()">إيقاف المشاركة</button><p class="muted">الموقع يبدأ تلقائيًا بعد الدخول وموافقة الجهاز، ويتوقف عند تسجيل الخروج. يمكنك إيقاف المشاركة هنا.</p></details>${state.orders.filter(o=>!['cancelled','delivered'].includes(o.status)&&o.id!==chosen?.id).map(o=>orderCard(o,'driver')).join('')||(!chosen?'<div class="empty">لا توجد طلبات مسندة إليك الآن</div>':'')}`}
function loginViewLegacy(){if(location.pathname==='/admin')return `<div class="card" style="max-width:460px;margin:auto"><h2>دخول المسؤول</h2><p class="muted">لوحة التحكم خاصة بصاحب تطبيق ولعه فقط.</p><label>اسم المستخدم</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password" autocomplete="current-password"><button onclick="login()">دخول لوحة التحكم</button></div>`;if(location.pathname.startsWith('/driver'))return `<div class="card" style="max-width:460px;margin:auto"><h2>دخول تطبيق الطيار</h2><p>حسابك الخاص في ولعه، مشاويرك ومحفظتك.</p><label>اسم المستخدم أو رقم الهاتف</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password" autocomplete="current-password"><button onclick="login()">دخول حسابي</button><button class="secondary" onclick="alert('لو نسيت كلمة المرور، تواصل مع مسؤول ولعه للتحقق من هويتك وإعطائك كلمة مرور مؤقتة. بعد الدخول غيّرها من الإعدادات.')">نسيت كلمة المرور؟</button><p class="muted">المسؤول ينشئ حسابك باسمك من لوحة التحكم.</p></div>`;return `<div class="card" style="background:#ecf8ef;text-align:center"><h2>شوف تطبيق ولعه من جوه</h2><p class="muted">تصفح الأقسام والمحلات والمنتجات من غير حساب. تسجيل الدخول مطلوب وقت إرسال الطلب فقط.</p><button onclick="browsePreview()">تصفح التطبيق بدون تسجيل</button></div><div class="grid"><div class="card"><h2>دخول ولعه</h2><label>اسم المستخدم أو رقم الهاتف</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password"><button onclick="login()">دخول</button><p class="muted">للمسؤول والمندوب والعميل</p></div><div class="card"><h2>حساب عميل جديد</h2><label>الاسم</label><input id="reg-name"><label>رقم الهاتف</label><input id="reg-phone" inputmode="tel"><label>كلمة مرور (10 أحرف على الأقل)</label><input id="reg-pass" type="password"><button onclick="register()">إنشاء حساب</button></div></div>`}
async function browsePreview(silent=false){try{let r=await fetch('/api/catalog');if(!r.ok)throw Error('تعذر تحميل الأقسام');let catalog=await r.json();previewMode=true;state={...catalog,user:{name:'زائر',phone:''},orders:[],settings:{wallet:''}};tab='customer';acceptSharedRideDestination();render()}catch(e){previewMode=false;state=null;render();if(!silent)alert(e.message)}}
function leavePreview(){previewMode=false;state=null;render()}
async function login(){try{let v=await api(location.pathname==='/admin'?'admin/login':'login',{phone:$('login-phone').value,password:$('login-pass').value});token=v.token;previewMode=false;localStorage.setItem('wallaha_token',token);await refresh()}catch(e){alert(e.message)}}
async function registerLegacy(){try{await api('register',{name:$('reg-name').value,phone:$('reg-phone').value,password:$('reg-pass').value});alert('تم إنشاء الحساب. سجل الدخول الآن.')}catch(e){alert(e.message)}}
async function logout(){if(previewMode)return leavePreview();try{await api('logout',{})}catch(e){}stopLocation(false);locationAccount=null;locationAttempted=false;token='';localStorage.removeItem('wallaha_token');state=null;chatDrafts.clear();chatCache.clear();checkoutDraft={};checkoutFiles={};rememberedAccount='';chosenPoint=null;chosenPickup=null;merchantPoint=null;trackingOrderId=null;render();checkoutDraft={};checkoutFiles={}}
async function changePassword(){let old=$('current-pass').value, next=$('new-pass').value;if(!old||next.length<10){alert('اكتب كلمة المرور الحالية وجديدة من 10 أحرف على الأقل');return}try{await api('change-password',{current_password:old,new_password:next});alert('تم تغيير كلمة المرور وإغلاق الجلسات الأخرى')}catch(e){alert(e.message)}}
function accountPanel(){return `<details class="card"><summary>إعدادات حسابي</summary><label>كلمة المرور الحالية</label><input id="current-pass" type="password" autocomplete="current-password"><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="new-pass" type="password" autocomplete="new-password"><button onclick="changePassword()">تغيير كلمة المرور</button></details>`}
function render(){if(!state){stopLocation(false);locationAccount=null;locationAttempted=false}document.body.classList.toggle('driver-screen',!!state&&tab==='driver'&&location.pathname==='/driver');$('driver-settings-top').style.display=state&&tab==='driver'&&location.pathname==='/driver'?'grid':'none';saveChatDrafts();saveCheckoutDraft();clearMaps();$('logout').style.display=state&&tab!=='driver'?'block':'none';$('logout').textContent=previewMode?'دخول':'تسجيل الخروج';$('reload').style.display=state&&!previewMode?'block':'none';$('app').innerHTML=(offline?'<div class="notice">الاتصال غير متاح الآن. الطلبات تحتاج اتصالًا بالإنترنت. اضغط تحديث الطلبات عند عودته.</div>':'')+(!state?loginView():(tab==='customer'?renderCustomer():tab==='admin'?renderAdmin():renderDriver())+(previewMode||tab==='customer'||tab==='driver'?'':accountPanel()));restoreCheckoutDraft();initMaps();if(state&&tab==='admin')renderProductMerchantChoices();pollOrderChat();paintSupport()}
let lastCatalogRefresh=Date.now();
async function refreshCustomerPrices(){if(!state||tab!=='customer'||document.visibilityState!=='visible'||!['home','store','product'].includes(customerView)||document.activeElement?.matches('input,textarea,select'))return;lastCatalogRefresh=Date.now();if(previewMode)await browsePreview(true);else await refresh()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshCustomerPrices()});
window.addEventListener('focus',()=>{if(Date.now()-lastCatalogRefresh>5000)refreshCustomerPrices()});
setInterval(()=>{if(Date.now()-lastCatalogRefresh>30000)refreshCustomerPrices()},30000);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').style.display='block'});document.getElementById("manifest").href="/manifest/"+(["driver","admin"].includes(location.pathname.slice(1))?location.pathname.slice(1):"customer")+".json";if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});refresh();setInterval(pollOrderChat,5000);setInterval(()=>{if(state&&tab==='driver'&&document.visibilityState==='visible'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))refresh()},5000);setInterval(()=>{if(state&&(tab==='admin'||(tab==='customer'&&trackingOrderId))&&document.visibilityState==='visible'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))refresh()},15000);</script><script>loadFeatureConfig()</script></body></html>
