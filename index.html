function customerHome(){
 const customServices=state.services.filter(x=>x.key.startsWith('custom_')&&x.active),inCategory=categoryFilter!=='الكل';
 return `<div class="customer-home"><div class="home-masthead">${customerTop()}<div class="home-search-actions"><div class="customer-search"><span aria-hidden="true">⌕</span><input aria-label="ابحث عن محل" placeholder="${inCategory?'دور على محل في القسم':'دور على محل'}" value="${esc(homeQuery)}" oninput="homeQuery=this.value;renderHomeBrowseResults()"></div><button type="button" class="home-delivery-action" onclick="startService('delivery')" aria-label="توصيل أغراض"><span aria-hidden="true">${customerIcon('box')}</span><strong>توصيل أغراض</strong></button></div></div>${inCategory?`<button class="customer-back" onclick="returnCustomerHome()">→ رجوع للأقسام</button><div class="home-delivery-category-row">${deliveryCategoryTile()}</div>`:`<div class="section-heading home-section-title"><h2>الأقسام</h2></div><div class="category-grid">${categoryTiles()}</div>${rideTiles()}${customServices.length?`<section class="home-extra-services"><div class="section-heading"><h2>خدمات إضافية</h2></div><div class="quick-services">${customServices.map(x=>`<button onclick="startService('custom','${x.key}')"><strong>${esc(x.name)}</strong></button>`).join('')}</div></section>`:''}`}<div id="home-browse-results">${homeBrowseResults()}</div></div>`
}
function productCardControls(p){if(supportsBudgetQuantity(p)){let q=Number(cart[p.id]||0),amount=Number(cartBudgets[p.id]||0),weightRow=amount?'<div class="quantity"><strong>مضاف للسلة بالمبلغ '+money(amount)+'</strong><button class="secondary" onclick="goCustomer(\'checkout\')">تعديل من السلة</button></div>':q?'<div class="quantity"><button aria-label="قلل '+esc(p.name)+'" onclick="changeCart('+p.id+',-1)">−</button><strong>'+weightLabel(p,q)+'</strong><button aria-label="زود '+esc(p.name)+'" onclick="changeCart('+p.id+',1)">+</button></div>':'<div class="quantity"><button class="add" onclick="changeCart('+p.id+',1)">أضف الوزن للسلة</button></div>';return '<div class="dual-purchase-options"><section class="weight-purchase-option"><h4>اختار بالوزن</h4>'+weightSelect(p)+weightRow+'</section><section class="amount-purchase-option"><h4>أو حدد بالمبلغ</h4>'+budgetPicker(p)+'</section></div>'}return `${weightPicker(p)}<div class="quantity">${cart[p.id]?Number(cartBudgets[p.id])>0?`<strong>طلبك بـ ${money(cartBudgets[p.id])}</strong><button class="secondary" onclick="goCustomer('checkout')">تعديل</button>`:`<button aria-label="قلل ${esc(p.name)}" onclick="changeCart(${p.id},-1)">−</button><strong>${weightLabel(p,cart[p.id])}</strong><button aria-label="زود ${esc(p.name)}" onclick="changeCart(${p.id},1)">+</button>`:`<button class="add" onclick="changeCart(${p.id},1)">+ أضف للسلة</button>`}</div>`}
function productCards(){let items=catalogItems(),visible=items.slice(0,storeProductLimit),cards=visible.map(p=>{let amountOnly=supportsBudgetQuantity(p),name=amountOnly?budgetDisplayName(p):p.name;return `<article class="product-card"><div class="product-picture">${p.image||p.catalog_preview?`<img loading="lazy" decoding="async" src="${p.image||'/product-illustration/'+p.id+'.svg'}" alt="${esc(name)}">`:categoryLooks[p.category]?.[0]||'📦'}</div><small class="muted">${esc(p.category)} · متاح ${p.stock}${p.requires_prescription?' · يحتاج وصفة':''}</small><h3>${esc(name)}</h3><p class="price">${amountOnly?'سعر الكيلو ':''}${money(productPrice(p))}${soldByWeight(p)&&!amountOnly?' / كيلو':''}</p>${productCardControls(p)}</article>`}).join('');if(!cards)return '<div class="customer-empty">مافيش منتجات معروضة في المحل دلوقتي. جرّب محل تاني أو خدمة توصيل أي غرض.</div>';return cards+(items.length>storeProductLimit?`<button type="button" class="secondary" onclick="storeProductLimit+=48;renderStoreProducts()">عرض ٤٨ منتج كمان (${items.length-storeProductLimit} متبقي)</button>`:'')}
function renderStoreProducts(){let box=$('store-products');if(box)box.innerHTML=productCards()}
function cartDock(){return cartCount()?`<div class="cart-dock"><span><strong>${cartCount()} منتج</strong><br>${money(cartSubtotal())} قبل التوصيل</span><button onclick="goCustomer('checkout')">عرض السلة ←</button></div>`:''}
function prescriptionEntry(){return `<div class="card shift-card"><h2>اطلب أدويتك بالروشتة</h2><p>ارفع الروشتة من غير اختيار منتجات. نراجع الطلب ونبلغك بالإجمالي قبل التنفيذ، والطيار يشتري الأدوية من الصيدلية.</p><button onclick="startPrescription()">＋ إضافة الروشتة</button></div>`}
async function startPrescription(){if(cartCount()&&!(await window.appConfirm('طلب الروشتة مستقل وهيفرّغ السلة الحالية. تكمل؟',{title:'طلب روشتة جديد',confirmText:'نعم، أكمل'})))return;cart={};cartBudgets={};checkoutDraft={};checkoutFiles={};prescriptionOnly=true;shopAnywhere=false;catalogOrder=false;kind='products';merchantId=state.merchants.find(m=>m.active&&m.category==='أدوية')?.id||0;goCustomer('checkout')}
function customerStore(){let m=state.merchants.find(x=>x.id===merchantId&&x.active);if(!m)return customerHome();let look=categoryLooks[m.category]||['🛍️','#e9f2f2'];return `<button class="customer-back" onclick="returnCustomerHome(decodeURIComponent('${encodeURIComponent(m.category)}'))">→ رجوع للمحلات</button><div class="store-heading"><span class="merchant-art" style="--tile-bg:${look[1]}">${m.image?`<img loading="lazy" decoding="async" src="${esc(m.image)}" alt="${esc(m.name)}" style="width:100%;height:100%;object-fit:contain;border-radius:inherit">`:look[0]}</span><div><h2>${esc(m.name)}</h2><p>${esc(m.category)} · ${esc(m.area)} · ${esc(m.address)}</p></div></div><div class="customer-search"><span>⌕</span><input aria-label="ابحث في منتجات المحل" placeholder="دور على منتج في المحل" value="${esc(productSearch)}" oninput="productSearch=this.value;storeProductLimit=48;renderStoreProducts()"></div><div class="section-heading"><h2>منتجات المحل</h2></div><div class="product-grid" id="store-products">${productCards()}</div>${m.category==='أدوية'?prescriptionEntry():''}${cartDock()}`}

function basketProductRow(p,q){if(!p)return '';let weighted=soldByWeight(p),max=Number(p.stock)*(weighted?weightBasis(p):1),budget=Number(cartBudgets[p.id]||0);return `<article class="basket-product"><img src="${esc(p.image||'/product-illustration/'+p.id+'.svg')}" alt="" loading="lazy"><div class="basket-product-info"><strong>${esc(budget?budgetDisplayName(p):p.name)}</strong>${budget?`<div class="budget-cart-row"><label for="basket-budget-${p.id}">المبلغ المطلوب</label><div><input id="basket-budget-${p.id}" type="number" min="1" step="1" value="${budget}" onchange="setBudgetCartAmount(${p.id},Number(this.value))"><b>جنيه</b></div></div>`:`<small>السعر ${money(productPrice(p))}${weighted?' / كيلو':' / قطعة'}</small><div class="basket-quantity"><button type="button" aria-label="تقليل كمية ${esc(p.name)}" onclick="setBasketQuantity(${p.id},${q}-${weighted?weightIncrement(p):1})">−</button><input aria-label="كمية ${esc(p.name)}" type="number" min="${weighted?weightIncrement(p):1}" step="${weighted?weightIncrement(p):1}" max="${max}" value="${q}" onchange="setBasketQuantity(${p.id},Number(this.value))"><span>${weighted?'كجم':'قطعة'}</span><button type="button" aria-label="زيادة كمية ${esc(p.name)}" onclick="setBasketQuantity(${p.id},${q}+${weighted?weightIncrement(p):1})">+</button></div>`}<button type="button" class="secondary" onclick="setBasketQuantity(${p.id},0)">حذف من السلة</button></div><strong>${money(budget||productPrice(p)*q)}</strong></article>`}
function setBudgetCartAmount(id,amount){let p=state.products.find(x=>x.id===id),unitPrice=p?productPrice(p):0,max=p?Number(p.stock)*weightBasis(p):0,qty=unitPrice>0?amount/unitPrice:0;if(!p||!Number.isFinite(amount)||amount<=0||qty>max){alert('اكتب مبلغًا صحيحًا ضمن الكمية المتاحة');render();return}saveCheckoutDraft();cartBudgets[id]=amount;cart[id]=qty;render()}
function setBasketQuantity(id,quantity){let p=state.products.find(x=>x.id===id);if(!p)return;let weighted=soldByWeight(p),max=Number(p.stock)*(weighted?weightBasis(p):1);if(!Number.isFinite(quantity)||quantity<0||quantity>max||!validProductQuantity(p,quantity)){alert('اختر كمية صحيحة ضمن المتاح');render();return}saveCheckoutDraft();if(quantity===0){delete cart[id];delete cartBudgets[id]}else{cart[id]=quantity;delete cartBudgets[id]}render()}

function deliveryWizardBar(){const steps=[['الاستلام','من المرسل'],['التسليم','إلى المستلم'],['التأكيد','البيانات والدفع']];return `<ol class="delivery-stepper" aria-label="خطوات توصيل الأغراض">${steps.map(([title,sub],i)=>{const n=i+1,complete=n<deliveryStep;return `<li><button type="button" class="${complete?'is-complete':''}" ${n===deliveryStep?'aria-current="step"':''} ${n>deliveryStep?'disabled':''} onclick="goDeliveryStep(${n})"><span class="delivery-step-number">${complete?'✓':String(n).padStart(2,'0')}</span><span class="delivery-step-title">${title}<small>${sub}</small></span></button></li>`}).join('')}</ol>`}
function goDeliveryStep(next){saveCheckoutDraft();if(next>deliveryStep){if(deliveryStep===1&&(!chosenPickup||!String($('pickup')?.value||checkoutDraft.pickup||'').trim())){appNotify('حدد موقع الاستلام واكتب علامة واضحة للمكان قبل المتابعة.',{tone:'error'});return}if(deliveryStep===2&&(!chosenPoint||!String($('address')?.value||checkoutDraft.address||'').trim())){appNotify('حدد موقع التسليم على الخريطة قبل المتابعة.',{tone:'error'});return}}if(next<1||next>3||next>deliveryStep+1)return;deliveryStep=next;render();window.scrollTo({top:0,behavior:'smooth'})}
function submitDeliveryOrder(){saveCheckoutDraft();if(!String($('recipient-phone')?.value||checkoutDraft['recipient-phone']||'').trim()){appNotify('اكتب رقم تليفون المستلم عشان الطيار يقدر يتواصل معاه.',{tone:'error'});return}placeOrder()}
function deliveryWizardSummary(){const pickup=checkoutDraft.pickup||'موقع الاستلام المحدد على الخريطة',destination=checkoutDraft.address||'موقع التسليم المحدد على الخريطة';return `<div class="delivery-route-summary"><article><span>📍</span><div><strong>الاستلام من</strong><p>${esc(pickup)}</p><button type="button" class="delivery-change-link" onclick="goDeliveryStep(1)">تعديل المكان</button></div></article><article><span>🎯</span><div><strong>التسليم إلى</strong><p>${esc(destination)}</p><button type="button" class="delivery-change-link" onclick="goDeliveryStep(2)">تعديل المكان</button></div></article></div>`}
function customerDeliveryWizard(){if(!shipmentType)return shipmentPicker();const stages=[{title:'حدد مكان الاستلام',note:'هنستلم الشحنة من هنا.'},{title:'حدد مكان التسليم',note:'اختار نقطة وصول المندوب للمستلم.'},{title:'بيانات المستلم والدفع',note:'راجع الرحلة واكتب بيانات التواصل.'}];let content='';if(deliveryStep===1){content=`<div class="delivery-shipment-chip">📦 ${esc(shipmentType)} <button type="button" class="delivery-change-link" onclick="saveCheckoutDraft();shipmentType='';deliveryStep=1;render()">تغيير النوع</button></div><h3 class="delivery-stage-caption"><span>📍</span> مكان استلام الشحنة</h3><p class="delivery-stage-note">اختار مكان المرسل على الخريطة، واكتب علامة قريبة تساعد الطيار.</p>${pickupFields()}<div class="delivery-wizard-actions"><button type="button" class="delivery-next" onclick="goDeliveryStep(2)">التالي: مكان التسليم</button></div>`}else if(deliveryStep===2){content=`<h3 class="delivery-stage-caption"><span>🎯</span> مكان تسليم الشحنة</h3><p class="delivery-stage-note">حدد موقع المستلم على الخريطة، واكتب أقرب علامة مميزة.</p>${fields()}<div class="delivery-wizard-actions"><button type="button" class="delivery-back" onclick="goDeliveryStep(1)">رجوع للاستلام</button><button type="button" class="delivery-next" onclick="goDeliveryStep(3)">التالي: بيانات المستلم</button></div>`}else{content=`<input id="customer" type="hidden" value="${esc(state.user.name)}"><input id="phone" type="hidden" value="${esc(state.user.phone)}"><input id="pickup" type="hidden" value="${esc(checkoutDraft.pickup||'')}"><input id="address" type="hidden" value="${esc(checkoutDraft.address||'')}"><input id="area" type="hidden" value="${esc(state.areas[0]||'')}"><h3 class="delivery-stage-caption"><span>🧾</span> راجع تفاصيل المشوار</h3>${deliveryWizardSummary()}${shipmentType==='أخرى'?'<label for="shipment-other">وصف الشحنة</label><input id="shipment-other" placeholder="اكتب نوع الغرض الذي سترسله">':''}<section id="delivery-recipient" class="delivery-recipient"><h3>بيانات المستلم للتواصل</h3><label for="recipient-name">اسم المستلم</label><input id="recipient-name" autocomplete="off" placeholder="اسم الشخص اللي هيستلم"><label for="recipient-phone">رقم تليفون المستلم</label><input id="recipient-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="مثلاً 01xxxxxxxxx" required><p class="map-legend">الطيار هيستخدم الرقم ده للتواصل وقت التسليم.</p></section><details class="delivery-sender-details"><summary>بيانات المرسل · من حسابك</summary><label for="sender-name">اسم المرسل</label><input id="sender-name" autocomplete="off"><label for="sender-phone">رقم تليفون المرسل</label><input id="sender-phone" type="tel" inputmode="tel"></details><label for="details">معلومة تساعد الطيار (اختياري)</label><textarea id="details" rows="2" maxlength="500" placeholder="مثلاً: الغرض في كيس أزرق"></textarea>${deliveryPricingPanel()}${pay()}<p class="muted">تابع حالة شحنتك من شاشة «طلباتك».</p><div class="delivery-wizard-actions"><button type="button" class="delivery-back" onclick="goDeliveryStep(2)">رجوع لموقع التسليم</button><button type="button" class="delivery-submit" onclick="submitDeliveryOrder()">تأكيد وإرسال الطلب</button></div>`}return `<button class="customer-back" onclick="backCustomer()">→ رجوع</button><section class="delivery-wizard"><header class="delivery-wizard-head"><span class="delivery-wizard-icon" aria-hidden="true">📦</span><div><h2>توصيل أغراض</h2><p>${stages[deliveryStep-1].note}</p></div></header>${deliveryWizardBar()}<section class="delivery-wizard-panel" aria-label="الخطوة ${deliveryStep} من 3"><h2 class="sr-only">${stages[deliveryStep-1].title}</h2>${content}</section></section>`}
function customerCheckout(){if(kind==='delivery')return customerDeliveryWizard();if(kind==='products'&&!prescriptionOnly&&!cartCount())return `<button class="customer-back" onclick="returnCustomerHome()">→ رجوع للمحلات</button><div class="customer-empty">السلة فاضية. اختار محل ومنتجات الأول.</div>`;let merchant=state.merchants.find(m=>m.id===merchantId);let fee=Number(state.area_fees?.[state.areas[0]]||0);return `<button class="customer-back" onclick="backCustomer()">→ رجوع</button><h2>${prescriptionOnly?'طلب أدوية بالروشتة':kind==='products'?'السلة وتأكيد الطلب':kind==='ride'?'تفاصيل المشوار':kind==='delivery'?'توصيل أي غرض':esc(state.services.find(s=>s.key===serviceKey)?.name||'خدمة جديدة')}</h2><div class="checkout-steps"><span>١. الاختيار</span><span class="active">٢. العنوان والدفع</span><span>٣. المتابعة</span></div>${kind==='delivery'?'<nav class="delivery-quick-nav" aria-label="التنقل في طلب التوصيل"><button type="button" onclick="document.getElementById(\'delivery-pickup\')?.scrollIntoView({behavior:\'smooth\',block:\'center\'})">📍 الاستلام</button><button type="button" onclick="document.getElementById(\'delivery-destination\')?.scrollIntoView({behavior:\'smooth\',block:\'center\'})">🎯 التسليم</button><button type="button" onclick="document.getElementById(\'delivery-recipient\')?.scrollIntoView({behavior:\'smooth\',block:\'center\'})">👤 المستلم</button><button type="button" onclick="document.getElementById(\'payment\')?.scrollIntoView({behavior:\'smooth\',block:\'center\'})">💳 الدفع</button></nav>':''}${prescriptionOnly?`<div class="card"><h3>شراء الأدوية بالروشتة</h3><p>الإجمالي يظهر لك بعد مراجعة الروشتة، ولا يبدأ التنفيذ إلا بعد موافقتك.</p><label>الصيدلية</label><select onchange="merchantId=Number(this.value)">${state.merchants.filter(m=>m.active&&m.category==='أدوية').map(m=>`<option value="${m.id}" ${m.id===merchantId?'selected':''}>${esc(m.name)} · ${esc(m.area)}</option>`).join('')}</select>${merchantId?'':'<p>لا توجد صيدلية متاحة حاليًا. تواصل مع الدعم من الإعدادات.</p>'}</div>`:kind==='products'?`<div class="card"><h3>سلة مشترياتك · ${cartCount()} منتج</h3><p>${catalogOrder?'طلب من كتالوج ولعه':'من '+esc(merchant?.name||'المحل')}</p>${catalogOrder?'<p class="muted">الطيار يشتري الأصناف من المكان المناسب. طلبات الأدوية تحتاج روشتة ومراجعة الإدارة.</p>':''}${Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>{let p=state.products.find(x=>x.id==id);return basketProductRow(p,q)}).join('')}<div class="checkout-total"><span>المنتجات</span><span>${money(cartSubtotal())}</span></div><div class="checkout-total"><span>رسوم التوصيل <small class="muted"></small></span><span id="fee-amount">${kmPricing()?'يظهر بعد تحديد العنوان':money(fee)}</span></div><div class="checkout-total"><span>الإجمالي</span><span id="fee-total">${checkoutPriceMarkup()}</span></div></div>`:`<div class="card"><p class="muted">${kmPricing()?'يظهر السعر النهائي قبل تأكيد الطلب.':'راجع تفاصيل المشوار قبل الإرسال.'}</p></div>`}<div class="card">${kind==='delivery'?`<div class="pill">نوع الشحنة: <strong>${esc(shipmentType)}</strong> <button onclick="saveCheckoutDraft();shipmentType='';render()">تغيير</button></div>${shipmentType==='أخرى'?'<label>وصف نوع الشحنة</label><input id="shipment-other" placeholder="ما الذي تريد توصيله؟">':''}` :''}${kind==='products'&&merchant?.category==='سوبر ماركت'?`<label class="pill"><input type="checkbox" style="width:auto" ${shopAnywhere?'checked':''} onchange="shopAnywhere=this.checked;updateFeePreview()"> اشتري من أي سوبر ماركت قريب بدل مكان الاستلام المحدد</label><p class="muted">الطيار يختار المتجر المناسب ويؤكد الأصناف بنفس الأسعار المعروضة. رسوم التوصيل حسب المنطقة.</p>`:''}${kind!=='products'?pickupFields():''}${fields()}${deliveryPricingPanel()}${kind==='delivery'?`<section id="delivery-recipient" class="delivery-recipient"><h3>٣ · بيانات المستلم للتواصل</h3><label>اسم المستلم</label><input id="recipient-name" autocomplete="off"><label for="recipient-phone">رقم تليفون المستلم (للمندوب يتصل بيه)</label><input id="recipient-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="مثلاً 01xxxxxxxxx" required><p class="map-legend">الرقم ده هيظهر للمندوب في تفاصيل الطلب بزر اتصال.</p></section>`:''}${kind!=='products'?`<div>${kind==='delivery'?'<details><summary>بيانات المرسل · من حسابك (اضغط للتعديل)</summary><label>اسم المرسل</label><input id="sender-name" autocomplete="off"><label>رقم تليفون المرسل</label><input id="sender-phone" type="tel" inputmode="tel"></details>':''}${kind!=='delivery'?'<label for="destination">وصف الوجهة أو علامة مميزة</label><input id="destination" placeholder="مثلاً شارع النيل، بجانب المدرسة">':''}${kind==='ride'?'<label>المركبة</label><select id="vehicle" onchange="checkoutDraft.vehicle=this.value;deliveryQuote=null;render()">'+vehicleOptions()+'</select>':''}</div>`:''}${kind==='products'&&cartNeedsPrescription()?'<label>صورة الروشتة الطبية (إلزامية لطلبات الأدوية)</label><input id="prescription" type="file" accept="image/png,image/jpeg,image/webp">':''}${pay()}<p class="muted">${kind==='products'&&cartHasMedicine()?'طلب الأدوية ينتظر مراجعة الإدارة قبل الإسناد.':'تابع حالة طلبك من شاشة طلباتي.'}</p>${previewMode?'<button class="checkout-submit" onclick="leavePreview()">سجل الدخول لإرسال الطلب</button>':'<button class="checkout-submit" onclick="placeOrder()">تأكيد وإرسال الطلب</button>'}</div>`}
function customerOrderDiscountCents(o){const saved=Math.max(0,Math.round(Number(o?.discount_cents||0)));if(saved)return saved;for(const e of [...(o?.events||[])].reverse()){const match=String(e?.action||'').match(/خصم عميل مميز بقيمة\s*([0-9]+(?:[.,][0-9]+)?)/);if(match){const amount=Number(match[1].replace(',','.'));if(Number.isFinite(amount)&&amount>0)return Math.round(amount*100)}}return 0}
function customerOrderPriceMarkup(o){const netCents=Math.max(0,Math.round(Number(o?.total||0)*100)),discountCents=customerOrderDiscountCents(o);return discountCents?discountPriceMarkup(netCents+discountCents,netCents):money(netCents/100)}

function driverNavigationButton(o){if(!o||['offered','delivered','cancelled'].includes(o.status))return '';let toCustomer=['picked_up','on_way'].includes(o.status),pickup=o.merchant_address||o.pickup||'',address=o.address||o.destination||'',lat=toCustomer?o.latitude:o.pickup_lat,lon=toCustomer?o.longitude:o.pickup_lon,target=lat!=null&&lon!=null&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lon))?lat+','+lon:toCustomer?address+' '+(o.area||''):pickup+' '+(o.area||'');if(!toCustomer&&o.shop_anywhere)return '<a class="route-link driver-nav-main" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=%D8%B3%D9%88%D8%A8%D8%B1%20%D9%85%D8%A7%D8%B1%D9%83%D8%AA%20%D9%82%D8%B1%D9%8A%D8%A8"><svg class="driver-ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg> ابحث عن سوبر ماركت قريب في الخرائط</a>';if(!target.trim())return '<p class="muted">موقع الوصول غير مسجل؛ راجع بيانات الطلب.</p>';return `<a class="route-link driver-nav-main" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&dir_action=navigate&destination=${encodeURIComponent(target.trim())}&travelmode=driving"><svg class="driver-ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg> ${toCustomer?'اتجه إلى العميل':'اتجه إلى مكان الاستلام'}${lat==null?' · بالعنوان':''}</a>`}
function contactLink(phone){let cleaned=String(phone||'').replace(/[^+0-9٠-٩]/g,'');return cleaned?`<a href="tel:${esc(cleaned)}">☎ ${esc(phone)}</a>`:'<span class="muted">رقم غير مسجل</span>'}
function driverDetailContact(phone){let value=String(phone||'').trim();if(!value)return '<p class="muted">رقم الهاتف غير متاح</p>';return `<div class="dd-phone">${contactLink(value).replace('☎ ',driverIcon('phone'))}<button type="button" class="dd-copy" onclick="copyPaymentAccount('${encodeURIComponent(value).replace(/'/g,'%27')}',this)" aria-label="نسخ رقم الهاتف"><span>نسخ الرقم</span></button></div>`}
function driverOfferCard(o){return `<article class="card driver-offer" style="padding:16px"><div class="section-heading"><strong>طلب جديد #${esc(o.id)}</strong><span class="tag">${esc(({products:'مشتريات',delivery:'توصيل',ride:'مشوار'})[o.kind]||'خدمة')}</span></div><p>${esc(o.area||'')} ${o.vehicle?' · '+esc(o.vehicle):''}</p><p>رسوم التوصيل <strong>${money(o.delivery_fee)}</strong></p>${driverActions(o)}<small class="muted">بيانات الاستلام والتسليم تظهر بعد قبول الطلب.</small></article>`}
function driverOrderDetails(o){if(o.status==='offered')return driverOfferCard(o);let pickup=o.shop_anywhere?'أي سوبر ماركت قريب':o.merchant_address||o.pickup||'عنوان الاستلام غير مسجل',destination=[o.address||o.destination,o.area].filter(Boolean).join(' · '),active=['assigned','ready','picked_up','on_way'].includes(o.status);return `<section class="card driver-detail" id="trip-details"><header class="dd-hero"><div><small>ولعه · تفاصيل ${o.kind==='ride'?'المشوار':'الطلب'}</small><h2>طلب رقم #${esc(o.id)}</h2></div><span class="dd-status">${esc(status[o.status]||o.status)}</span></header><div class="dd-content">${active?`<a class="dd-chat-shortcut" href="#order-chat-${o.id}"><span>تواصل مع العميل</span><span>فتح الشات ←</span></a>`:''}<div class="dd-stops"><section class="dd-card"><div class="dd-stop-title"><span class="dd-step">١</span><h3>الاستلام / الانطلاق</h3></div><span class="dd-label">${o.merchant_name?'المحل':'الاسم'}</span><strong class="dd-person">${esc(o.shop_anywhere?'سوبر ماركت قريب':o.merchant_name||o.sender_name||o.customer||'غير مسجل')}</strong><p class="dd-address">${esc(pickup)}</p>${driverDetailContact(o.sender_phone||o.phone)}${o.shop_anywhere&&['offered','assigned','ready'].includes(o.status)?'<p class="muted">اختر سوبر ماركت قريب واشترِ نفس الأصناف والكميات.</p>':''}</section><section class="dd-card dd-destination"><div class="dd-stop-title"><span class="dd-step">٢</span><h3>التسليم / الوصول</h3></div><span class="dd-label">اسم المستلم</span><strong class="dd-person">${esc(o.recipient_name||o.customer||'غير مسجل')}</strong><p class="dd-address">${esc(destination||'عنوان التسليم غير مسجل')}</p>${driverDetailContact(o.recipient_phone||o.phone)}${!['picked_up','on_way','delivered'].includes(o.status)?'<p class="muted">اتجاهات العميل تظهر بعد تأكيد الاستلام.</p>':''}${o.latitude==null?'<p class="muted">العنوان مسجل يدويًا بدون نقطة GPS.</p>':''}</section></div><div id="trip-route-info" aria-live="polite"></div>${o.items?.length?`<div class="dd-card">${driverProductChecklist(o)}</div>`:''}<section class="dd-card dd-note"><h3>تعليمات وتفاصيل الطلب</h3>${o.prescription?`<details class="driver-prescription"><summary>عرض الروشتة الطبية</summary><img src="${esc(o.prescription)}" alt="الروشتة المرفقة بالطلب" style="width:100%;max-height:600px;object-fit:contain;border-radius:12px"></details>`:''}${o.shipment_type?`<p><span class="dd-label">نوع الشحنة</span>${esc(o.shipment_type)} ${esc(o.shipment_other||'')}</p>`:''}${o.vehicle?`<p><span class="dd-label">المركبة</span>${esc(o.vehicle)}</p>`:''}<p>${esc(o.details||'لا توجد تعليمات إضافية من العميل')}</p></section><section class="dd-card"><div class="dd-total"><span>إجمالي الطلب</span><strong>${customerOrderPriceMarkup(o)}</strong></div><div class="dd-payment-row"><span>رسوم التوصيل</span><b>${money(o.delivery_fee)}</b></div><div class="dd-payment-row"><span>طريقة الدفع</span><b>${o.payment==='cash'?'نقدي':'محفظة'}</b></div><p class="muted">${o.payment==='cash'?(o.cash_settled?'تمت تسوية الكاش مع الإدارة':o.cash_collected?'تم تسجيل تحصيل الكاش':'لم يُسجل تحصيل الكاش بعد'):(o.payment_status==='confirmed'?'الدفع مؤكد':'الدفع قيد المراجعة')}</p></section>${driverActions(o)}${orderChat(o)}${ratingPanel(o)}<section class="dd-card"><h3>سجل حركة الطلب</h3><ol class="trip-timeline">${(o.events||[]).map(e=>`<li><strong>${esc(e.action)}</strong><small>${esc(new Date(e.at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'}))}</small></li>`).join('')||'<li><strong>لا توجد حركة مسجلة بعد</strong></li>'}</ol></section></div></section>`}
function tripDetails(o,role){if(!o)return '';if(role==='driver')return driverOrderDetails(o);let driver=state.drivers?.find(d=>d.id===o.driver_id),pickup=o.shop_anywhere?o.pickup:(o.merchant_address||o.pickup||''),destination=o.address||o.destination||'',recipient=o.recipient_name||o.customer,recipientPhone=o.recipient_phone||o.phone;return `<section class="card" id="trip-details"><div class="section-heading"><h2>تفاصيل ${o.kind==='ride'?'المشوار':'الطلب'} #${o.id}</h2><span class="tag">${esc(status[o.status]||o.status)}</span></div>${role==='driver'&&['assigned','ready','picked_up','on_way'].includes(o.status)?`<div class="row"><a class="route-link" href="#order-chat-${o.id}">💬 دردشة العميل</a></div>`:''}<div class="grid"><div class="trip-stop"><span class="tag">١ · الاستلام / الانطلاق</span><h3>${esc(o.shop_anywhere?'أي سوبر ماركت قريب':o.merchant_name||o.sender_name||o.customer)}</h3><p>${esc(pickup||'عنوان الاستلام غير مسجل')}</p>${o.shop_anywhere&&['offered','assigned','ready'].includes(o.status)?'<p>اختار سوبر ماركت قريب واشتري نفس الأصناف والكميات. <a class="route-link" href="https://www.google.com/maps/search/?api=1&query=%D8%B3%D9%88%D8%A8%D8%B1%20%D9%85%D8%A7%D8%B1%D9%83%D8%AA%20%D9%82%D8%B1%D9%8A%D8%A8" target="_blank" rel="noopener">ابحث عن سوبر ماركت قريب</a></p>':''}${contactLink(o.sender_phone||o.phone)}${role==='driver'||o.shop_anywhere?'':`<p>${navigationLink(o.pickup_lat,o.pickup_lon,pickup,'الاتجاهات إلى الاستلام')}</p>`}</div><div class="trip-stop"><span class="tag">٢ · التسليم / الوصول</span><h3>${esc(recipient)}</h3><p>${esc(destination)} · ${esc(o.area)}</p>${contactLink(recipientPhone)}${role==='driver'?(!['picked_up','on_way','delivered'].includes(o.status)?'<p class="muted">ملاحة العميل تظهر بعد تأكيد الاستلام.</p>':''):`<p>${navigationLink(o.latitude,o.longitude,destination+' '+o.area,'الاتجاهات إلى التسليم')}</p>`}${o.latitude==null?'<p class="muted">عنوان يدوي؛ لم تُحفظ نقطة GPS دقيقة لهذا الطلب.</p>':''}</div></div><div id="trip-route-info" class="pill" aria-live="polite"></div>${role==='driver'?'':`<button type="button" onclick="showMyLocationOnMap('trip-map')">📍 عرض موقعي على الخريطة</button><div id="trip-map" class="map"></div><p class="map-legend">الأزرق الاستلام، والبرتقالي التسليم، والأخضر آخر موقع شاركه الطيار. زر الاتجاهات يفتح الملاحة في الخرائط.</p>`}${o.shipment_type?`<p>الشحنة: ${esc(o.shipment_type)} · ${esc(o.shipment_other)}</p>`:''}${o.vehicle?`<p>المركبة المطلوبة: ${esc(o.vehicle)}</p>`:''}${o.items?.length?`${role==='driver'?driverProductChecklist(o):`<h3>محتويات الطلب</h3>${o.items.map(i=>`<div class="pill">${esc(orderItemName(i))} · ${esc(orderItemLineLabel(i))}</div>`).join('')}`}`:''}<p>تعليمات العميل: ${esc(o.details||'لا توجد تعليمات إضافية')}</p><div class="pill"><strong>إجمالي الطلب: ${money(o.total)}</strong><p>رسوم التوصيل: ${money(o.delivery_fee)}${role==='admin'&&o.route_km!=null?` · ${o.route_km} كم × ${money(o.km_rate)}/كم`:""} · الدفع: ${o.payment==='cash'?'نقدي':'محفظة'} · ${o.payment_status==='confirmed'?'مؤكد':'قيد المراجعة'}</p><p>الكاش: ${o.cash_settled?'تمت تسويته مع الإدارة':o.cash_collected?'حصّله الطيار':o.payment==='cash'?'لم يُسجل تحصيله بعد':'غير مطلوب'}</p></div>${role==='admin'?`<p>صاحب الحساب: ${esc(o.customer)} · ${contactLink(o.phone)}</p><p>الطيار: ${esc(o.driver_name||'لم يُسند بعد')} ${driver?contactLink(driver.phone):''}</p><p class="muted">آخر مشاركة موقع: ${esc(o.driver_location_at||'لا توجد')}</p>${adminActions(o)}`:driverActions(o)}${role==='driver'?orderChat(o):''}<h3>سجل حركة الطلب</h3><ol class="trip-timeline">${(o.events||[]).map(e=>`<li><strong>${esc(e.action)}</strong><small>${esc(new Date(e.at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'}))}</small></li>`).join('')||'<li>لا توجد أحداث مسجلة</li>'}</ol></section>`}
function orderDispatchNote(o){const message={awaiting_quote:'لسه محتاج تحديد السعر من الإدارة، وبعدها موافقة العميل قبل عرضه على الطيار.',quote_pending:'السعر اتبعت للعميل؛ منتظر موافقته قبل التوزيع.',medicine_review:'طلب الأدوية منتظر مراجعة الإدارة.',payment_review:'التحويل منتظر تأكيد الدفع من الإدارة.',awaiting_driver:'الأوردر محفوظ؛ منتظر طيار متاح بدأ الشيفت وأكمل صورة التحقق. التوزيع بيتعاد تلقائيًا.',offered:'اتعرض على طيار؛ منتظر قبوله خلال مهلة العرض.'}[o.status];return message?`<p class="dispatch-note" role="status">ℹ ${message}</p>`:''}
function driverOrderSummary(o){if(o.status==='offered')return driverOfferCard(o);return `<article class="driver-order-card driver-summary"><div class="driver-summary-head"><span class="driver-ledger-icon">${driverIcon('box')}</span><div><strong>طلب #${esc(o.id)}</strong><small>${esc(o.recipient_name||o.customer||'عميل ولعه')}</small></div><span class="tag">${esc(status[o.status]||o.status)}</span></div><p>${driverIcon('pin')}${esc([o.address||o.destination,o.area].filter(Boolean).join(' · ')||'العنوان غير مسجل')}</p><div class="driver-summary-footer"><strong>${money(o.total)}</strong><button class="secondary" onclick="openTrip(${o.id})">عرض تفاصيل الطلب</button></div>${driverActions(o)}${ratingPanel(o)}</article>`}
function orderCard(o,role){if(role==='driver')return driverOrderSummary(o);return `<div class="card"><button onclick="openTrip(${o.id})">تفاصيل الرحلة والمتابعة</button><span class="tag">#${o.id} · ${status[o.status]}</span><h3>${esc({products:'منتجات',delivery:'توصيل أوردر',ride:'مشوار',custom:state.services.find(s=>s.key===o.service_key)?.name||'خدمة إضافية'}[o.kind])} · ${esc(o.area)}</h3>${o.kind==='delivery'&&o.shipment_type?`<div class="pill"><strong>الشحنة: ${esc(o.shipment_type)}</strong> ${esc(o.shipment_other)}<p>المرسل: ${esc(o.sender_name)} · ${contactLink(o.sender_phone||o.phone)} · ${esc(o.pickup)}</p><p>المستلم: ${esc(o.recipient_name)} · ${contactLink(o.recipient_phone)} · ${esc(o.address)}</p></div>`:''}<p>${esc(o.customer)} · ${role==='driver'?contactLink(o.phone):esc(o.phone)} · ${esc(o.address)}</p>${o.shop_anywhere?'<p>الشراء من أي سوبر ماركت قريب؛ الطيار يختار المكان.</p>':o.merchant_name?`<p>الاستلام من: ${esc(o.merchant_name)} · ${esc(o.merchant_address)}</p>`:''}${o.items.length?`<p>${o.items.map(i=>`${esc(orderItemName(i))} · ${esc(orderItemQuantityLabel(i))}`).join('، ')}</p>`:''}${o.pickup?`<p>من: ${esc(o.pickup)} ← إلى: ${esc(o.destination)} ${esc(o.vehicle)}</p>`:''}<p class="muted">${esc(o.details)} · ${o.payment==='cash'?'كاش':'محفظة'} · ${o.payment_status==='pending'?'الدفع قيد المراجعة':'الدفع مؤكد/كاش'} · ${money(o.total)}</p><p class="muted">المندوب: ${esc(o.driver_name||'لم يُحدد')} ${role==='customer'?contactLink(o.driver_phone):''}</p>${role==='driver'&&o.prescription?`<details><summary>عرض الروشتة الطبية</summary><img src="${esc(o.prescription)}" alt="روشتة الطلب" style="width:100%;max-height:600px;object-fit:contain"></details>`:''}${role==='driver'?`<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&dir_action=navigate&destination=${encodeURIComponent(o.latitude!=null?o.latitude+','+o.longitude:o.address+' '+o.area)}">📍 الاتجاهات إلى العميل</a></p>`:''}${role==='admin'?orderDispatchNote(o)+adminActions(o)+`<button class="order-chat-button" onclick="openOrderArchive(${o.id})">💬 سجل الشات</button>`+orderArchivePanel(o):role==='driver'?driverActions(o):''}${ratingPanel(o)}</div>`}
function saveOrderAdditionalFee(id){try{api('order/additional-fee',{id,amount:$('extra-fee-'+id).value}).then(()=>alert('تم حفظ الرسوم الإضافية وتحديث الإجمالي')).catch(e=>alert(e.message))}catch(e){alert(e.message)}}
function adminActions(o){return `<div class="stack">${!['delivered','cancelled','awaiting_quote','quote_pending'].includes(o.status)&&(o.payment==='cash'||o.payment_status!=='confirmed')?`<section class="admin-extra-fee"><div><strong>رسوم إضافية للطلب</strong><small>تُضاف تلقائيًا إلى التوصيل والإجمالي النهائي.</small></div><div class="admin-extra-fee-controls"><label for="extra-fee-${o.id}">المبلغ بالجنيه</label><input id="extra-fee-${o.id}" type="number" min="0" max="100000" step="0.01" value="${Number(o.additional_fee||0)}"><button type="button" onclick="saveOrderAdditionalFee(${o.id})">حفظ الرسوم</button></div></section>`:''}${`<section class="order-delivery-photo-panel"><header><strong>إثبات الأوردر بالصور</strong><small>صور الطلب عند الاستلام وعند التسليم</small></header><div class="order-proof-status"><span class="${o.has_pickup_photo?'is-done':'is-pending'}">${o.has_pickup_photo?'✓ '+(o.kind==='delivery'?'صورة الشحنة عند المرسل مرفوعة':'صورة الاستلام مرفوعة'):(o.kind==='delivery'?'بانتظار صورة الشحنة عند المرسل':'بانتظار صورة الاستلام')}</span><span class="${o.has_delivery_photo?'is-done':'is-pending'}">${o.has_delivery_photo?'✓ '+(o.kind==='delivery'?'صورة الشحنة عند المستلم مرفوعة':'صورة التسليم مرفوعة'):(o.kind==='delivery'?'بانتظار صورة الشحنة عند المستلم':'بانتظار صورة التسليم')}</span></div><div id="order-delivery-photos-${o.id}"><button type="button" class="secondary" onclick="loadOrderDeliveryPhotos(${o.id})">عرض صور الإثبات</button></div></section>`}${o.prescription?`<a href="${o.prescription}" target="_blank" download="prescription-${o.id}.png">عرض الوصفة</a>`:''}${o.status==='medicine_review'?`<button onclick="act(${o.id},'approve_medicine')">تمت مراجعة طلب الأدوية</button><button onclick="act(${o.id},'reject_medicine')">رفض الطلب</button>`:''}${o.payment==='cash'&&o.status==='delivered'&&o.cash_collected&&!o.cash_settled?`<button onclick="act(${o.id},'settle_cash')">استلمت الكاش من المندوب</button>`:''}${o.proof&&o.payment_status==='pending'?`<a href="${o.proof}" download="proof-${o.id}.png" target="_blank">فتح إثبات التحويل</a> <button onclick="act(${o.id},'confirm_payment')">تأكيد وصول المبلغ</button>`:''}${['awaiting_quote','quote_pending'].includes(o.status)?`<label>${o.prescription_only?'الإجمالي شامل الأدوية والتوصيل':'سعر المشوار أو التوصيل بالجنيه'}<input id="quote-${o.id}" type="number" min="0" max="100000" step="0.01" value="${o.total||''}" placeholder="السعر بالجنيه"></label>${o.prescription_only?`<label>التوصيل فقط (لحساب مستحق الطيار)<input id="quote-delivery-${o.id}" type="number" min="0" step="0.01" value="${o.delivery_fee||0}"></label>`:''}<button onclick="submitQuote(${o.id})">تحديد السعر</button>`:''}${o.status==='awaiting_driver'?`<button onclick="act(${o.id},'retry_dispatch')">إعادة محاولة توزيع الطيارين</button>`:''}${o.status==='new'?`<button onclick="act(${o.id},'approve_order')">مراجعة وتوزيع الطلب القديم</button>`:''}${['assigned','awaiting_driver','ready'].includes(o.status)?`<label>تعيين مندوب من المنطقة</label><select id="assign-${o.id}">${state.drivers.filter(d=>d.area===o.area&&d.available&&(o.kind!=='ride'||d.vehicle_type===o.vehicle)).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><button onclick="reassign(${o.id})">إسناد يدوي</button>`:''}${!['delivered','cancelled'].includes(o.status)?`<button onclick="act(${o.id},'cancel')">إلغاء الطلب</button>`:''}</div>`}
const driverCheckedItems=new Map(),driverShopDrafts=new Map();

async function setupWarehouse(){if(!merchantPoint)return alert('حدد مكان استلام البضاعة الحقيقي على الخريطة');let address=$('m-address').value.trim();if(!address)return alert('اكتب عنوان الاستلام بالتفصيل');try{await api('warehouse/setup',{area:$('m-area').value,address,...merchantPoint});clearMerchantEditorDraft();alert('اتحفظ موقع الاستلام واتربطت به المنتجات. أي منتج له سعر وكمية محفوظين هيظهر للعميل؛ والباقي اضغط نشر للعميل بعد كتابة سعره وكميته.')}catch(e){alert(e.message)}}

async function compressMerchantPhoto(file){if(!file.type.startsWith('image/'))throw Error('اختر صورة من المعرض');if(file.size>10_000_000)throw Error('الصورة الأصلية أكبر من 10 ميجابايت');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let photo=canvas.toDataURL('image/jpeg',0.78);if(photo.length>800_000)photo=canvas.toDataURL('image/jpeg',0.58);if(photo.length>800_000)throw Error('الصورة كبيرة بعد التصغير؛ اختر صورة أخرى');return photo}finally{URL.revokeObjectURL(url)}}
function previewMerchantPhoto(input){const file=input.files?.[0],preview=$('m-photo-preview');if(!preview)return;if(!file){preview.removeAttribute('src');preview.hidden=true;return}if(!file.type.startsWith('image/')){alert('اختر صورة من المعرض');input.value='';return}const url=URL.createObjectURL(file);preview.onload=()=>URL.revokeObjectURL(url);preview.src=url;preview.hidden=false}

let backgroundTrackingToken='';function clearBackgroundTrackingToken(){backgroundTrackingToken=''}function stopBackgroundTracking(){if(backgroundTrackingToken){window.WallahaNative?.stopDriverTracking?.();backgroundTrackingToken=''}}function syncDriverAutomation(){if(tab!=='driver'){stopLocation(false);stopBackgroundTracking();locationAccount=null;locationAttempted=false;return}if(locationAccount!==state.user.id){stopLocation(false);locationAccount=state.user.id;locationPaused=false;locationAttempted=false}if(state.driver_profile?.identity_blocked_shift){stopLocation(false);stopBackgroundTracking();return}if(state.driver_shift&&token&&window.WallahaNative?.startDriverTracking&&backgroundTrackingToken!==token){window.WallahaNative.startDriverTracking(token,location.origin);backgroundTrackingToken=token}if(!state.driver_shift)stopBackgroundTracking();if(!locationPaused&&!locationAttempted)startLocation();autoStartOrderSound()}

async function compressDriverPhoto(file){if(!file.type.startsWith('image/'))throw Error('اختر صورة من المعرض');if(file.size>10_000_000)throw Error('الصورة الأصلية أكبر من 10 ميجابايت');let url=URL.createObjectURL(file);try{let img=new Image();img.src=url;await img.decode();let scale=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let photo=canvas.toDataURL('image/jpeg',0.82);if(photo.length>1_500_000)photo=canvas.toDataURL('image/jpeg',0.6);if(photo.length>1_500_000)throw Error('الصورة كبيرة بعد التصغير؛ اختر صورة أخرى');return photo}finally{URL.revokeObjectURL(url)}}

async function saveDriverPhoto(){if(driverPhotoBusy)return alert('انتظر تجهيز الصورة');const file=$('driver-photo')?.files?.[0]||driverPhotoDraft;if(!file)return alert('اختر صورة أولًا');driverPhotoBusy=true;const button=$('driver-photo-save');if(button)button.disabled=true;try{const photo=driverPhotoPreview||await compressDriverPhoto(file);await api('driver/photo',{photo});clearDriverPhotoDraft();render();alert('تم حفظ الصورة')}catch(e){if($('driver-photo-status'))$('driver-photo-status').textContent=e.message;else alert(e.message)}finally{driverPhotoBusy=false;if($('driver-photo-save'))$('driver-photo-save').disabled=false}}

async function setDriverEarning(id,paid){if(paid&&!confirm('هل صرفت هذا المستحق للطيار بالفعل؟ هذا الزر يسجل الصرف فقط.'))return;try{const wallet_password=prompt('اكتب كلمة سر لوحة التحكم لتأكيد تعديل المحفظة');if(!wallet_password)return;await api('driver/earning',paid?{id,paid:true,wallet_password}:{id,amount:$('earning-'+id).value,wallet_password})}catch(e){alert(e.message)}}
function renderDriverHistory(){let history=state.orders.filter(o=>['delivered','cancelled'].includes(o.status)),chosen=history.find(o=>o.id===selectedTripId)||history[0];if(driverHistoryLoading&&!history.length)return `<section class="driver-history-page"><div class="driver-view-title"><span class="driver-title-icon"><svg class="driver-ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><h2>سجل الطلبات والمحادثات</h2><p>جارٍ تحميل طلباتك ومحادثاتك</p></div></div><div class="driver-loading-card"><span class="driver-loader"></span> جاري تحميل السجل…</div></section>`;return `<section class="driver-history-page"><div class="driver-view-title"><span class="driver-title-icon"><svg class="driver-ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><h2>سجل الطلبات والمحادثات</h2><p>افتح أي طلب لمراجعة تفاصيله ومحادثته</p></div><span class="driver-history-count">${history.length} طلب</span></div>${tripDetails(chosen,'driver')}${history.filter(o=>o.id!==chosen?.id).map(o=>orderCard(o,'driver')).join('')||(!chosen?'<div class="empty">لا توجد طلبات مكتملة بعد.</div>':'')}</section>`}
function renderDriverOld(){let active=state.orders.filter(o=>!['cancelled','delivered'].includes(o.status)),current=active.find(o=>['assigned','ready','picked_up','on_way'].includes(o.status)),chosen=active.find(o=>o.id===selectedTripId)||current||active.find(o=>o.status==='offered'),heading=current?(['picked_up','on_way'].includes(current.status)?'اتجه إلى العميل':'اتجه إلى مكان الاستلام'):active.length?'طلبات جديدة متاحة لك':'في انتظار الطلبات';return `<section class="driver-map-stage" aria-label="خريطة الطيار"><div class="driver-map-heading"><strong><svg class="driver-ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg> ${heading}</strong><span>${current?'المسار حسب مرحلة الطلب':active.length?'اختر طلبًا من القائمة أسفل الخريطة':'سيظهر موقعك هنا عند تفعيله'}</span></div><div id="driver-map" class="map driver-live-map" aria-label="خريطة الطلبات ومسار الطيار"></div>${driverNavigationButton(current||chosen)}${driverMapActions(current||chosen)}</section><section class="driver-order-sheet"><div class="driver-order-sheet-head"><div><span class="eyebrow">ولعه · الطيار</span><h2>${current?'الطلب الجاري':active.length?'طلبات جديدة':'لا توجد طلبات الآن'}</h2></div><span class="tag">${active.length} ${active.length===1?'طلب':'طلبات'}</span></div>${chosen?tripDetails(chosen,'driver'):!active.length?'<div class="empty">أنت جاهز لاستقبال الطلبات. سيظهر الطلب الجديد هنا مع موقع الاستلام والتسليم.</div>':''}${active.filter(o=>o.id!==chosen?.id).map(o=>orderCard(o,'driver')).join('')}</section>`}
function loginViewLegacy(){if(location.pathname==='/admin')return `<div class="card" style="max-width:460px;margin:auto"><h2>دخول المسؤول</h2><p class="muted">لوحة التحكم خاصة بصاحب تطبيق ولعه فقط.</p><label>اسم المستخدم</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password" autocomplete="current-password"><button onclick="login()">دخول لوحة التحكم</button></div>`;if(location.pathname.startsWith('/driver'))return `<div class="card" style="max-width:460px;margin:auto"><h2>دخول تطبيق الطيار</h2><p>حسابك الخاص في ولعه، مشاويرك ومحفظتك.</p><label>إيميل الطيار أو اسم المستخدم أو رقم الهاتف</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password" autocomplete="current-password"><button onclick="login()">دخول حسابي</button><button class="secondary" onclick="alert('لو نسيت كلمة المرور، تواصل مع مسؤول ولعه للتحقق من هويتك وإعطائك كلمة مرور مؤقتة. بعد الدخول غيّرها من الإعدادات.')">نسيت كلمة المرور؟</button><p class="muted">المسؤول ينشئ حسابك باسمك من لوحة التحكم.</p></div>`;return `<div class="card" style="background:#ecf8ef;text-align:center"><h2>شوف تطبيق ولعه من جوه</h2><p class="muted">تصفح الأقسام والمحلات والمنتجات من غير حساب. تسجيل الدخول مطلوب وقت إرسال الطلب فقط.</p><button onclick="browsePreview()">تصفح التطبيق بدون تسجيل</button></div><div class="grid"><div class="card"><h2>دخول ولعه</h2><label>اسم المستخدم أو رقم الهاتف</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password"><button onclick="login()">دخول</button><p class="muted">تطبيق العميل · الطلبات والتوصيل</p></div><div class="card"><h2>حساب عميل جديد</h2><label>الاسم</label><input id="reg-name"><label>رقم الهاتف (11 رقمًا)</label><input id="reg-phone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="15" placeholder="01xxxxxxxxx أو +201xxxxxxxxx أو 00201xxxxxxxxx" oninput="normalizeRegistrationPhoneInput(this)"><small class="muted">اكتب الرقم المحلي أو بصيغة ‎+20 / 0020؛ سيُحوّل تلقائيًا للصيغة المحلية.</small><label>كلمة مرور (10 أحرف على الأقل)</label><input id="reg-pass" type="password"><button onclick="register()">إنشاء حساب</button></div></div>`}
async function browsePreview(silent=false){if(expectedAppRole&&expectedAppRole!=='customer'){state=null;previewMode=false;render();return}const cached=readCustomerCatalogCache();if(cached&&!state){state=customerPreviewState(cached);previewMode=true;cachedCatalogActive=true;offline=navigator.onLine===false;connectionMessage='جارٍ تحديث البيانات؛ آخر نسخة محفوظة ظاهرة مؤقتًا.';tab='customer';render()}else if(!state)showStartupLoading();try{const {response:r,data:catalog}=await fetchJsonWithTimeout('/api/catalog',{},30000);if(!r.ok)throw Error('تعذر تحميل الأقسام');clearStartupRetry();saveCustomerCatalogCache(catalog);previewMode=true;state=customerPreviewState(catalog);cachedCatalogActive=false;offline=false;connectionMessage='';tab='customer';acceptSharedRideDestination();render()}catch(e){scheduleStartupRetry();offline=navigator.onLine===false;connectionMessage=offline?'الإنترنت غير متاح حاليًا؛ البيانات المحفوظة ظاهرة، وسيحاول التطبيق التحديث تلقائيًا.':'تعذر تحميل أحدث البيانات مؤقتًا؛ سيحاول التطبيق مرة أخرى تلقائيًا.';if(!state){previewMode=false;render()}else render()}}
function leavePreview(){previewMode=false;state=null;render()}
async function login(){try{const username=$('login-phone').value,password=$('login-pass').value;let v=await api(location.pathname==='/admin'?'admin/login':'login',{phone:username,password,security_key:location.pathname==='/admin'?$('login-security-key')?.value||'':undefined,expected_role:expectedAppRole});if(v.security_setup_required&&location.pathname==='/admin'){adminSecuritySetupView(username,password,v.recovery_question);return}token=v.token;previewMode=false;cachedReadOnly=false;cachedCatalogActive=false;localStorage.setItem(appTokenKey,token);await refresh()}catch(e){alert(e.message)}}
async function registerLegacy(){try{await api('register',{name:$('reg-name').value,phone:$('reg-phone').value,password:$('reg-pass').value});alert('تم إنشاء الحساب. سجل الدخول الآن.')}catch(e){alert(e.message)}}
async function logout(){if(previewMode)return leavePreview();try{await api('logout',{})}catch(e){}stopLocation(false);stopBackgroundTracking();locationAccount=null;locationAttempted=false;token='';localStorage.removeItem(appTokenKey);localStorage.removeItem('wallaha_token');state=null;chatDrafts.clear();chatCache.clear();checkoutDraft={};checkoutFiles={};rememberedAccount='';chosenPoint=null;chosenPickup=null;merchantPoint=null;trackingOrderId=null;render();checkoutDraft={};checkoutFiles={}}
async function changePassword(){let old=$('current-pass').value, next=$('new-pass').value;if(!old||next.length<10){alert('اكتب كلمة المرور الحالية وجديدة من 10 أحرف على الأقل');return}try{await api('change-password',{current_password:old,new_password:next});alert('تم تغيير كلمة المرور وإغلاق الجلسات الأخرى')}catch(e){alert(e.message)}}
async function saveRecoveryAnswer(){let answer=$('account-recovery-answer').value.trim();if(answer.length<3){alert('اكتب إجابة استرداد من 3 أحرف على الأقل');return}try{await api('account/recovery-answer',{current_password:$('current-pass').value,recovery_answer:answer});alert('تم حفظ إجابة استرداد الحساب')}catch(e){alert(e.message)}}

sswordToggle(root);root.querySelectorAll?.('input[type="password"]').forEach(addPasswordToggle)}scan(document);new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===Node.ELEMENT_NODE)scan(node)}))).observe(document.documentElement,{childList:true,subtree:true})})();</script></body></html>
