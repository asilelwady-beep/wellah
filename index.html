async function enableDriverSound(){localStorage.removeItem('wallaha_sound_muted');try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('هذا المتصفح لا يدعم صوت التنبيه');if(!driverAudio||driverAudio.state==='closed')driverAudio=new Audio();await driverAudio.resume();if(driverAudio.state!=='running')throw Error('لم يُفعّل الصوت. اضغط الزر مرة أخرى وتأكد من مستوى صوت الوسائط');driverSoundEnabled=true;driverSoundError='';playDriverAlarm();updateSoundStatus();render()}catch(e){driverSoundEnabled=false;driverSoundError=e.message;updateSoundStatus();alert(e.message)}}
function muteDriverSound(){localStorage.setItem('wallaha_sound_muted','1');driverSoundEnabled=false;driverSoundError='';driverAudio?.suspend().catch(()=>{});render()}
function checkDriverOffers(){let account=state.user.id;if(driverOfferAccount!==account){driverOfferAccount=account;heardDriverOffers.clear();driverSoundError=''}let fresh=offeredNow().filter(o=>!heardDriverOffers.has(o.id+':'+o.offer_until));for(let o of fresh){heardDriverOffers.add(o.id+':'+o.offer_until);notifyNewOrder(o.id,'driver')}if(fresh.length)playDriverAlarm();while(heardDriverOffers.size>500)heardDriverOffers.delete(heardDriverOffers.values().next().value)}

const weightChoices={};
function soldByWeight(p){return !!p&&!/علبة|عبوة|باكت|معلب|مجمد|مجمّد|Frozen|Pack|حزمة|ربطة|قطعة|قطعتين|حبة|سبريد|شرائح جاهزة/i.test(p.name)&&(/خضار|فاكهة|فواكه|لحوم|أسماك|دواجن/.test(p.category)||(p.category==='سوبر ماركت'&&(/^(?:لحم|لحمة|كبدة|دجاج طازج|فراخ طازجة|سمك|بلطي|بوري|جمبري|كابوريا|ثوم طازج|لانشون|لنشون|لَنشون|بسطرمة|سلامي|مرتديلا|ديك رومي|جبنة رومي|جبن رومي|جبنة شيدر|جبن شيدر)(?:\s|$)/.test(p.name)||(/لانشون|سلامي|سلامى|بسطرمة/.test(p.name)&&/بالوزن|بالكيلو/.test(p.name)))))}
function weightBasis(p){let m=p.name.match(/(\d+(?:[.]\d+)?)\s*(كجم|كيلو|kg|جرام|غرام|جم|g)(?=\s|$|[^\w\u0600-\u06ff])/i);return m?(Number(m[1])/(/^(جرام|غرام|جم|g)$/i.test(m[2])?1000:1)||1):1}
function productPrice(p){return (p?.price||0)/(soldByWeight(p)?weightBasis(p):1)}
function weightLabel(p,q){return soldByWeight(p)?(q===0.25?'ربع كيلو':q===0.5?'نص كيلو':q===1?'كيلو':q+' كجم'):q+' قطعة'}
function weightPicker(p){return soldByWeight(p)?`<label for="weight-${p.id}">الوزن</label><select id="weight-${p.id}" aria-label="وزن ${esc(p.name)}" onchange="weightChoices[${p.id}]=Number(this.value)"><option value="0.25" ${(weightChoices[p.id]||1)===0.25?'selected':''}>ربع كيلو (٢٥٠ جرام)</option><option value="0.5" ${(weightChoices[p.id]||1)===0.5?'selected':''}>نص كيلو (٥٠٠ جرام)</option><option value="1" ${(weightChoices[p.id]||1)===1?'selected':''}>كيلو (١٠٠٠ جرام)</option></select>`:''}
function weightHint(p){return soldByWeight(p)?'<span class="tag">الوزن: ربع أو نص أو كيلو</span>':''}
function cartCount(){return Object.values(cart).filter(q=>q>0).length}
function cartSubtotal(){return Object.entries(cart).reduce((sum,[id,q])=>sum+productPrice(state.products.find(p=>p.id==id))*Math.max(0,q),0)}
function goCustomer(view){if(view==='checkout'&&customerView!=='checkout'){autoCheckoutLocationAttempted=false;if(kind==='products'){mapPinMode='destination';addressMode='gps'}}customerView=view;render();window.scrollTo({top:0,behavior:'smooth'})}
function chooseCategory(name){draftLimit=48;draftExpanded=name!=='الكل';kind='products';categoryFilter=name;customerView='home';render();document.getElementById('draft-catalog')?.scrollIntoView({behavior:'smooth',block:'start'})}
async function selectMerchant(value){prescriptionOnly=false;let next=Number(value);if(merchantId!==next&&cartCount()&&!(await window.appConfirm('تغيير المحل هيفرّغ السلة الحالية. تكمل؟',{title:'تغيير المحل',confirmText:'نعم، غيّر المحل'})))return;if(merchantId!==next){cart={};shopAnywhere=false}merchantId=next;kind='products';categoryFilter=state.merchants.find(m=>m.id===next)?.category||'الكل';productSearch='';goCustomer('store')}
function changeCart(id,delta){let product=state.products.find(p=>p.id===id);if(!product)return;let step=soldByWeight(product)?(weightChoices[id]||1):1,max=product.stock*(soldByWeight(product)?weightBasis(product):1);let next=(cart[id]||0)+delta*step;if(next>max){alert('الوزن أو الكمية المطلوبة غير متاحة');return}cart[id]=Math.max(0,next);if(!cart[id])delete cart[id];let y=window.scrollY;render();window.scrollTo(0,y)}
async function startService(type,key=''){if(cartCount()&&!(await window.appConfirm('بدء خدمة جديدة هيفرّغ السلة الحالية. تكمل؟',{title:'بدء خدمة جديدة',confirmText:'نعم، ابدأ'})))return;if(type==='delivery')shipmentType='';prescriptionOnly=false;kind=type;serviceKey=key;merchantId=0;cart={};chosenPoint=null;chosenPickup=null;deliveryQuote=null;autoCheckoutLocationAttempted=false;checkoutDraft={};goCustomer('checkout')}
function openCustomerAccount(){if(previewMode)leavePreview();else goCustomer('account')}
function savedCustomerAddress(){try{return JSON.parse(localStorage.getItem('wallaha_address_'+state.user.id)||'{}')}catch(e){return {}}}
function saveAccountAddress(){let saved={area:$('account-area').value,address:$('account-address').value.trim()};localStorage.setItem('wallaha_address_'+state.user.id,JSON.stringify(saved));checkoutDraft={...checkoutDraft,...saved};alert('تم حفظ عنوانك على هذا الجهاز لاستخدامه في طلبات المشتريات')}
function customerAccount(){let saved=savedCustomerAddress(),count=state.orders.length;return `<section class="account-head"><button class="account-settings" onclick="document.getElementById('account-settings')?.scrollIntoView({behavior:'smooth'})" aria-label="إعدادات الحساب">⚙</button><div class="account-identity"><span class="account-avatar">${esc((state.user.name||'و').trim().charAt(0))}</span><div><h2>${esc(state.user.name)}</h2><p>${esc(state.user.phone)}</p></div></div></section><section class="account-feature"><span>🛵</span><div><strong>ولعه معاك في كل مشوار</strong><p>طلبات البيت والتوصيل والمشاوير من تطبيق واحد.</p></div></section><div class="account-list"><button onclick="goCustomer('orders')"><span class="account-icon">▤</span><strong>طلباتي السابقة</strong><small>${count} طلب</small><b>‹</b></button><button onclick="goCustomer('home')"><span class="account-icon">⌂</span><strong>اطلب خدمة جديدة</strong><b>‹</b></button><details id="account-settings"><summary><span class="account-icon">⚙</span><strong>إعدادات الحساب</strong><b>‹</b></summary>${accountPanel()}${emailRecoveryPanel()}${supportSettingsPanel()}</details><details><summary><span class="account-icon">?</span><strong>مساعدة</strong><b>‹</b></summary><p>اختار الخدمة والموقع ثم أكد الطلب. تقدر تراسل الطيار داخل الطلب بعد قبوله، والأرقام الشخصية مخفية.</p></details><details><summary><span class="account-icon">ⓘ</span><strong>عن ولعه</strong><b>‹</b></summary><p>خدمات التوصيل والمشاوير في البدرشين وقراها.</p></details></div><details class="card account-address"><summary>📍 عنوان المشتريات المعتاد</summary><p class="muted">محفوظ على هذا الجهاز ويمكن تغييره وقت الطلب.</p><label for="account-area">المنطقة</label><select id="account-area">${options(state.areas,saved.area)}</select><label for="account-address">العنوان</label><input id="account-address" value="${esc(saved.address||'')}" placeholder="الشارع ورقم البيت وعلامة مميزة"><button onclick="saveAccountAddress()">حفظ عنواني</button></details><button class="account-logout" onclick="logout()">تسجيل الخروج</button>`}
function usePickupGPS(){if(typeof window.pickupCurrentLocation==='function')window.pickupCurrentLocation();else alert('الخريطة لم تجهز بعد؛ انتظر لحظة وجرب مرة أخرى')}
function customerNav(){return `<nav class="customer-bottom" aria-label="التنقل في تطبيق العميل"><button class="${customerView==='home'||customerView==='store'||customerView==='product'?'active':''}" onclick="goCustomer('home')"><b>⌂</b>الرئيسية</button><button class="${customerView==='orders'?'active':''}" onclick="goCustomer('orders')"><b>▤</b>طلباتك</button><button class="${customerView==='checkout'?'active':''}" onclick="goCustomer('checkout')"><b>🛒</b>السلة ${cartCount()?`(${cartCount()})`:''}</button><button class="${customerView==='account'?'active':''}" onclick="openCustomerAccount()"><b>♙</b>حسابك</button></nav>`}
function customerTop(){return `<div class="customer-topline"><div class="customer-place"><span>التوصيل إلى</span><strong>📍 البدرشين والقرى المحيطة <small>⌄</small></strong></div><button class="customer-avatar" onclick="openCustomerAccount()" aria-label="افتح حسابك">${previewMode?'👤':esc((state.user.name||'و').trim().charAt(0))}</button></div>`}
function merchantCards(){let q=homeQuery.trim().toLocaleLowerCase('ar');return (state.merchants.filter(m=>m.active&&(categoryFilter==='الكل'||m.category===categoryFilter)).filter(m=>!q||[m.name,m.category,m.area,m.address,...state.products.filter(p=>p.merchant_id===m.id&&p.active&&p.stock>0).map(p=>p.name)].join(' ').toLocaleLowerCase('ar').includes(q)).map(m=>{let look=categoryLooks[m.category]||['🛍️','#e9f2f2'];let count=state.products.filter(p=>p.merchant_id===m.id&&p.active&&p.stock>0).length;return `<button class="merchant-card" onclick="selectMerchant(${m.id})"><span class="merchant-art" style="--tile-bg:${look[1]}">${look[0]}</span><span><strong>${esc(m.name)}</strong><small>${esc(m.category)} · ${esc(m.area)}</small><span class="merchant-open">${count?`${count} منتج متاح`:'تصفح المحل'}</span></span></button>`}).join('')+listedRestaurantCards())||'<div class="customer-empty">لا توجد محلات مطابقة حاليًا. اختر قسمًا آخر أو اطلب توصيل أي غرض.</div>'}
function renderHomeMerchantList(){if($('draft-catalog-container'))$('draft-catalog-container').innerHTML=draftCatalogHTML();let box=$('merchant-cards');if(box)box.innerHTML=merchantCards()}
function normalizeSearch(value){return String(value||'').normalize('NFKC').toLowerCase().replace(/[\u064b-\u065f\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').split(/\s+/).map(w=>w.startsWith('ال')?w.slice(2):w).join(' ').trim()}
function matchesSearch(name,query){let text=normalizeSearch(name);return normalizeSearch(query).split(/\s+/).filter(Boolean).every(word=>text.includes(word))}
let selectedCatalogProductId=0;
function searchableProducts(){let available=(state.products||[]).filter(p=>p.active&&p.stock>0&&!p.price_pending&&state.merchants.some(m=>m.id===p.merchant_id&&m.active)&&state.categories.some(c=>c.name===p.category&&c.active));let ids=new Set(available.map(p=>p.id));return [...available,...(state.draft_catalog||[]).filter(p=>!ids.has(p.id))]}
function openCatalogProduct(id){selectedCatalogProductId=id;goCustomer('product')}
function openProductStore(id){let p=(state.products||[]).find(p=>p.id===id);if(!p)return;selectMerchant(p.merchant_id);if(customerView==='store'){productSearch=p.name;render()}}
function customerProduct(){let p=searchableProducts().find(p=>p.id===selectedCatalogProductId);if(!p)return '<button onclick="goCustomer(\'home\')">رجوع للبحث</button><p>هذا المنتج غير متاح حاليًا.</p>';let available=p.active&&p.stock>0&&!p.price_pending;return `<button class="customer-back" onclick="goCustomer('home')">→ رجوع لنتائج البحث</button><div class="card"><div class="product-picture" style="height:280px"><img src="${esc(p.image||'/product-illustration/'+p.id+'.svg')}" alt="${esc(p.name)}"></div><h2>${esc(p.name)}</h2><p>${esc(p.category)}</p>${available?`<p class="price">${money(productPrice(p))}${soldByWeight(p)?' / كيلو':''}</p>${weightPicker(p)}<p>المحل: ${esc(state.merchants.find(m=>m.id===p.merchant_id)?.name||'')}</p><button onclick="openProductStore(${p.id})">اختيار الكمية وإضافة للسلة</button>`:'<p class="muted">السعر والتوافر لم يُحددا بعد. المنتج غير متاح للطلب حاليًا.</p>'}</div>`}
let draftExpanded=false,draftLimit=48;
function draftCatalogHTML(){let q=homeQuery.trim(),items=(q?searchableProducts():(state.draft_catalog||[])).filter(p=>(q||categoryFilter==='الكل'||p.category===categoryFilter)&&matchesSearch(p.name,q));return `<section id="draft-catalog"><div class="section-heading"><div><h2>${q?'نتائج البحث':'كتالوج المنتجات'} · ${items.length} منتج</h2><p>${q?'اضغط على المنتج لعرض تفاصيله واختيار الكمية إذا كان متاحًا.':'المنتجات بدون أسعار للتصفح حتى تحديد السعر والتوافر.'}</p></div></div><div class="product-grid">${(draftExpanded||q?items.slice(0,draftLimit):items.slice(0,12)).map(p=>`<button class="product-card" style="color:inherit;text-align:right" onclick="openCatalogProduct(${p.id})" aria-label="عرض تفاصيل ${esc(p.name)}"><div class="product-picture"><img src="${esc(p.image||'/product-illustration/'+p.id+'.svg')}" alt="${esc(p.name)}" loading="lazy"></div><span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p class="muted">${p.active&&p.stock>0&&!p.price_pending?money(productPrice(p))+(soldByWeight(p)?' / كيلو':''):'السعر لم يُحدد'}</p>${weightHint(p)}<span class="tag">عرض التفاصيل</span></button>`).join('')||'<p class="muted">لا توجد منتجات مطابقة. جرّب اسمًا آخر.</p>'}</div>${(draftExpanded||q)&&items.length>draftLimit?'<button onclick="draftLimit+=48;renderHomeMerchantList()">عرض المزيد من المنتجات</button>':!draftExpanded&&!q&&items.length>12?'<button onclick="draftExpanded=true;render()">عرض كل منتجات الكتالوج</button>':''}</section>`}

function customerHome(){return `<div class="home-masthead">${customerTop()}<div class="customer-search"><span aria-hidden="true">⌕</span><input aria-label="ابحث عن محل أو منتج" placeholder="بتدور على إيه النهارده؟" value="${esc(homeQuery)}" oninput="homeQuery=this.value;renderHomeMerchantList()"></div></div><div class="section-heading home-section-title"><div><h2>اطلب منين النهارده؟</h2><p>اختار الخدمة اللي محتاجها</p></div></div><div class="category-grid">${categoryTiles()}${categoryFilter==='أدوية'?prescriptionEntry():''}</div><section class="customer-hero"><div><span class="eyebrow">ولعه في خدمتك</span><h2>كل طلباتك ومشاويرك في مكان واحد</h2><p>اختار احتياجك، وحدد موقعك، وتابع الطيار لحد الوصول.</p>${state.services.some(x=>x.key==='delivery'&&x.active)?'<button onclick="startService(\'delivery\')">اطلب توصيل الآن ←</button>':''}</div><span class="hero-emoji" aria-hidden="true">🛵</span></section><div class="section-heading"><h2>خدمات سريعة</h2></div><div class="quick-services">${state.services.some(x=>x.key==='delivery'&&x.active)?'<button onclick="startService(\'delivery\')"><svg viewBox="0 0 180 100" width="110" height="70" aria-hidden="true"><rect x="48" y="22" width="84" height="60" rx="12" fill="#ffddb9"/><path d="M48 42h84M79 23v26h22V23" fill="none" stroke="#af4b25" stroke-width="5"/><path d="M27 72h14M138 32h15" stroke="#e79561" stroke-width="5" stroke-linecap="round"/></svg><br><strong>توصيل غرض</strong><br><small>من نقطة لنقطة</small></button>':''}${state.services.some(x=>x.key.startsWith('ride_')&&x.active)?'<button onclick="startService(\'ride\')"><svg viewBox="0 0 180 100" width="110" height="70" aria-hidden="true"><path d="M35 63l17-29h73l19 29v17H35z" fill="#f9c46a"/><path d="M63 36l-12 24h77l-13-24" fill="#e8f5f1"/><circle cx="59" cy="79" r="12" fill="#355b53"/><circle cx="123" cy="79" r="12" fill="#355b53"/></svg><br><strong>اطلب مشوار</strong><br><small>اختار المركبة</small></button>':''}${state.services.filter(x=>x.key.startsWith('custom_')&&x.active).map(x=>`<button onclick="startService('custom','${x.key}')">✨<br><strong>${esc(x.name)}</strong></button>`).join('')}</div>${rideTiles()}<section id="merchant-section"><div class="section-heading"><div><h2>المحلات المتاحة</h2><p>اختار محلًا علشان تشوف منتجاته</p></div></div><div class="category-chips"><button class="${categoryFilter==='الكل'?'active':''}" onclick="chooseCategory('الكل')">الكل</button>${state.categories.filter(c=>c.active).map(c=>`<button class="${categoryFilter===c.name?'active':''}" onclick="chooseCategory(decodeURIComponent('${encodeURIComponent(c.name)}'))">${esc(c.name)}</button>`).join('')}</div><div class="merchant-grid" id="merchant-cards">${merchantCards()}</div></section><div id="draft-catalog-container">${draftCatalogHTML()}</div>`}
function productCards(){return catalogItems().map(p=>`<article class="product-card"><div class="product-picture">${p.image||p.catalog_preview?`<img src="${p.image||'/product-illustration/'+p.id+'.svg'}" alt="${esc(p.name)}">`:categoryLooks[p.category]?.[0]||'📦'}</div><small class="muted">${esc(p.category)} · متاح ${p.stock}${p.requires_prescription?' · يحتاج وصفة':''}</small><h3>${esc(p.name)}</h3><p class="price">${money(productPrice(p))}${soldByWeight(p)?' / كيلو':''}</p>${weightPicker(p)}<div class="quantity">${cart[p.id]?`<button aria-label="قلل ${esc(p.name)}" onclick="changeCart(${p.id},-1)">−</button><strong>${weightLabel(p,cart[p.id])}</strong><button aria-label="زود ${esc(p.name)}" onclick="changeCart(${p.id},1)">+</button>`:`<button class="add" onclick="changeCart(${p.id},1)">+ أضف للسلة</button>`}</div></article>`).join('')||'<div class="customer-empty">مافيش منتجات معروضة في المحل دلوقتي. جرّب محل تاني أو خدمة توصيل أي غرض.</div>'}
function renderStoreProducts(){let box=$('store-products');if(box)box.innerHTML=productCards()}
function cartDock(){return cartCount()?`<div class="cart-dock"><span><strong>${cartCount()} منتج</strong><br>${money(cartSubtotal())} قبل التوصيل</span><button onclick="goCustomer('checkout')">عرض السلة ←</button></div>`:''}
function prescriptionEntry(){return `<div class="card shift-card"><h2>اطلب أدويتك بالروشتة</h2><p>ارفع الروشتة من غير اختيار منتجات. نراجع الطلب ونبلغك بالإجمالي قبل التنفيذ، والطيار يشتري الأدوية من الصيدلية.</p><button onclick="startPrescription()">＋ إضافة الروشتة</button></div>`}
async function startPrescription(){if(cartCount()&&!(await window.appConfirm('طلب الروشتة مستقل وهيفرّغ السلة الحالية. تكمل؟',{title:'طلب روشتة جديد',confirmText:'نعم، أكمل'})))return;cart={};checkoutDraft={};checkoutFiles={};prescriptionOnly=true;shopAnywhere=false;kind='products';merchantId=state.merchants.find(m=>m.active&&m.category==='أدوية')?.id||0;goCustomer('checkout')}

function showDeliveryQuote(q,total){
  return new Promise(resolve=>{
    const previous=document.activeElement;
    const backdrop=document.createElement('div');
    backdrop.className='quote-backdrop';
    backdrop.setAttribute('role','presentation');
    const sheet=document.createElement('section');
    sheet.className='quote-sheet';
    sheet.setAttribute('role','dialog');
    sheet.setAttribute('aria-modal','true');
    sheet.setAttribute('aria-labelledby','quote-title');
    const icon=document.createElement('div');icon.className='quote-icon';icon.textContent='🛵';
    const title=document.createElement('h2');title.id='quote-title';title.textContent='مراجعة سعر التوصيل';
    const hint=document.createElement('p');hint.className='quote-hint';hint.textContent='ده حسابك النهائي قبل تأكيد الطلب.';
    const rows=document.createElement('div');rows.className='quote-rows';
    for(const [label,value,extra] of [['توصيلك',money(q.fee),''],['حسابك الإجمالي',money(total),'quote-total']]){
      const row=document.createElement('div');row.className='quote-row '+extra;
      const name=document.createElement('span');name.textContent=label;
      const amount=document.createElement('strong');amount.textContent=value;
      row.append(name,amount);rows.append(row);
    }
    const actions=document.createElement('div');actions.className='quote-actions';
    const cancel=document.createElement('button');cancel.type='button';cancel.className='quote-cancel';cancel.textContent='رجوع';
    const accept=document.createElement('button');accept.type='button';accept.className='quote-accept';accept.textContent='تأكيد وإرسال الطلب';
    actions.append(cancel,accept);sheet.append(icon,title,hint,rows,actions);backdrop.append(sheet);
    const finish=answer=>{document.removeEventListener('keydown',onKey);backdrop.remove();previous?.focus?.();resolve(answer)};
    const onKey=e=>{if(e.key==='Escape'){e.preventDefault();finish(false)}else if(e.key==='Tab'){const target=e.shiftKey?cancel:accept;if(document.activeElement===target){e.preventDefault();(e.shiftKey?accept:cancel).focus()}}};
    cancel.addEventListener('click',()=>finish(false));accept.addEventListener('click',()=>finish(true));
    backdrop.addEventListener('click',e=>{if(e.target===backdrop)finish(false)});
    document.addEventListener('keydown',onKey);document.body.append(backdrop);cancel.focus();
  });
}

const driverCheckedItems=new Map(),driverShopDrafts=new Map();
function markDriverItem(orderId,productId,checked){let selected=driverCheckedItems.get(orderId)||new Set();if(checked)selected.add(productId);else selected.delete(productId);driverCheckedItems.set(orderId,selected)}
function driverProductChecklist(o){if(!o.items?.length)return '';let selected=driverCheckedItems.get(o.id)||new Set();return `<section class="driver-products"><h3>المنتجات المطلوبة · ${o.items.length}</h3>${o.items.map(it=>`<label class="driver-product-item"><img src="${esc(it.image||'/icon.svg')}" alt="${esc(it.name)}" loading="lazy"><span><strong>${esc(it.name)}</strong><br>${esc(it.quantity)} ${esc(it.unit||'قطعة')} · ${money(it.unit_price*it.quantity)}</span>${['assigned','ready'].includes(o.status)?`<input type="checkbox" aria-label="تم شراء ${esc(it.name)}" ${selected.has(it.product_id)?'checked':''} onchange="markDriverItem(${o.id},${it.product_id},this.checked)">`:''}</label>`).join('')}</section>`}
function driverActions(o){return o.status==='offered'?`<div class="stack"><button onclick="act(${o.id},'accept_offer')">${o.shop_anywhere?'أقبل المهمة وأختار سوبر ماركت قريب':'أقبل المهمة وأتجه للاستلام'}</button><button onclick="act(${o.id},'decline_offer')">اعتذار؛ اعرضها على التالي</button></div>`:''}
function driverMapActions(o){if(!o||!o.driver_id||!['assigned','ready','picked_up','on_way'].includes(o.status))return '';let action=['assigned','ready'].includes(o.status)?`<button class="driver-primary-action" onclick="act(${o.id},'picked_up')">${o.shop_anywhere?'تم شراء المنتجات · اتجه للعميل':'استلمت المنتجات · اتجه للعميل'}</button>`:o.status==='picked_up'?`<button class="driver-primary-action" onclick="act(${o.id},'on_way')">بدأت الطريق للعميل</button>`:`<button class="driver-primary-action" onclick="act(${o.id},'delivered')">تم التسليم</button>`;let shop=o.shop_anywhere&&['ready','assigned'].includes(o.status)?`<label class="driver-shop-inline">اسم السوبر ماركت اللي اشتريت منه<input id="purchase-shop" value="${esc(driverShopDrafts.get(o.id)||'')}" oninput="driverShopDrafts.set(${o.id},this.value)" placeholder="مثلاً سوبر ماركت النور"></label>`:'';return `<div class="driver-map-actions">${shop}<div class="driver-map-action-row"><div class="order-call-controls map-call" id="order-call-${o.id}">${voiceCallControlsHTML(o.id)}</div>${action}</div></div>`}
async function submitQuote(id){let price=$('quote-'+id).value;if(price===''||!Number.isFinite(Number(price))||Number(price)<0){alert('اكتب سعرًا صحيحًا');return}try{await api('order/action',{id,action:'price',amount:price,delivery_amount:$('quote-delivery-'+id)?.value})}catch(e){alert(e.message)}}
async function act(id,action,amount){try{let purchase_shop='';const order=state.orders.find(o=>o.id===id);if(action==='picked_up'&&order?.items?.length){let selected=driverCheckedItems.get(id)||new Set();if(order.items.some(it=>!selected.has(it.product_id)))throw Error('علّم على كل منتج بعد ما تستلمه أو تشتريه');if(order.shop_anywhere){purchase_shop=$('purchase-shop')?.value.trim()||'';if(purchase_shop.length<3)throw Error('اكتب اسم أو عنوان السوبر ماركت اللي اشتريت منه')}}let cash_collected=false;if(action==='delivered'&&state.orders.find(o=>o.id===id)?.payment==='cash'){if(!await window.appConfirm('هل حصّلت المبلغ النقدي كاملًا من العميل؟',{title:'تأكيد تحصيل المبلغ',confirmText:'نعم، تم التحصيل',cancelText:'لا، رجوع',tone:'success'}))return;cash_collected=true}if(action==='accept_offer'){selectedTripId=id;driverView='trips'}let wallet_password;if(action==='settle_cash'){wallet_password=prompt('اكتب كلمة سر لوحة التحكم لتسجيل استلام الكاش');if(!wallet_password)return}await api('order/action',{id,action,amount,cash_collected,purchase_shop,wallet_password});if(action==='picked_up'){driverCheckedItems.delete(id);driverShopDrafts.delete(id)}}catch(e){alert(e.message)}}
function jumpAdmin(id){document.querySelectorAll('.admin-menu button').forEach(b=>{let active=b.dataset.section===id;b.classList.toggle('on',active);b.setAttribute('aria-pressed',String(active))});document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderAdminStats(){const stats=state.daily_stats||{day:'',customers:[],drivers:[]};return `<div class="card" id="admin-daily"><h3>حركة اليوم · ${esc(stats.day)}</h3><p class="muted">عدد الطلبات وقيمتها للعميل، والتسليمات للمندوب في يوم القاهرة. المسافة تقديرية من نقاط GPS أثناء مشاركة الموقع والعمل على طلب؛ لا تُحسب عند إغلاق التطبيق أو توقف المشاركة.</p><h4>العملاء</h4>${stats.customers.map(c=>`<div class="pill"><strong>${esc(c.name)}</strong> · ${esc(c.phone)} · ${c.orders_today} طلب اليوم · ${money(c.amount_today)}${state.orders.filter(o=>o.user_id===c.id).slice(0,5).map(o=>`<div class="muted">#${o.id} · ${esc(status[o.status]||o.status)} · ${money(o.total)} · ${esc(o.created_at)}</div>`).join('')}</div>`).join('')||'<div class="empty">لا توجد حسابات عملاء</div>'}<h4>الطيارون</h4>${stats.drivers.map(d=>`<div class="pill"><strong>${esc(d.name)}</strong> · ${esc(d.vehicle_type)} · ${d.delivered_today} طلب تم تسليمه اليوم · ${money(d.amount_today)} · ${(Number(d.meters_today||0)/1000).toFixed(2)} كم GPS${state.orders.filter(o=>o.driver_id===d.id).slice(0,5).map(o=>`<div class="muted">#${o.id} · ${esc(status[o.status]||o.status)} · ${money(o.total)} · ${esc(o.created_at)}</div>`).join('')}</div>`).join('')||'<div class="empty">لم تُضف طيارين بعد</div>'}</div>`}
function prepareRestaurant(index){$('m-name').value=listedRestaurants[index];$('m-category').value='مطاعم';jumpAdmin('admin-merchants');$('m-address').focus()}
function adminOverview(){let active=state.orders.filter(o=>!['delivered','cancelled'].includes(o.status)),waiting=active.filter(o=>o.status==='awaiting_driver'),review=active.filter(o=>['awaiting_quote','quote_pending','medicine_review','payment_review','new'].includes(o.status)),online=state.drivers.filter(d=>d.available&&d.location_at&&Date.now()-Date.parse(d.location_at)<300000).length;return `<section class="admin-overview"><div class="overview-hero"><div><span>نظرة مباشرة</span><h2>ملخص الإدارة</h2><p>آخر تحديث ${esc(new Date().toLocaleTimeString('ar-EG',{timeZone:'Africa/Cairo'}))} · تابع التشغيل من مكان واحد</p></div><button onclick="refresh()">↻ تحديث الآن</button></div><div class="overview-metrics"><button onclick="openAdminPage('admin-orders')"><span>طلبات جارية</span><strong>${active.length}</strong><small>اضغط لعرض الطلبات</small></button><button onclick="openAdminPage('admin-orders')"><span>بانتظار طيار</span><strong>${waiting.length}</strong><small>تحتاج تعيينًا</small></button><button onclick="openAdminPage('admin-orders')"><span>تحتاج مراجعة</span><strong>${review.length}</strong><small>موافقة أو تسعير</small></button><button onclick="openAdminPage('admin-driver-list')"><span>طيار بموقع حديث</span><strong>${online}</strong><small>متاح خلال آخر ٥ دقائق</small></button></div><div class="card overview-restaurants"><h3>تشغيل المحلات</h3><p class="muted">ثبت عنوان وموقع المطعم ثم أضف المنيو. طلبات المشاوير تُعرض على الطيار المناسب للمركبة.</p><div class="overview-restaurant-buttons">${listedRestaurants.map((name,i)=>state.merchants.some(m=>m.name===name)?'':`<button onclick="prepareRestaurant(${i})">إعداد ${esc(name)}</button>`).join('')||'<span class="ok">المطاعم السبعة مضافة إلى الإدارة ✓</span>'}</div></div></section>`}
let adminProductQuery='',adminProductLimit=40;
function adminProductItems(){return state.products.filter(p=>matchesSearch(p.name+' '+p.category,adminProductQuery))}
function refreshAdminProductList(){let box=$('admin-product-list');if(box)box.innerHTML=adminProductRows()}
function adminProductRows(){let items=adminProductItems(),visible=items.slice(0,adminProductLimit);return `<p class="admin-product-count">${items.length} منتج مطابق · عرض ${visible.length}</p><div class="admin-product-grid">${visible.map(p=>`<article class="admin-product-card"><div class="admin-product-head"><img src="${esc(p.image||'/product-illustration/'+p.id+'.svg')}" alt="${esc(p.name)}" loading="lazy" onerror="this.src='/icon.svg'"><div><strong>${esc(p.name)}</strong><small>${esc(p.category)}</small>${p.price_pending?'<span class="tag">مسودة · بدون سعر</span>':''}</div></div><div class="admin-product-fields"><label>المحل<select id="merchant-${p.id}">${state.merchants.filter(m=>m.category===p.category).map(m=>`<option value="${m.id}" ${p.merchant_id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label>السعر بالجنيه<input id="price-${p.id}" type="number" min="0" step="0.01" value="${p.price_pending?'':p.price}" placeholder="بدون سعر"></label><label>الكمية المتاحة<input id="stock-${p.id}" type="number" min="0" value="${p.stock}"></label></div>${p.category==='أدوية'?'<p class="muted">سعر العبوة كما هو، والتوصيل منفصل.</p>':`<div class="admin-product-quick"><span>زيادة سريعة للسعر</span><button type="button" onclick="addToPrice(${p.id},2)">+٢ ج</button><button type="button" onclick="addToPrice(${p.id},5)">+٥ ج</button></div>`}<div class="admin-product-checks"><label><input id="active-${p.id}" type="checkbox" ${p.active||p.price_pending?'checked':''}> إظهار للعميل بعد الحفظ</label><label><input id="rx-${p.id}" type="checkbox" ${p.requires_prescription?'checked':''}> يحتاج وصفة</label></div><div class="admin-product-actions"><button onclick="updateProduct(${p.id})">حفظ ونشر</button><button class="secondary" onclick="removeProduct(${p.id})">إخفاء المنتج</button></div></article>`).join('')}</div>${items.length>adminProductLimit?'<button class="admin-product-more" onclick="adminProductLimit+=40;refreshAdminProductList()">عرض المزيد</button>':''}`}
function addToPrice(id,amount){const input=$('price-'+id);if(!input||input.value.trim()===''||!Number.isFinite(Number(input.value)))return alert('اكتب السعر الأساسي الأول');input.value=(Math.round((Number(input.value)+amount)*100)/100).toFixed(2);input.focus()}
function downloadPriceSheet(){if(tab!=='admin'||!state?.products)return;const columns=['رقم المنتج','الاسم','القسم','السعر الحالي جنيه','الكمية','ظاهر','المحل','سعر مرجعي للمراجعة','مصدر المرجع','تاريخ مراجعة السعر'];const rows=state.products.map(p=>[p.id,p.name,p.category,p.price_pending?'':p.price,p.stock,p.active?'نعم':'لا',state.merchants.find(m=>m.id===p.merchant_id)?.name||'', '', '', '']);const csv=[columns,...rows].map(row=>row.map(value=>{let cell=String(value??'');if(/^[\s]*[=+\-@]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='اسعار-منتجات-ولعه.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}

alue="${esc(state.settings[v.key+'_extra']||'')}" placeholder="جنيه"></label><button onclick="saveRideRate('${v.key}')">حفظ</button></div>`).join('')}</div><div class="grid"><div class="card"><h3>ملخص الطلبات</h3><p>إجمالي الطلبات: ${state.orders.length}</p><p>طلبات جارية: ${state.orders.filter(o=>!['delivered','cancelled'].includes(o.status)).length}</p><p>طلبات مسلمة: ${state.orders.filter(o=>o.status==='delivered').length}</p><p>تحتاج مراجعة: ${state.orders.filter(o=>['new','medicine_review','payment_review','awaiting_quote'].includes(o.status)).length}</p><p>منتجات قاربت على النفاد (5 أو أقل): ${state.products.filter(p=>p.active&&p.stock<=5).length}</p><p>قيمة الطلبات المسلمة: ${money(state.orders.filter(o=>o.status==='delivered').reduce((v,o)=>v+o.total,0))}</p></div><div class="card" id="admin-cash"><h3>تحصيل الكاش</h3><p>في عهدة المندوبين: ${money(state.orders.filter(o=>o.payment==='cash'&&o.cash_collected&&!o.cash_settled).reduce((v,o)=>v+o.total,0))}</p><p>تمت تسويته: ${money(state.orders.filter(o=>o.payment==='cash'&&o.cash_settled).reduce((v,o)=>v+o.total,0))}</p></div></div><div class="card" id="admin-services"><h3>الخدمات</h3><label>خدمة جديدة بتسعير يدوي</label><input id="service-name" placeholder="مثال: توصيل مستندات"><button onclick="createService()">إضافة خدمة</button>${state.services.map(s=>`<div class="row"><span>${esc(s.name)}</span><button onclick="toggleService('${s.key}',${s.active?'false':'true'})">${s.active?'إيقاف مؤقت':'تشغيل'}</button></div>`).join('')}</div><h2 id="admin-orders">الطلبات (${state.orders.length})</h2><div class="catalog-tools"><label>عرض الطلبات<select id="order-filter" onchange="orderFilter=this.value;render()">${options(['الجارية','تحتاج مراجعة','المنتهية','الكل'],orderFilter)}</select></label></div>${state.orders.filter(o=>orderFilter==='الكل'||(orderFilter==='المنتهية'?['delivered','cancelled'].includes(o.status):orderFilter==='تحتاج مراجعة'?['new','medicine_review','payment_review','awaiting_quote'].includes(o.status):!['delivered','cancelled'].includes(o.status))).map(o=>orderCard(o,'admin')).join('')||'<div class="empty">لا توجد طلبات في هذا العرض</div>'}<h2>المنتجات والمندوبون</h2><div class="card"><button type="button" onclick="downloadPriceSheet()">تنزيل كشف أسعار كل المنتجات CSV</button><p class="muted">الكشف فيه السعر والمخزون وحالة النشر لكل منتج. خانات السعر المرجعي ومصدره وتاريخ مراجعته فاضية للتدقيق؛ لا تعتمد على سعر قديم أو منتج بحجم مختلف. <a href="https://www.agriprice.gov.eg/local-prices" target="_blank" rel="noopener">بوابة الأسعار المحلية</a> مرجع للسلع العامة، وسعر الدواء يُنقل من العبوة أو الصيدلية.</p></div>${!state.merchants.some(m=>m.active&&m.category!=='مطاعم')?'<div class="notice">المنتجات مش هتظهر للعميل حاليًا: مفيش محل منتجات نشط. أضف محلًا من قسم «المحلات» وحدد موقعه، ثم اربط المنتجات به واحفظ السعر والكمية وزر الإظهار.</div>':''}<label>ابحث في المنتجات<input aria-label="ابحث في منتجات الإدارة" value="${esc(adminProductQuery)}" oninput="adminProductQuery=this.value;adminProductLimit=40;refreshAdminProductList()" placeholder="اسم المنتج أو القسم"></label><div class="grid"><div class="card" id="admin-product-list">${adminProductRows()}</div><div class="card">${state.drivers.map(d=>`<div class="pill">${esc(d.name)} · ${esc(d.area)} · ${esc(d.phone)} · المستخدم: ${esc(d.username||'رقم الهاتف')} · ${d.available?"متاح":"غير متاح"} <button onclick="resetDriverPassword(${d.id})">إعادة تعيين كلمة المرور</button> <button onclick="driverAvailable(${d.id},${d.available?"false":"true"})">تغيير التوافر</button> ${d.location_at?`· <a href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}#map=16/${d.lat}/${d.lon}" target="_blank" rel="noopener">آخر موقع (${esc(d.location_at)})</a>`:"· الموقع لم يُشارك"}</div>`).join('')||'لم تضف مندوبًا'}</div></div>`}
function renderProductMerchantChoices(){if(!$('p-category')||!$('p-merchant'))return;let category=$('p-category').value;for(let o of $('p-merchant').options)o.hidden=o.dataset.category!==category;let first=[...$('p-merchant').options].find(o=>!o.hidden);if(first)$('p-merchant').value=first.value}
async function setupWarehouse(){if(!merchantPoint)return alert('حدد مكان استلام البضاعة الحقيقي على الخريطة');let address=$('m-address').value.trim();if(!address)return alert('اكتب عنوان الاستلام بالتفصيل');try{await api('warehouse/setup',{area:$('m-area').value,address,...merchantPoint});merchantPoint=null;alert('اتحفظ موقع الاستلام واتربطت به المنتجات. أي منتج له سعر وكمية محفوظين هيظهر للعميل؛ والباقي اضغط نشر للعميل بعد كتابة سعره وكميته.')}catch(e){alert(e.message)}}

async function updateProduct(id){try{const price=$('price-'+id).value.trim(),stock=$('stock-'+id).value.trim(),active=$('active-'+id).checked,merchantId=Number($('merchant-'+id).value)||0;if(!price)throw Error('أضف سعر المنتج أولًا');if(!stock)throw Error('أضف الكمية المتاحة أولًا');if(active&&Number(stock)<=0)throw Error('اكتب كمية أكبر من صفر عشان المنتج يظهر للعميل');if(active&&!merchantId&&!state.settings.warehouse_address)throw Error('ثبت مكان استلام البضاعة مرة واحدة من قسم المحلات');await api('product/update',{id,price,stock,merchant_id:merchantId,active,requires_prescription:$('rx-'+id).checked});const saved=state.products.find(p=>p.id===id),merchant=state.merchants.find(m=>m.id===saved?.merchant_id),category=state.categories.find(c=>c.name===saved?.category);alert(saved?.active&&saved?.stock>0&&merchant?.active&&category?.active?'اتحفظ السعر والمنتج ظاهر للعميل دلوقتي.':'اتحفظ السعر، لكن المنتج مش ظاهر للعميل. راجع زر الإظهار والكمية والمحل والقسم.')}catch(e){alert(e.message)}}
let locationWatch=null,lastLocation=0,locationAccount=null,locationPaused=false,locationAttempted=false,locationStatus='جارٍ تحديد الموقع تلقائيًا…';
function updateLocationStatus(){const el=$('driver-location-status');if(el)el.textContent=locationStatus}
function stopLocation(manual=true){if(locationWatch!==null)navigator.geolocation?.clearWatch(locationWatch);locationWatch=null;if(manual){locationPaused=true;locationStatus='مشاركة الموقع متوقفة باختيارك';updateLocationStatus()}}
function startLocation(){if(!state||tab!=='driver')return;if(!navigator.geolocation){locationStatus='الموقع غير متاح على هذا الجهاز';updateLocationStatus();return}if(locationWatch!==null)return;locationPaused=false;locationAttempted=true;lastLocation=0;locationStatus='جارٍ تحديد الموقع…';updateLocationStatus();const account=state.user.id;locationWatch=navigator.geolocation.watchPosition(async pos=>{if(!state||tab!=='driver'||state.user.id!==account)return;if(Date.now()-lastLocation<15000)return;lastLocation=Date.now();try{await api('location',{lat:pos.coords.latitude,lon:pos.coords.longitude});locationStatus='موقعك يُحدّث تلقائيًا أثناء فتح التطبيق';updateLocationStatus()}catch(e){locationStatus='تعذر إرسال الموقع؛ سنحاول مع التحديث التالي';updateLocationStatus()}},e=>{locationStatus=e.code===1?'اسمح بالموقع من إعدادات الجهاز ثم اضغط إعادة المحاولة':'تعذر تحديد موقعك؛ تأكد من تشغيل GPS';if(e.code===1)stopLocation(false);updateLocationStatus()},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}
function syncDriverAutomation(){if(tab!=='driver'){stopLocation(false);locationAccount=null;locationAttempted=false;return}if(locationAccount!==state.user.id){stopLocation(false);locationAccount=state.user.id;locationPaused=false;locationAttempted=false}if(state.driver_profile?.identity_blocked_shift){stopLocation(false);return}if(!locationPaused&&!locationAttempted)startLocation();autoStartOrderSound()}
async function autoStartOrderSound(){if(!state||!['driver','admin'].includes(tab))return;if(localStorage.getItem('wallaha_sound_muted')==='1')return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!driverAudio||driverAudio.state==='closed')driverAudio=new Audio();if(driverAudio.state!=='running')await driverAudio.resume();driverSoundEnabled=driverAudio.state==='running';updateSoundStatus()}catch(e){}}
let notificationAsked=false;
function activateOrderPermissions(){if(state&&['driver','admin'].includes(tab)){autoStartOrderSound();if(!notificationAsked&&'Notification' in window&&Notification.permission==='default'){notificationAsked=true;Notification.requestPermission().catch(()=>{})}}}
document.addEventListener('pointerdown',activateOrderPermissions,{passive:true});document.addEventListener('keydown',activateOrderPermissions);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state&&tab==='driver'){if(!locationPaused){locationAttempted=false;syncDriverAutomation()}refresh()}});

function driverAvatar(photo,name){return photo?`<img class="driver-avatar" src="${esc(photo)}" alt="صورة ${esc(name||'الطيار')}">`:`<span class="driver-avatar driver-avatar-fallback">${esc((name||'ط').trim().charAt(0))}</span>`}
async function compressDriverPhoto(file){if(!file.type.startsWith('image/'))throw Error('اختر صورة من المعرض');if(file.size>10_000_000)throw Error('الصورة الأصلية أكبر من 10 ميجابايت');let url=URL.createObjectURL(file);try{let img=new Image();img.src=url;await img.decode();let scale=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let photo=canvas.toDataURL('image/jpeg',0.82);if(photo.length>1_500_000)photo=canvas.toDataURL('image/jpeg',0.6);if(photo.length>1_500_000)throw Error('الصورة كبيرة بعد التصغير؛ اختر صورة أخرى');return photo}finally{URL.revokeObjectURL(url)}}
let driverPhotoDraft=null,driverPhotoPreview='',driverPhotoBusy=false,driverPhotoGeneration=0;
function clearDriverPhotoDraft(){driverPhotoGeneration++;driverPhotoDraft=null;driverPhotoPreview='';driverPhotoBusy=false}
async function selectDriverPhoto(input){const file=input.files?.[0];if(!file)return;const generation=++driverPhotoGeneration;driverPhotoDraft=file;driverPhotoPreview='';driverPhotoBusy=true;let message=$('driver-photo-status');if(message)message.textContent='جاري تجهيز الصورة…';try{const photo=await compressDriverPhoto(file);if(generation!==driverPhotoGeneration)return;driverPhotoPreview=photo;const preview=$('driver-photo-preview');if(preview){preview.src=photo;preview.hidden=false}if($('driver-photo-status'))$('driver-photo-status').textContent='الصورة جاهزة. اضغط حفظ الصورة.'}catch(e){if(generation===driverPhotoGeneration){driverPhotoDraft=null;if($('driver-photo-status'))$('driver-photo-status').textContent=e.message}}finally{if(generation===driverPhotoGeneration)driverPhotoBusy=false}}
async function saveDriverPhoto(){if(driverPhotoBusy)return alert('انتظر تجهيز الصورة');const file=$('driver-photo')?.files?.[0]||driverPhotoDraft;if(!file)return alert('اختر صورة أولًا');driverPhotoBusy=true;const button=$('driver-photo-save');if(button)button.disabled=true;try{const photo=driverPhotoPreview||await compressDriverPhoto(file);await api('driver/photo',{photo});clearDriverPhotoDraft();render();alert('تم حفظ الصورة')}catch(e){if($('driver-photo-status'))$('driver-photo-status').textContent=e.message;else alert(e.message)}finally{driverPhotoBusy=false;if($('driver-photo-save'))$('driver-photo-save').disabled=false}}

function driverSettingsPage(p){return `<div class="driver-settings-page"><a class="route-link" href="/driver">→ رجوع للمشاوير</a><div class="card"><h2>⚙ إعدادات الطيار</h2><h3>ملفي الشخصي</h3><div class="driver-identity">${driverAvatar(p.photo,p.name)}<div><strong>${esc(p.name||state.user.name)}</strong><p>📞 ${esc(p.phone||state.user.phone)}</p><p>${esc(p.vehicle_type||'')} · ${esc(p.area||'')}</p><p>⭐ متوسط التقييم: ${state.my_rating?.count?state.my_rating.average+' / ٥ من '+state.my_rating.count+' تقييم':'لا توجد تقييمات بعد'}</p></div></div><label>صورتي الشخصية (حتى 10 ميجابايت؛ يتم تصغيرها تلقائيًا)<input id="driver-photo" type="file" accept="image/png,image/jpeg,image/webp" onchange="selectDriverPhoto(this)"></label><img id="driver-photo-preview" ${driverPhotoPreview?`src="${driverPhotoPreview}"`:'hidden'} alt="معاينة الصورة المختارة" style="width:130px;height:130px;object-fit:cover;border-radius:18px"><p id="driver-photo-status" role="status">${driverPhotoDraft?'الصورة المختارة محفوظة مؤقتًا؛ اضغط حفظ الصورة.':''}</p><button id="driver-photo-save" onclick="saveDriverPhoto()" ${driverPhotoBusy?'disabled':''}>حفظ الصورة</button></div><div class="card"><h3>كلمة المرور</h3>${accountPanel()}${emailRecoveryPanel()}${driverBreakPanel(p)}${driverSoundPanel()}<section class="card"><h3>الموقع والتنبيهات</h3><p id="driver-location-status">${esc(locationStatus)}</p><button onclick="startLocation()">السماح بالموقع / إعادة المحاولة</button><button onclick="enableNotifications()">السماح بالإشعارات</button></section>${supportSettingsPanel()}<button class="driver-settings-logout" onclick="logout()">تسجيل الخروج</button></div></div>`}
function renderDriver(){if(state.driver_profile?.identity_blocked_shift)return `<section class="card shift-card"><h2>حسابك موقوف لمراجعة الهوية</h2><p>أصدرت الإدارة إنذارًا على صورة الشيفت. تواصل معها لتأكيد هوية صاحب الحساب وإعادة التفعيل.</p>${supportSettingsPanel()}<button onclick="logout()">تسجيل الخروج</button></section>`;if(state.shift_required&&driverView!=='history')return `<section class="driver-shift-gate">${driverShiftPanel(true)}<button onclick="driverView='history';render()">💬 سجل الطلبات والشات</button></section>`;let p=state.driver_profile||{},w=state.driver_wallet||{balance:0,paid:0,cash_due:0,entries:[]};if(location.pathname==='/driver/settings')return driverSettingsPage(p);let content=driverView==='wallet'?driverWalletView(w):driverView==='history'?renderDriverHistory():driverView==='shift'?driverShiftPanel():renderDriverOld();return `<section class="driver-app-heading"><h2>ولعه · الطيار</h2><p>أهلًا ${esc(state.user.name)} · ${state.driver_shift?'الشيفت مفتوح':'الشيفت لم يبدأ'}</p></section>${state.shift_second_required?'<section class="app-shift-reminder" role="alert"><strong>حان موعد صورة متابعة الشيفت</strong><p>عدّت ٦ ساعات من بدايته. التقط صورة وجهك الآن؛ تقدر تكمل الطلب الجاري أثناء ذلك.</p><button onclick="openShiftCamera(true)">📷 تصوير الآن</button></section>':''}<nav class="driver-nav driver-top-tabs"><button class="${driverView==='trips'?'on':''}" onclick="driverView='trips';render()">الطلبات الجارية</button><button class="${driverView==='history'?'on':''}" onclick="driverView='history';render()">سجل الطلبات</button><button class="${driverView==='wallet'?'on':''}" onclick="driverView='wallet';render()">المحفظة</button><button class="${driverView==='shift'?'on':''}" onclick="driverView='shift';render()">الشيفت</button><a class="route-link" href="/driver/settings">الإعدادات</a></nav>${content}`}
function adminDriverWallets(){return protectedWalletPage()}
async function setDriverEarning(id,paid){if(paid&&!confirm('هل صرفت هذا المستحق للطيار بالفعل؟ هذا الزر يسجل الصرف فقط.'))return;try{const wallet_password=prompt('اكتب كلمة سر لوحة التحكم لتأكيد تعديل المحفظة');if(!wallet_password)return;await api('driver/earning',paid?{id,paid:true,wallet_password}:{id,amount:$('earning-'+id).value,wallet_password})}catch(e){alert(e.message)}}
function renderDriverHistory(){let history=state.orders.filter(o=>['delivered','cancelled'].includes(o.status)),chosen=history.find(o=>o.id===selectedTripId)||history[0];return `<h2>سجل الطلبات والشات</h2>${tripDetails(chosen,'driver')}${history.filter(o=>o.id!==chosen?.id).map(o=>orderCard(o,'driver')).join('')||(!chosen?'<div class="empty">لا توجد طلبات مكتملة بعد.</div>':'')}`}
function renderDriverOld(){let active=state.orders.filter(o=>!['cancelled','delivered'].includes(o.status)),current=active.find(o=>['assigned','ready','picked_up','on_way'].includes(o.status)),chosen=active.find(o=>o.id===selectedTripId)||current||active.find(o=>o.status==='offered'),heading=current?(['picked_up','on_way'].includes(current.status)?'اتجه إلى العميل':'اتجه إلى مكان الاستلام'):active.length?'طلبات جديدة متاحة لك':'في انتظار الطلبات';return `<section class="driver-map-stage" aria-label="خريطة الطيار"><div class="driver-map-heading"><strong>🧭 ${heading}</strong><span>${current?'الخط يتغير حسب خطوة الطلب':active.length?'اختر طلبًا من القائمة أسفل الخريطة':'سيظهر موقعك هنا عند تفعيله'}</span></div><div id="driver-map" class="map driver-live-map" aria-label="خريطة الطلبات ومسار الطيار"></div>${driverNavigationButton(current||chosen)}${driverMapActions(current||chosen)}</section><section class="driver-order-sheet"><div class="driver-order-sheet-head"><div><span class="eyebrow">ولعه · الطيار</span><h2>${current?'الطلب الجاري':active.length?'الطلبات المعروضة إليك':'لا توجد طلبات الآن'}</h2></div><span class="tag">${active.length} ${active.length===1?'طلب':'طلبات'}</span></div>${chosen?tripDetails(chosen,'driver'):!active.length?'<div class="empty">أول ما يوصلك طلب هيظهر هنا، وهتلاقي مكان الاستلام أو الوصول على الخريطة.</div>':''}${active.filter(o=>o.id!==chosen?.id).map(o=>orderCard(o,'driver')).join('')}</section>`}
function loginViewLegacy(){if(location.pathname==='/admin')return `<div class="card" style="max-width:460px;margin:auto"><h2>دخول المسؤول</h2><p class="muted">لوحة التحكم خاصة بصاحب تطبيق ولعه فقط.</p><label>اسم المستخدم</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password" autocomplete="current-password"><button onclick="login()">دخول لوحة التحكم</button></div>`;if(location.pathname.startsWith('/driver'))return `<div class="card" style="max-width:460px;margin:auto"><h2>دخول تطبيق الطيار</h2><p>حسابك الخاص في ولعه، مشاويرك ومحفظتك.</p><label>إيميل الطيار أو اسم المستخدم أو رقم الهاتف</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password" autocomplete="current-password"><button onclick="login()">دخول حسابي</button><button class="secondary" onclick="alert('لو نسيت كلمة المرور، تواصل مع مسؤول ولعه للتحقق من هويتك وإعطائك كلمة مرور مؤقتة. بعد الدخول غيّرها من الإعدادات.')">نسيت كلمة المرور؟</button><p class="muted">المسؤول ينشئ حسابك باسمك من لوحة التحكم.</p></div>`;return `<div class="card" style="background:#ecf8ef;text-align:center"><h2>شوف تطبيق ولعه من جوه</h2><p class="muted">تصفح الأقسام والمحلات والمنتجات من غير حساب. تسجيل الدخول مطلوب وقت إرسال الطلب فقط.</p><button onclick="browsePreview()">تصفح التطبيق بدون تسجيل</button></div><div class="grid"><div class="card"><h2>دخول ولعه</h2><label>اسم المستخدم أو رقم الهاتف</label><input id="login-phone" autocomplete="username"><label>كلمة المرور</label><input id="login-pass" type="password"><button onclick="login()">دخول</button><p class="muted">تطبيق العميل · الطلبات والتوصيل</p></div><div class="card"><h2>حساب عميل جديد</h2><label>الاسم</label><input id="reg-name"><label>رقم الهاتف</label><input id="reg-phone" inputmode="tel"><label>كلمة مرور (10 أحرف على الأقل)</label><input id="reg-pass" type="password"><button onclick="register()">إنشاء حساب</button></div></div>`}
async function browsePreview(silent=false){if(expectedAppRole&&expectedAppRole!=='customer'){state=null;previewMode=false;render();return}try{let r=await fetch('/api/catalog');if(!r.ok)throw Error('تعذر تحميل الأقسام');let catalog=await r.json();previewMode=true;state={...catalog,user:{name:'زائر',phone:''},orders:[],settings:{wallet:''}};tab='customer';acceptSharedRideDestination();render()}catch(e){previewMode=false;state=null;render();if(!silent)alert(e.message)}}
function leavePreview(){previewMode=false;state=null;render()}
async function login(){try{let v=await api(location.pathname==='/admin'?'admin/login':'login',{phone:$('login-phone').value,password:$('login-pass').value,expected_role:expectedAppRole});token=v.token;previewMode=false;localStorage.setItem(appTokenKey,token);await refresh()}catch(e){alert(e.message)}}
async function registerLegacy(){try{await api('register',{name:$('reg-name').value,phone:$('reg-phone').value,password:$('reg-pass').value});alert('تم إنشاء الحساب. سجل الدخول الآن.')}catch(e){alert(e.message)}}
function stopAllVoiceCalls(){for(const session of voiceCallSessions.values()){session.pc.close();session.stream.getTracks().forEach(t=>t.stop())}voiceCallSessions.clear();voiceCallViews.clear();let audio=$('order-call-audio');if(audio)audio.srcObject=null}
async function logout(){if(previewMode)return leavePreview();try{await api('logout',{})}catch(e){}stopLocation(false);stopAllVoiceCalls();locationAccount=null;locationAttempted=false;token='';localStorage.removeItem(appTokenKey);localStorage.removeItem('wallaha_token');state=null;chatDrafts.clear();chatCache.clear();checkoutDraft={};checkoutFiles={};rememberedAccount='';chosenPoint=null;chosenPickup=null;merchantPoint=null;trackingOrderId=null;render();checkoutDraft={};checkoutFiles={}}
async function changePassword(){let old=$('current-pass').value, next=$('new-pass').value;if(!old||next.length<10){alert('اكتب كلمة المرور الحالية وجديدة من 10 أحرف على الأقل');return}try{await api('change-password',{current_password:old,new_password:next});alert('تم تغيير كلمة المرور وإغلاق الجلسات الأخرى')}catch(e){alert(e.message)}}
function accountPanel(){return `<details class="card"><summary>إعدادات حسابي</summary><label>كلمة المرور الحالية</label><input id="current-pass" type="password" autocomplete="current-password"><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="new-pass" type="password" autocomplete="new-password"><button onclick="changePassword()">تغيير كلمة المرور</button></details>`}
function render(){if(!state){clearDriverPhotoDraft();clearPrivateSessionData();stopLocation(false);locationAccount=null;locationAttempted=false}document.body.classList.toggle('driver-screen',!!state&&tab==='driver'&&location.pathname==='/driver');$('driver-settings-top').style.display=state&&tab==='driver'&&location.pathname==='/driver'?'grid':'none';saveChatDrafts();cleanupCustomerArchive();saveCheckoutDraft();clearMaps();$('logout').style.display=state&&tab!=='driver'?'block':'none';$('logout').textContent=previewMode?'دخول':'تسجيل الخروج';$('reload').style.display=state&&!previewMode?'block':'none';$('app').innerHTML=(offline?'<div class="connection-status">الاتصال غير متاح الآن. الطلبات تحتاج اتصالًا بالإنترنت. اضغط تحديث الطلبات عند عودته.</div>':'')+(!state?(appRoleError?'<div class="connection-status" role="alert">'+esc(appRoleError)+'</div>':'')+loginView():(tab==='customer'?renderCustomer():tab==='admin'?renderAdmin():renderDriver())+(previewMode||tab==='customer'||tab==='driver'?'':accountPanel()));restoreCheckoutDraft();initMaps();if(state&&tab==='admin')renderProductMerchantChoices();if(state&&tab==='admin')enforceStaffReadOnly();pollOrderChat();pollOrderCalls();paintSupport()}
let lastCatalogRefresh=Date.now();
