name: Build Android apps
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apks.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build three installable APKs
        working-directory: android-app
        run: gradle :app:assembleCustomerDebug :app:assembleAdminDebug :app:assembleDriverDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wallah-android-apps
          path: android-app/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
