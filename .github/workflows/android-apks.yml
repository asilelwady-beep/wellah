name: Build Android apps
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apks.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build three installable APKs
        working-directory: android-app
        run: gradle :app:assembleCustomerDebug :app:assembleAdminDebug :app:assembleDriverDebug --no-daemon
      - name: Build release packages
        working-directory: android-app
        run: gradle :app:assembleAdminRelease :app:assembleDriverRelease --no-daemon
      - name: Sign release packages
        shell: bash
        run: |
          set -euo pipefail
          SIGN_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$SIGN_PASS"
          export SIGN_PASS
          keytool -genkeypair -keystore "$RUNNER_TEMP/wallah.jks" -storepass "$SIGN_PASS" -keypass "$SIGN_PASS" -alias wallah -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Wallah, OU=Android, O=Wallah, C=EG"
          mkdir -p signed-apks
          for role in admin driver; do
            unsigned="android-app/app/build/outputs/apk/$role/release/app-$role-release-unsigned.apk"
            aligned="$RUNNER_TEMP/$role-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$unsigned" "$aligned"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/wallah.jks" --ks-key-alias wallah --ks-pass env:SIGN_PASS --key-pass env:SIGN_PASS --out "signed-apks/wallah-$role-release.apk" "$aligned"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "signed-apks/wallah-$role-release.apk"
          done
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check installation on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install android-app/app/build/outputs/apk/customer/debug/app-customer-debug.apk
            adb install android-app/app/build/outputs/apk/admin/debug/app-admin-debug.apk
            adb install android-app/app/build/outputs/apk/driver/debug/app-driver-debug.apk
            adb install signed-apks/wallah-admin-release.apk
            adb install signed-apks/wallah-driver-release.apk
            adb shell am start -n com.wallah.adminapp/com.wallah.app.MainActivity
            adb shell am start -n com.wallah.driverapp/com.wallah.app.MainActivity
            adb shell pm list packages | grep -E 'com.wallah.(customer|adminapp|driverapp)'
      - uses: actions/upload-artifact@v4
        with:
          name: wallah-signed-release-apks
          path: signed-apks/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wallah-android-apps
          path: android-app/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
