name: Build Android apps
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apks.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build three installable APKs
        working-directory: android-app
        run: gradle :app:assembleCustomerDebug :app:assembleAdminDebug :app:assembleDriverDebug --no-daemon
      - name: Build release packages
        working-directory: android-app
        run: gradle :app:assembleAdminRelease :app:assembleDriverRelease --no-daemon
      - name: Sign release packages
        shell: bash
        run: |
          set -euo pipefail
          SIGN_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$SIGN_PASS"
          export SIGN_PASS
          keytool -genkeypair -keystore "$RUNNER_TEMP/wallah.jks" -storepass "$SIGN_PASS" -keypass "$SIGN_PASS" -alias wallah -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Wallah, OU=Android, O=Wallah, C=EG"
