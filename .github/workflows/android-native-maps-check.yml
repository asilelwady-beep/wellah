name: Check native Android maps
on:
  pull_request:
    paths: ['android-app/**', 'maps.js', 'tests/test_native_maps.cjs', '.github/workflows/android-native-maps-check.yml']
jobs:
  native-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify web-native bridge
        run: node tests/test_native_maps.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and Android compilation without an activation key
        working-directory: android-app
        run: gradle :app:testCustomerDebugUnitTest :app:assembleCustomerDebug :app:assembleDriverDebug :app:assembleAdminDebug --no-daemon
