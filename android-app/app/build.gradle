plugins { id 'com.android.application' }

def androidMapsKey = providers.gradleProperty('WALLAHA_ANDROID_MAPS_API_KEY')
    .orElse(providers.environmentVariable('WALLAHA_ANDROID_MAPS_API_KEY')).getOrElse('').trim()

android {
    namespace 'com.wallah.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.wallah.app'
        minSdk 24
        targetSdk 36
        versionCode 24
        versionName '1.1.13'
        manifestPlaceholders = [androidMapsApiKey: androidMapsKey]
        buildConfigField 'boolean', 'NATIVE_MAPS_CONFIGURED', (!androidMapsKey.isEmpty()).toString()
    }
    flavorDimensions 'role'
    productFlavors {
        customer {
            dimension 'role'
            applicationId 'com.wallah.customer'
            resValue 'string', 'app_name', 'ولعه'
            buildConfigField 'String', 'HOME_URL', '"https://walla3ha.com/customer"'
        }
        admin {
            dimension 'role'
            applicationId 'com.wallah.management'
            resValue 'string', 'app_name', 'ولعه - الإدارة'
            buildConfigField 'String', 'HOME_URL', '"https://walla3ha.com/admin"'
        }
        driver {
            dimension 'role'
            applicationId 'com.wallah.courier'
            resValue 'string', 'app_name', 'ولعه - الطيار'
            buildConfigField 'String', 'HOME_URL', '"https://walla3ha.com/driver"'
        }
    }
    buildTypes { debug { applicationIdSuffix '.debug' } }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:20.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
